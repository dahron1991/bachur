const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- תמונה בטוחה ----------
   כל תמונה באפליקציה מגיעה מאחד משניים בלבד: data URL שנוצר כאן
   בדפדפן אחרי החיתוך, או קישור חתום מהשרת (https).

   כל ערך אחר הגיע מנתון ששתלו. הדוגמה המסוכנת: בן משפחה עם סיסמת
   אורח יכול לכתוב ישירות לטבלת הבקשות — זה מותר לו בכוונה — ואין
   שום אילוץ על תוכן השדה payload. אם הוא שותל שם מחרוזת שסוגרת
   את המאפיין src ומוסיפה מטפל שגיאה, הקוד שלו רץ אצל **המנהל**
   ברגע שהוא פותח את תור הבקשות — ומשם גם האסימון שלו.

   לכן הכתובת גם נבדקת וגם עוברת בריחה, במקום אחד, ולא בשבעה. */
const SAFE_IMG = /^(?:data:image\/(?:png|jpe?g|webp|gif);base64,[A-Za-z0-9+/=]+|https:\/\/[^\s"'<>\\]+)$/i;
const safeImg = src => SAFE_IMG.test(String(src || '')) ? String(src) : '';
/* מחזיר תגית img מלאה, או מחרוזת ריקה אם הכתובת אינה מוכרת */
const imgTag = (src, attrs) => {
  const ok = safeImg(src);
  return ok ? '<img src="' + esc(ok) + '"' + (attrs ? ' ' + attrs : '') + '>' : '';
};
const fullName = p => p ? (p.name + ' ' + (p.surname || '')).trim() : 'אדם שנמחק';
const tintOf   = p => p.gender === 'male' ? 'var(--male)' : 'var(--female)';

/* מה שמופיע מתחת לשם ברשימות: הקשר המשפחתי.
   כששני אנשים נושאים בדיוק אותו שם, מוסיפים שנת לידה כדי להבדיל.
   שים לב: הזיהוי במערכת הוא תמיד לפי מזהה ייחודי, לעולם לא לפי שם. */
const personSubtitle = p => relationText(p.id);

/* עיגול עם תמונה, או האות הראשונה כשאין */
/* השם 'gring' ולא 'ring': הכיתה ring כבר תפוסה בידי טבעת הפעולות
   שסביב כרטיס בעץ, והיא position:absolute. העיגול ירש את זה,
   יצא מזרימת ה-flex, וישב על השם בכל רשימה באפליקציה. */
const dotHTML = (photo, letter, tint, ring) =>
  '<span class="dot' + (ring ? ' gring' : '') + '" style="background:' + tint +
    ';overflow:hidden' + (ring ? ';outline-color:' + tint : '') + '">' +
  (imgTag(photo, 'style="width:100%;height:100%;object-fit:cover"')
     || esc(letter || '?')) + '</span>';

/* הדגשת מה שהוקלד. החלוקה נעשית על הטקסט הגולמי וכל חלק מוברח
   בנפרד — פיצול של טקסט שכבר הוברח היה יכול לחתוך ישות HTML
   באמצע (חיפוש "amp" בתוך &amp;) ולשבור את השורה. */
function markHit(text, q){
  const t = String(text == null ? '' : text), n = String(q || '').trim();
  if(!n) return esc(t);
  const i = t.indexOf(n);
  if(i < 0) return esc(t);
  return esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + n.length)) + '</mark>' +
         esc(t.slice(i + n.length));
}

/* סדר אלפביתי לרשימות: שם פרטי, ובשוויון שם משפחה. סדר העץ אינו
   אומר דבר למי שמחפש. */
const byFirstName = (a, b) =>
  (a.name || '').localeCompare(b.name || '', 'he') ||
  (a.surname || '').localeCompare(b.surname || '', 'he');

/* שורת אדם לרשימות. q — מה שהוקלד, להדגשה. */
function personRow(p, right, cls, q){
  return '<button class="prow" data-id="' + p.id + '">' +
    dotHTML(p.thumb || p.photo, p.name.charAt(0), tintOf(p), true) +
    '<span class="who"><b>' + markHit(fullName(p), q) + '</b><span>' +
      markHit(right || '', q) + '</span></span>' +
    (cls ? '<span class="cnt ' + cls.c + '">' + esc(cls.t) + '</span>' : '') +
    '</button>';
}

/* ---------- בחירת אדם עם חיפוש ---------- */
function pickPerson(onPick, onBack){
  const list = visiblePeople().sort(byFirstName);
  openPanel('בחירת בן משפחה',
    '<div class="field"><input id="pkq" placeholder="חיפוש לפי שם" autocomplete="off"></div>' +
    '<div id="pklist"></div>',
    () => {
      const q = document.getElementById('pkq'), box = document.getElementById('pklist');
      const draw = () => {
        const t = (q.value || '').trim();
        const hit = t ? list.filter(p => fullName(p).includes(t)) : list;
        box.innerHTML = hit.length
          ? hit.map(p => personRow(p, personSubtitle(p), null, t)).join('')
          : '<p class="empty">לא נמצא אף אחד בשם הזה</p>';
      };
      q.addEventListener('input', draw);
      box.addEventListener('click', e => {
        const r = e.target.closest('.prow');
        if(r) onPick(r.dataset.id);
      });
      draw();
    }, onBack);
}

/* ---------- טופס הוספה ---------- */
const REL = {parent:'הורה', child:'ילד/ה', sibling:'אח/אחות', spouse:'בן/בת זוג'};
let draft = null;

/* שם המשפחה שנגזר מהמיקום בעץ.
   sur    = ההצעה שתמולא אוטומטית, ריק כשהאדם מביא שם משלו
   maiden = האם שדה שם הנעורים רלוונטי בכלל */
function nameHints(anchorId, kind, gender){
  const a = DB.people[anchorId] || {};
  if(!DB.people[anchorId]) return {sur:'', maiden: gender === 'female'};
  const dad = u => {
    if(!u) return '';
    const m = u.partners.map(p => DB.people[p]).find(x => x && x.gender === 'male');
    return (m && m.surname) || ((DB.people[u.partners[0]] || {}).surname) || '';
  };

  if(kind === 'child')
    return {sur: dad(unionsOf(anchorId)[0]) || a.surname || '', maiden:false};

  if(kind === 'sibling')
    return {sur: dad(DB.unions.find(x => x.children.includes(anchorId))) || a.surname || '', maiden:false};

  if(kind === 'parent'){
    if(gender === 'male')  return {sur: a.surname || '', maiden:false};
    const u = DB.unions.find(x => x.children.includes(anchorId));
    return {sur: dad(u) || a.surname || '', maiden:true};   // אם — נושאת את שם המשפחה, ושם נעורים משלה
  }

  if(kind === 'spouse'){
    // אישה נכנסת למשפחה ולוקחת את השם; גבר מביא שם משפחה משלו
    if(gender === 'female') return {sur: a.surname || '', maiden:true};
    return {sur:'', maiden:false};
  }
  return {sur:'', maiden: gender === 'female'};
}

function openForm(anchorId, kind){
  if(!DB.people[anchorId]){ toast('האדם הזה כבר לא קיים בעץ'); return closePanel(); }
  draft = draft && draft.keep ? draft
        : {by:'', gender:'', name:'', surname:'', maiden:'', birth:'', death:'',
           city:'', phone:'', email:'', photo:'', surTouched:false};
  draft.keep = false;
  draft.anchor = anchorId; draft.kind = kind;
  const a = DB.people[anchorId];
  const hint = nameHints(anchorId, kind, draft.gender);
  if(!draft.surTouched) draft.surname = hint.sur;
  const showMaiden = draft.gender === 'female' && hint.maiden;

  openPanel('הוספת ' + REL[kind], `
    <button class="anchor-btn" id="fAnchor">${REL[kind]} של <b>${esc(fullName(a))}</b>
      <span class="swap">החלפה</span></button>
    ${personFormHTML(draft)}
    ${isAdmin() ? '' : `<div class="field">
      <label>מי ממלא את הפרטים? <span class="req">*</span></label>
      <input id="fBy" value="${esc(draft.by || '')}" placeholder="השם שלכם, או איך שתזוהו">
    </div>`}
    <div id="fErr"></div>
    <div class="form-actions" id="fActions">
      <button class="btn btn-primary" id="fSave">${isAdmin() ? 'הוספה לעץ' : 'שליחה לאישור'}</button>
      <button class="btn btn-ghost" id="fCancel">ביטול</button>
    </div>
    ${isAdmin()
      ? '<p class="note">כמנהל, ההוספה נכנסת לעץ מיד, בלי לעבור דרך רשימת הבקשות.</p>'
      : '<p class="send-note">יעבור לאישור מנהל המשפחה, ויתווסף לעץ רק אחרי שיאשר.</p>'}`,
  () => {
    const g = id => panelBody.querySelector('#' + id);
    const val = id => (g(id) && g(id).value) || '';
    const grab = () => { draft.by = val('fBy'); readPersonForm(panelBody, draft); };

    wirePersonForm(panelBody, draft);
    const sr = g('pf_surname');
    if(sr) sr.addEventListener('input', () => { draft.surTouched = true; });

    /* שינוי מגדר ממלא מחדש את שם המשפחה, כל עוד לא נגעו בו ידנית */
    panelBody.querySelectorAll('.pick button').forEach(b => {
      const prev = b.onclick;
      b.onclick = () => {
        if(prev) prev();
        const h = nameHints(draft.anchor, draft.kind, draft.gender);
        if(!draft.surTouched && sr){ draft.surname = h.sur; sr.value = h.sur; }
        const w = g('pfMaidenWrap');
        if(w) w.hidden = !(draft.gender === 'female' && h.maiden);
        /* הרשימה שמתחת ל"עוד פרטים" נגזרת מהשדה עצמו ולא מהמגדר,
           ולכן היא לא יכולה להבטיח שדה שנשאר מוסתר. */
        const sum = panelBody.querySelector('#pfFold .s');
        if(sum) sum.textContent =
          foldSummary(FIELDS.filter(f => f.group === 'extra'), !!w && !w.hidden);
      };
    });

    g('fAnchor').onclick = () => { grab(); draft.keep = true;
      pickPerson(id => { draft.keep = true; openForm(id, draft.kind); },
                 () => { draft.keep = true; openForm(draft.anchor, draft.kind); }); };
    g('fCancel').onclick = () => { draft = null; closePanel(); };

    g('fSave').onclick = () => {
      grab();
      const err = t => showFormError(panelBody, 'fErr', t);
      if(!isAdmin() && !(draft.by || '').trim()) return err('צריך לרשום מי ממלא את הפרטים');
      const req = {
        id: newRid(), kind: draft.kind, anchor: draft.anchor,
        by: isAdmin() ? 'המנהל' : draft.by.trim(),
        at: new Date().toISOString(),
        data: {name:(draft.name||'').trim(), surname:(draft.surname||'').trim(), gender:draft.gender,
               maiden:(draft.maiden||'').trim(), birth:draft.birth || '', death:draft.death || '',
               city:(draft.city||'').trim(), phone:(draft.phone||'').trim(),
               email:(draft.email||'').trim(), photo:draft.photo || '',
               /* הגרסה הזעירה נוצרה בחיתוך ונזרקה כאן. התוצאה:
                  עיגול של 40 פיקסל טוען תמונה של 800 — לכל מי
                  שנוסף דרך בקשה. */
               thumb:draft.thumb || ''}
      };
      /* על req.data עצמו, לא על עותק: validatePerson גם מתקננת —
         גוזרת רווחים והופכת "5/3/1948" ל-"1948-03-05". על עותק,
         הבקשה נשמרה עם התאריך הגולמי, בדיקות הגיל דילגו עליו
         בשקט, והמסד דחה אותו ברגע שהמנהל אישר. */
      const bad = validatePerson(req.data) || validateRequest(req);
      if(bad && !isSoft(bad)) return err(bad);
      if(bad) toast(softText(bad));        // אזהרה בלבד — הבקשה נשלחת

      if(!isAdmin()){
        pending.push(req);
        draft = null; refreshReqChip(); closePanel();
        toast('הבקשה נשלחה לאישור');
        return;
      }

      /* מנהל: אישור כפול ואז הוספה ישירה לעץ */
      const acts = g('fActions'), html = acts.innerHTML;
      panelBody.classList.add('confirming');
      acts.innerHTML =
        '<div style="width:100%"><p class="err" style="color:var(--ink)">להוסיף את ' +
          esc(req.data.name + ' ' + req.data.surname) + ' לעץ?</p>' +
        '<div class="form-actions"><button class="btn btn-primary" id="fYes">כן</button>' +
        '<button class="btn btn-ghost" id="fNo">לא</button></div></div>';
      g('fNo').onclick = () => {
        panelBody.classList.remove('confirming');
        draft.keep = true;                       // מחזיר את הטופס עם מה שמולא
        openForm(draft.anchor, draft.kind);
      };
      g('fYes').onclick = () => {
        panelBody.classList.remove('confirming');
        const before = new Set(Object.keys(DB.people));
        const e2 = applyRequest(req);
        if(e2){ toast(e2); return; }
        const added = Object.keys(DB.people).find(k => !before.has(k));
        draft = null; closePanel();
        layout(); render();
        toast('נוסף לעץ');
        if(added){ revealTo(added); focusOn(added); }
      };
    };
  });
}

/* ---------- בקשות ממתינות ---------- */
const pending = [];
let reqSeq = 0;
/* כמו אצל אנשים: כשמחוברים המזהה חייב להיות בפורמט של המסד.
   הענף השני קרא לפונקציה לעצמה — רקורסיה בלי סוף שהפילה את הדף
   בכל שליחת בקשה במצב דמה. */
const newRid = () => SUPA.enabled ? newUuid() : 'r' + (++reqSeq);

/* המספר תואם למספר השורות ברשימה: בקשות עריכה על אותו אדם
   מאוחדות לשורה אחת ולכן נספרות פעם אחת. */
function pendingRowCount(){
  const targets = new Set();
  let n = 0;
  pending.forEach(r => {
    if(r.kind === 'edit'){ if(!targets.has(r.target)){ targets.add(r.target); n++; } }
    else n++;
  });
  return n;
}
/* מי שלח ומתי. למנהל שמחליט אם לאשר, "מי ביקש" הוא חצי
   מההחלטה — והוא לא הופיע בתור כלל. */
function agoText(iso){
  if(!iso) return '';
  const d = Math.floor((Date.now() - Date.parse(iso)) / 86400000);
  if(!isFinite(d) || d < 0) return '';
  return d === 0 ? 'היום' : d === 1 ? 'אתמול' : 'לפני ' + plural(d, 'יום אחד', 'ימים');
}
function reqMeta(r){
  const w = String(r.by || '').trim();
  const t = agoText(r.at);
  const s = [w ? 'מאת ' + w : '', t].filter(Boolean).join(' · ');
  return s ? '<span class="meta">' + esc(s) + '</span>' : '';
}

function refreshReqChip(){
  const c = document.getElementById('btnReq');
  const n = pendingRowCount();
  c.hidden = !isAdmin() || n === 0;
  c.innerHTML = 'בקשות <span class="badge">' + n + '</span>';
}

function openRequests(){

        }

/* מסך בדיקת בקשה — כל הפרטים פתוחים לעריכה, ואישור או דחייה בשני שלבים */

      const bad = validatePerson(r.data) || validateRequest(r);

/* בדיקות היגיון לפני הכנסה לעץ */
function validateRequest(req){
  const a = DB.people[req.anchor], d = req.data;
  if(!a) return 'האדם שאליו קושרה הבקשה כבר לא קיים בעץ';

  /* אותן מגבלות שקיימות בכפתורים, גם בשכבת הנתונים —
     כדי שבקשה ישנה או מסלול אחר לא יעקפו אותן. */
  const parU = DB.unions.find(x => x.children.includes(req.anchor));
  const inLine = !!parU || req.anchor === DB.root;
  if(!inLine && req.kind !== 'child')
    return a.name + ' נישא/ה לתוך המשפחה, ולכן אפשר לרשום רק ילד משותף';
  if(req.kind === 'parent' && parU && parU.partners.length >= 2)
    return 'לאדם הזה כבר רשומים שני הורים';
  /* אותה מגבלה שיש בכפתור האח/אחות, שמוסתר כשאין הורים רשומים.
     בלעדיה בקשה שנשלחה לפני שההורים נותקו הייתה נכנסת לתור
     ונכשלת רק בשלב האישור, עם הודעה מבלבלת למנהל. */
  if(req.kind === 'sibling' && !parU)
    return 'אין הורים רשומים ל' + a.name + ', ולכן אי אפשר להוסיף אח או אחות. הוסיפו הורה קודם';
  if(d.gender !== 'male' && d.gender !== 'female') return 'צריך לבחור מגדר';
  const ay = yearOfDate(a.birth), dy = yearOfDate(d.birth);

  if(ay && dy){
    /* אותם כללי גיל כמו בעריכה ישירה, ובאותה דרגה: אזהרה ולא
       חסימה. קודם אי אפשר היה להוסיף ילד עם פער 11 שנים, אבל כן
       אפשר היה לערוך את תאריך הלידה של אותו ילד לאותו פער בדיוק. */
    if(req.kind === 'child'   && dy - ay < 12) return soft('הפרש הגילאים קטן מ-12 שנים — בדקו את תאריך הלידה');
    if(req.kind === 'parent'  && ay - dy < 12) return soft('הורה חייב להיות מבוגר לפחות ב-12 שנים');
    if(req.kind === 'sibling'){
      const par = DB.unions.find(x => x.children.includes(req.anchor));
      const py = par ? Math.max(...par.partners.map(p => yearOfDate(DB.people[p] && DB.people[p].birth) || 0)) : 0;
      if(py && dy - py < 12) return soft('האח/ות נולד/ה קרוב מדי ללידת ההורים');
    }
  }
  /* לידה אחרי פטירת ההורה אפשרית ולא נחסמת */
  if(d.birth){
    const dup = Object.values(DB.people).find(p =>
      p.name === d.name && p.surname === d.surname && p.birth === d.birth);
    if(dup) return 'כבר קיים בעץ ' + fullName(dup) + ' עם אותו תאריך לידה';
  }
  /* שתי בקשות הוספה זהות שנשלחו בנפרד — למשל שני בני משפחה
     שהוסיפו את אותו אדם. אחרת יאושרו שניהם וייווצר כפל. */
  const twin = pending.find(x => x !== req && x.kind === req.kind &&
    x.anchor === req.anchor && x.data.name === d.name && x.data.surname === d.surname);
  if(twin) return 'יש כבר בקשה ממתינה זהה לאותו קרוב משפחה. אשרו או דחו אותה קודם';

  /* כפילות כשאין תאריך לידה.
     הבדיקה שלמעלה דילגה על כל בקשה בלי תאריך — וזה המצב הרגיל כשמוסיפים
     קרוב רחוק. שני מנהלים שאישרו את אותה בקשה משני מכשירים יצרו כך את
     אותו אדם פעמיים. כאן נבדק אם כבר רשום אדם באותו שם ובאותו קשר. */
  const twinInTree = Object.values(DB.people).find(p =>
    p.name === d.name && p.surname === d.surname && p.gender === d.gender &&
    sameRelation(p.id, req.anchor, req.kind));
  if(twinInTree)
    return soft('כבר רשום ' + fullName(twinInTree) + ' באותו קשר ל' + a.name);
  return null;
}

/* האם pid כבר נמצא ביחס הזה אל anchor */
function sameRelation(pid, anchor, kind){
  if(pid === anchor) return false;
  const parentUnionOfAnchor = DB.unions.find(u => u.children.includes(anchor));
  if(kind === 'child')
    return DB.unions.some(u => u.partners.includes(anchor) && u.children.includes(pid));
  if(kind === 'spouse')
    return DB.unions.some(u => u.partners.includes(anchor) && u.partners.includes(pid));
  if(kind === 'sibling')
    return !!parentUnionOfAnchor && parentUnionOfAnchor.children.includes(pid);
  if(kind === 'parent')
    return !!parentUnionOfAnchor && parentUnionOfAnchor.partners.includes(pid);
  return false;
}

/* כשמחוברים לשרת המזהה חייב להיות בפורמט שהמסד מקבל.
   בלי זה הוספת אדם רגילה הייתה נכשלת בשמירה, כי עמודת המזהה
   היא uuid ו-"x1" אינו uuid תקין. */
const newPid = () => SUPA.enabled ? newUuid()
  : (() => { let n = 1; while(DB.people['x' + n]) n++; return 'x' + n; })();
const newUid = () => SUPA.enabled ? newUuid()
  : (() => { let n = 1; while(DB.unions.some(u => u.id === 'xu' + n)) n++; return 'xu' + n; })();

/* מוסיף אדם מאושר לעץ. מחזיר הודעת שגיאה, או null בהצלחה. */
function applyRequest(req){
  const bad = validateRequest(req);
  /* אזהרה רכה כבר הוצגה למי שאישר — כאן רק חסימות אמיתיות */
  if(bad && !isSoft(bad)) return bad;
  const a = req.anchor, d = req.data, id = newPid();
  /* כל השדות, מאותה רשימה אחת שמשרתת גם את השער וגם את הטופס.
     קודם הם נכתבו כאן ביד — ו-death, phone ו-email לא היו ברשימה.
     בן משפחה מילא טלפון ותאריך פטירה, המנהל אישר, והשלושה נעלמו
     בלי שום סימן. */
  const p = {id, name: d.name || '', surname: d.surname || '', gender: d.gender};
  reqKeys().forEach(k => { if(d[k] && !(k in p)) p[k] = d[k]; });
  /* גרסה זעירה בלי מקור אין לה טעם */
  if(!p.photo) delete p.thumb;
  markPhotoForUpload(p, d);

  if(req.kind === 'child'){
    let u = unionsOf(a)[0];
    if(!u){ u = {id:newUid(), partners:[a], children:[], status:'married'}; DB.unions.push(u); }
    DB.people[id] = p; u.children.push(id); expanded.add(u.id);
  }
  else if(req.kind === 'spouse'){
    if(unionsOf(a).length >= 2) return 'לאדם הזה כבר רשומות שתי מערכות';
    DB.people[id] = p;
    const u = {id:newUid(), partners:[a, id], children:[], status:'married'};
    DB.unions.push(u); expanded.add(u.id);
  }
  else if(req.kind === 'sibling'){
    const u = DB.unions.find(x => x.children.includes(a));
    if(!u) return 'אין הורים רשומים, אז אי אפשר להוסיף אח או אחות. הוסיפו הורה קודם';
    DB.people[id] = p; u.children.push(id); expanded.add(u.id);
  }
  else if(req.kind === 'parent'){
    const u = DB.unions.find(x => x.children.includes(a));
    if(u && u.partners.length >= 2) return 'לאדם הזה כבר רשומים שני הורים';
    DB.people[id] = p;
    if(u){ u.partners.push(id); expanded.add(u.id); }
    else {
      const nu = {id:newUid(), partners:[id], children:[a], status:'married'};
      DB.unions.push(nu); expanded.add(nu.id);
      if(DB.root === a) DB.root = id;
    }
  }
  for(const k in SUB) delete SUB[k];
  return null;
}

/* ---------- ימי הולדת ---------- */
let bdayMode = 'greg';
let bdayQuery = '';
const heCache = {};
let heToday = null;

/* מתי יום ההולדת הקרוב, כתאריך מלא */
function nextBirthday(iso){
  const t = new Date(); t.setHours(0,0,0,0);
  const [, m, d] = iso.split('-').map(Number);
  let next = new Date(t.getFullYear(), m-1, d);
  if(next < t) next = new Date(t.getFullYear()+1, m-1, d);
  return next;
}
function daysUntil(iso){
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((nextBirthday(iso) - t) / 86400000);
}
/* הגיל שימלאו ביום ההולדת הקרוב.
   הנוסחה הקודמת הוסיפה שנה לכל מי שיום ההולדת שלו עוד לפניו, גם
   כשהוא נופל עדיין השנה — ולכן דווקא הראשונים ברשימה, הקרובים
   ביותר, הוצגו עם גיל גדול בשנה מהאמת. */
const ageAtNextBirthday = iso =>
  nextBirthday(iso).getFullYear() - Number(String(iso).slice(0, 4));
/* ההדגשה נשמרת לעשרה ימים ומטה, והיא ירוקה: כתום נקרא כאזהרה,
   ויום הולדת אינו אזהרה. */
const countLabel = n => n === 0 ? {t:'היום', c:'today'}
                     : n === 1 ? {t:'מחר', c:'soon'}
                     : {t:'עוד ' + plural(n, 'יום אחד', 'ימים'), c: n <= 10 ? 'soon' : ''};

/* ספירה לאחור דורשת יום וחודש, ולכן מי שרשומה לו רק שנה
   לא מופיע ברשימה. הגיל בכרטיסייה עדיין מחושב לפי השנה. */
const livingWithBirth = () =>
  visiblePeople().filter(p => isFullDate(p.birth) && !p.death);

const willBe = p => (p.gender === 'male' ? 'ימלאו לו ' : 'ימלאו לה ') +
                    ageAtNextBirthday(p.birth);
const lifeSpan = p => yearOfDate(p.birth) + '–' + yearOfDate(p.death);

/* השורה של מי שנפטר: תאריך הלידה ותוחלת החיים, ותו לא. אין מה
   לחגוג ואין למה לספור, ולכן גם אין תגית ואין "ימלאו לו". */
const bdayLine = p => p.death
  ? {sub: fmtDate(p.birth) + ' · ' + lifeSpan(p), cnt: null}
  : isFullDate(p.birth)
    ? {sub: fmtDate(p.birth) + ' · ' + willBe(p), cnt: countLabel(daysUntil(p.birth))}
    : {sub: fmtDate(p.birth), cnt: null};

function bdayShell(inner){
  return '<div class="seg">' +
    '<button data-m="greg" class="' + (bdayMode==='greg'?'on':'') + '">תאריך לועזי</button>' +
    '<button data-m="he" class="' + (bdayMode==='he'?'on':'') + '">תאריך עברי</button>' +
    '</div>' +
    '<div class="field" style="margin-bottom:8px">' +
      '<input id="bq" placeholder="חיפוש לפי שם" autocomplete="off" value="' +
        esc(bdayQuery) + '">' +
      /* שינוי ההיקף נאמר במפורש: בלי השורה הזאת פתאום מופיע מישהו
         שנפטר, ולא ברור למה. */
      '<p class="bday-scope" id="bScope"' + (bdayQuery ? '' : ' hidden') + '>' +
        'מחפש בכל המשפחה, כולל מי שאינם איתנו</p>' +
    '</div>' +
    '<div id="bdayList">' + inner + '</div>';
}

/* מי שהחיפוש מוצא — כולל מי שנפטר, וכולל מי שידועה לו רק שנה */
const bdaySearch = q => visiblePeople()
  .filter(p => p.birth && (fullName(p).includes(q) || (p.maiden || '').includes(q)))
  .sort(byFirstName);

function openBirthdays(){
  openPanel('ימי הולדת', bdayShell('<p class="empty">רגע…</p>'), () => {
    panelBody.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
      bdayMode = b.dataset.m;
      openBirthdays();
    });
    const bq = panelBody.querySelector('#bq');

      bdayQuery = bq.value || '';

/* המרה לתאריך עברי מול Hebcal. ללא מפתח, ללא הרשמה. */
async function heConvert(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error('hebcal');
  return r.json();
}
async function hebrewBirthday(p){
  if(heCache[p.id]) return heCache[p.id];
  const [y,m,d] = p.birth.split('-').map(Number);
  const born = await heConvert(
    'https://www.hebcal.com/converter?cfg=json&gy=' + y + '&gm=' + m + '&gd=' + d + '&g2h=1');
  let hy = heToday.hy;
  let back = await heConvert('https://www.hebcal.com/converter?cfg=json&hy=' + hy +
    '&hm=' + encodeURIComponent(born.hm) + '&hd=' + born.hd + '&h2g=1');
  let iso = back.gy + '-' + String(back.gm).padStart(2,'0') + '-' + String(back.gd).padStart(2,'0');
  /* 'YYYY-MM-DD' נקרא על ידי הדפדפן כחצות לפי שעון גריניץ', בעוד
     ש-today הוא חצות מקומית. בהפרש שלילי מגריניץ' ההשוואה הייתה
     יוצאת הפוך, והתאריך היה קופץ שנה קדימה. כאן שני הצדדים
     נבנים באותה שיטה. */
  const localDay = isoStr => {
    const [yy, mm, dd] = String(isoStr).split('-').map(Number);
    return new Date(yy, (mm || 1) - 1, dd || 1);
  };
  const today = new Date(); today.setHours(0,0,0,0);
  if(localDay(iso) < today){
    back = await heConvert('https://www.hebcal.com/converter?cfg=json&hy=' + (hy+1) +
      '&hm=' + encodeURIComponent(born.hm) + '&hd=' + born.hd + '&h2g=1');
    iso = back.gy + '-' + String(back.gm).padStart(2,'0') + '-' + String(back.gd).padStart(2,'0');
  }
  const n = Math.round((localDay(iso) - today) / 86400000);
  return (heCache[p.id] = {hebrew: born.hebrew, iso, n});
}

/* התאריך העברי של הפטירה, לצד הלועזי באותה תגית.
   ההמרה היא פנייה לרשת, ולכן היא מתווספת אחרי שהכרטיס כבר מצויר:
   אם אין רשת פשוט נשאר התאריך הלועזי, בלי הודעת שגיאה ובלי שורה
   ריקה שמחכה למשהו שלא יגיע. */
const heDeathCache = {};
async function fillHebrewDeath(p){
  if(!p.death || !isFullDate(p.death)) return;
  const key = p.id + '|' + p.death, target = p.id;
  try{
    let he = heDeathCache[key];
    if(he === undefined){
      const [y,m,d] = p.death.split('-').map(Number);
      const r = await heConvert('https://www.hebcal.com/converter?cfg=json&gy=' + y +
        '&gm=' + m + '&gd=' + d + '&g2h=1');
      he = heDeathCache[key] = r.hebrew || '';
    }
    if(!he) return;
    if(openId !== target) return;          // הכרטיס התחלף בזמן הפנייה
    const el = document.getElementById('deathChip');
    if(!el || el.dataset.he) return;       // כבר הושלם — אחרת היה מוכפל
    el.dataset.he = '1';
    el.textContent = el.textContent + '  |  ' + he;
  }catch(e){ /* אין רשת — התאריך הלועזי לבדו */ }
}

async function drawHebrew(){
  const box = document.getElementById('bdayList');
  const q = (bdayQuery || '').trim();
  /* ההמרה היא פנייה לרשת לכל אדם, ולכן יש תקרה — אבל היא נאמרת
     על המסך. שורת תוצאות שנעלמת בלי לומר דבר היא בדיוק מה שתוקן
     במסך החיפוש. */
  const CAP = 30;
  const matched = q ? bdaySearch(q).filter(p => isFullDate(p.birth)) : null;
  const people = q
    ? matched.slice(0, CAP)
    : livingWithBirth()
        .map(p => ({p, n: daysUntil(p.birth)}))
        .sort((a,b) => a.n - b.n)
        .slice(0, 20)
        .map(x => x.p);
  if(q && !matched.length){
    box.innerHTML = '<p class="empty">לא נמצא אף אחד עם תאריך לידה מלא בשם הזה</p>';
    return wireBdayList(box);
  }
  box.innerHTML = '<p class="empty">מתרגם תאריכים מול Hebcal…</p>';
  try{
    const t = new Date();
    if(!heToday) heToday = await heConvert('https://www.hebcal.com/converter?cfg=json&gy=' +
      t.getFullYear() + '&gm=' + (t.getMonth()+1) + '&gd=' + t.getDate() + '&g2h=1');
    const out = [];
    for(const p of people) out.push({p, ...(await hebrewBirthday(p))});
    if(!q) out.sort((a,b) => a.n - b.n);
    box.innerHTML = out.map(o => o.p.death
        ? personRow(o.p, o.hebrew + ' · ' + lifeSpan(o.p), null, q)
        : personRow(o.p, o.hebrew + ' · ' + willBe(o.p), countLabel(o.n), q)).join('') +
      (q
        ? (matched.length > CAP
            ? '<p class="empty">מוצגות ' + CAP + ' תוצאות מתוך ' + matched.length +
              ' — המשיכו להקליד כדי לצמצם</p>'
            : '')
        : '<p class="empty">מוצגים 20 הקרובים ביותר</p>');
    wireBdayList(box);
  }catch(err){
    box.innerHTML = '<p class="empty">לא הצלחנו להגיע לשירות התאריך העברי של Hebcal.<br>' +
      'זה קורה כשאין חיבור לאינטרנט או בתצוגה מקדימה חסומה. באתר החי זה יעבוד.</p>';
  }
}

/* ---------- תמונות ---------- */
/* ---------- הקטנת תמונות ----------
   התמונה מוקטנת בדפדפן לפני שהיא נשמרת. המקור הכבד מהטלפון
   אף פעם לא נשמר, ובגרסה המחוברת גם לא ייעלה לשרת.
   שתי גרסאות, כי הן מוצגות בשני גדלים רחוקים זה מזה:
     thumb — העיגול בכרטיס בעץ (58 פיקסל) וברשימות (42)
     photo — העיגול בכרטיסייה (175) ובתצוגה המוגדלת (עד 320)
   המידות מכוונות לפי הצלע הקצרה, כי התצוגה היא עיגול
   שגוזר את הצדדים ממילא. */
/* max = תקרת האורך של מחרוזת ה-data URL, בתווים */
/* היחס שנשמר. הוא נבחר כך ששלוש הצורות שהתמונה מופיעה בהן
   חולקות גובה אחד — ולכן העיגול והכרטיס שבעץ נגזרים ממנו
   אוטומטית ב-object-fit:cover, בלי קובץ נוסף. */
const CROP_AR = 5 / 3;
/* px הוא הצלע הקצרה, כלומר הגובה. 600×1000 הוא כמעט בדיוק אותו
   מספר פיקסלים כמו הריבוע 800×800 שהיה כאן, ולכן תקרות הגודל
   למטה נשארות תקפות. */
const PHOTO_FULL  = {px:600, q:0.82, max:220 * 1024};
const PHOTO_THUMB = {px:200, q:0.78, max: 40 * 1024};

/* הקטנה בשלבים של חצי. קפיצה ישירה מ-4000 פיקסל ל-256 יוצרת
   שיניים ורעש; חצי בכל פעם שומרת על חדות. */
function scaleToCanvas(img, px){
  const short = Math.min(img.width, img.height) || 1;
  const k = Math.min(1, px / short);
  const w = Math.max(1, Math.round(img.width * k));
  const h = Math.max(1, Math.round(img.height * k));
  let src = img, cw = img.width, ch = img.height;
  const step = (tw, th, from) => {
    const c = document.createElement('canvas');
    c.width = tw; c.height = th;
    const x = c.getContext('2d');
    x.imageSmoothingEnabled = true;
    x.imageSmoothingQuality = 'high';
    x.drawImage(from, 0, 0, tw, th);
    return c;
  };
  while(cw > w * 2 && ch > h * 2){
    cw = Math.max(w, Math.round(cw / 2));
    ch = Math.max(h, Math.round(ch / 2));
    src = step(cw, ch, src);
  }
  return step(w, h, src);
}

/* חותך ריבוע מתוך התמונה ומחזיר את שתי הגרסאות.
   sx,sy,side — באזור הפיקסלים של התמונה המקורית. */
function cropToVersions(img, sx, sy, sw, sh){
  /* שלב ביניים: אם החיתוך ענק, מקטינים אותו פעם אחת לגודל סביר
     לפני ההקטנה בשלבים. קנבס של 3000×3000 תופס הרבה זיכרון בטלפון. */
  const cap = Math.min(sh, PHOTO_FULL.px * 2);
  const mid = document.createElement('canvas');
  mid.height = Math.max(1, Math.round(cap));
  mid.width  = Math.max(1, Math.round(cap * CROP_AR));
  const mx = mid.getContext('2d');
  mx.imageSmoothingEnabled = true;
  mx.imageSmoothingQuality = 'high';
  mx.drawImage(img, sx, sy, sw, sh, 0, 0, mid.width, mid.height);
  return {
    photo: encodeUnder(scaleToCanvas(mid, PHOTO_FULL.px), PHOTO_FULL),
    thumb: encodeUnder(scaleToCanvas(mid, PHOTO_THUMB.px), PHOTO_THUMB)
  };
}

/* ---------- קידוד עם תקרת גודל ----------
   איכות 0.82 נותנת 80 ק״ב לתמונת דיוקן רגילה, אבל 550 ק״ב לתמונה
   עשירה בפרטים — דשא, קהל, בד. המחרוזת הזאת נוסעת בגוף הבקשה
   למסד, ואצל אורח גם נשמרת שם עד שהמנהל מאשר.

   לכן אם היא חורגת, מקטינים את האיכות עד שהיא נכנסת. ההפרש בעין
   זניח; ההפרש בנפח ובזמן ההעלאה בטלפון — לא. */
function encodeUnder(canvas, spec){
  let q = spec.q, out = canvas.toDataURL('image/jpeg', q);
  while(out.length > spec.max && q > 0.4){
    q = Math.round((q - 0.08) * 100) / 100;
    out = canvas.toDataURL('image/jpeg', q);
  }
  return out;
}

/* טוען קובץ לאובייקט תמונה */
function loadImageFile(file){
  return new Promise((resolve, reject) => {
    const rd = new FileReader();
    rd.onerror = () => reject(new Error('לא הצלחתי לקרוא את הקובץ'));
    rd.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('הקובץ אינו תמונה שאפשר לפתוח'));
      img.onload = () => resolve(img);
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}

/* ---------- מסך חיתוך ----------
   התצוגה באפליקציה היא תמיד עיגול, ולכן המסגרת כאן היא עיגול:
   מה שרואים הוא בדיוק מה שיישמר. בלי זה החיתוך היה מרכזי ושרירותי,
   ומי שעומד בצד התמונה היה נחתך.
   מחזיר Promise עם {photo, thumb}, או null כשמבטלים. */
function openCropper(file){
  return loadImageFile(file).then(img => new Promise(resolve => {
    const box   = document.getElementById('cropper');
    const frame = document.getElementById('cropFrame');
    const el    = document.getElementById('cropImg');
    const zoom  = document.getElementById('cropZoom');
    const ok    = document.getElementById('cropOk');
    const no    = document.getElementById('cropNo');

    /* המסגרת היא מה שנשמר: 5:3, לפי רוחב המסך */
    const FW = Math.round(Math.min(window.innerWidth * 0.84, 340));
    const FH = Math.round(FW / CROP_AR);
    frame.style.width  = FW + 'px';
    frame.style.height = FH + 'px';
    el.src = img.src;

    /* המסגרת כולה היא כרטיס האדם, והמלבן המקווקו שבתוכה הוא
       הכרטיס שבעץ — הצדדים שמחוצה לו ייחתכו שם. */
    const cardW = Math.round(FH * 7 / 6);
    const side  = Math.max(0, Math.round((FW - cardW) / 2));
    const gc = document.getElementById('gCircle');
    const gk = document.getElementById('gCard');
    gk.style.left = side + 'px';
    gk.style.width = cardW + 'px';

    /* סימון הראש. קודם זה היה עיגול בגובה המסגרת כולה, וההנחיה
       "שהפנים יהיו בתוך העיגול" הורתה בפועל למלא את כל הגובה
       בפנים — ואז הראש נגע בקצה התמונה השמורה. כאן הסימון הוא
       בגודל ראש (0.56 מהגובה), ברוחב 3:4 כמו ראש, ומרכזו מעט מעל
       אמצע המסגרת — כך שמי שמתאים אליו מקבל מרווח מעל הראש.
       הסימון נכנס בשלמותו גם בריבוע שבמרכז, שהוא מה שמוצג
       בעיגולים הקטנים שברשימות. */
    const headH = Math.round(FH * 0.56);
    const headW = Math.round(headH * 0.75);
    gc.style.height = headH + 'px';
    gc.style.width  = headW + 'px';
    gc.style.top    = Math.round(FH * 0.42 - headH / 2) + 'px';
    gc.style.left   = Math.round((FW - headW) / 2) + 'px';
    /* ההצללה נמוגה פנימה ועוברת דרך קו הכרטיס, ולכן רוחבה כפול */
    document.getElementById('gDimL').style.width =
      document.getElementById('gDimR').style.width = (side * 2) + 'px';

    /* בקנה המידה הבסיסי התמונה מכסה את המסגרת כולה */
    const base = Math.max(FW / img.width, FH / img.height);
    let z = 1, tx = 0, ty = 0;

    const draw = () => {
      const s = base * z;
      const w = img.width * s, h = img.height * s;
      /* תמיד מכסים את המסגרת — אי אפשר לגרור לשוליים ריקים */
      tx = Math.min(0, Math.max(FW - w, tx));
      ty = Math.min(0, Math.max(FH - h, ty));
      el.style.width  = w + 'px';
      el.style.height = h + 'px';
      el.style.transform = 'translate(' + tx + 'px,' + ty + 'px)';
    };
    /* פתיחה ממורכזת */
    const center = () => {
      const s = base * z;
      tx = (FW - img.width * s) / 2;
      ty = (FH - img.height * s) / 2;
      draw();
    };
    zoom.value = 100;
    center();

    /* גרירה ושתי אצבעות */
    const pts = new Map();
    let startDist = 0, startZ = 1, startMid = null;
    const midOf = () => {
      const a = [...pts.values()];
      return {x:(a[0].x + a[1].x) / 2, y:(a[0].y + a[1].y) / 2};
    };
    const distOf = () => {
      const a = [...pts.values()];
      return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1;
    };
    const onDown = e => {
      pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
      frame.classList.add('dragging');
      if(pts.size === 2){ startDist = distOf(); startZ = z; startMid = midOf(); }
    };
    const onMove = e => {
      if(!pts.has(e.pointerId)) return;
      const prev = pts.get(e.pointerId);
      pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if(pts.size === 1){
        tx += e.clientX - prev.x;
        ty += e.clientY - prev.y;
        draw();
      } else if(pts.size === 2 && startDist){
        const nz = Math.max(1, Math.min(4, startZ * (distOf() / startDist)));
        const r = frame.getBoundingClientRect();
        const m = midOf();
        /* מתקרבים סביב הנקודה שבין האצבעות, לא סביב הפינה */
        const px = (m.x - r.left - tx) / (base * z);
        const py = (m.y - r.top  - ty) / (base * z);
        z = nz;
        tx = (m.x - r.left) - px * base * z;
        ty = (m.y - r.top)  - py * base * z;
        zoom.value = Math.round(z * 100);
        draw();
      }
    };
    const onUp = e => {
      pts.delete(e.pointerId);
      if(pts.size < 2) startDist = 0;
      if(!pts.size) frame.classList.remove('dragging');
    };
    frame.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);

    /* מחוון — להתקרבות ביד אחת וגם במחשב */
    zoom.oninput = () => {
      const nz = Math.max(1, Number(zoom.value) / 100);
      /* שומרים על מרכז המסגרת */
      const cx = (FW / 2 - tx) / (base * z), cy = (FH / 2 - ty) / (base * z);
      z = nz;
      tx = FW / 2 - cx * base * z;
      ty = FH / 2 - cy * base * z;
      draw();
    };

    const close = () => {
      box.classList.remove('show');
      frame.removeEventListener('pointerdown', onDown);
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
      zoom.oninput = null; ok.onclick = null; no.onclick = null;
      el.removeAttribute('src');
    };

    no.onclick = () => { close(); resolve(null); };
    ok.onclick = () => {
      ok.disabled = true;
      /* מהמסך חזרה לפיקסלים של המקור */
      const s = base * z;
      const sw = Math.min(FW / s, img.width);
      const sh = Math.min(FH / s, img.height);
      const sx = Math.max(0, Math.min(img.width  - sw, -tx / s));
      const sy = Math.max(0, Math.min(img.height - sh, -ty / s));
      let out = null, err = null;
      try { out = cropToVersions(img, sx, sy, sw, sh); }
      catch(e){ err = e; }
      ok.disabled = false;
      close();
      if(err){ toast('החיתוך נכשל'); resolve(null); } else resolve(out);
    };

    box.classList.add('show');
  }));
}

/* full=true לעיגולים הגדולים, שבהם הגרסה הזעירה הייתה נראית מטושטשת */
const avatarInner = (p, full) => {
  const src = full ? (p.photo || p.thumb) : (p.thumb || p.photo);
  return imgTag(src, 'alt=""')
    || ('<span>' + (p.placeholder ? '?' : esc(p.name.charAt(0))) + '</span>');
};

/* בוחר תמונה לטופס. קורא את הקובץ בדפדפן ומציג מיד.
   בגרסה המחוברת אותו קובץ יעלה ל-Supabase Storage. */
/* מה שמוצג במסגרת כשאין עדיין תמונה. אותו טקסט בדיוק חוזר
   ב-wirePhoto אחרי הסרה או ביטול, ולכן הוא יושב במקום אחד. */
const PHOTO_EMPTY =
  '<svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" ' +
    'stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M4 7h3l2-2h6l2 2h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/>' +
    '<circle cx="12" cy="13" r="4"/></svg><b>הוספת תמונה</b>';

/* התמונה נשארת בראש הטופס, וביחס שבו היא באמת תישמר — מסגרת
   רחבה ולא עיגול קטן. "הסרה" מופיע רק כשיש מה להסיר. */
function photoField(current, name, onChange){
  const has = !!imgTag(current);
  return `<div class="field">
    <label>תמונה</label>
    <div class="photo-wide">
      <button type="button" class="prev" id="phPrev"${has ? '' : ' aria-label="הוספת תמונה"'}
        >${imgTag(current) || PHOTO_EMPTY}</button>
      <div class="acts">
        <!-- כשאין תמונה, המסגרת עצמה כבר אומרת "הוספת תמונה" והיא
             לחיצה. כפתור שני מתחתיה עושה בדיוק אותו דבר במילים
             אחרות, ומכריח את העין לבחור בין שתי אפשרויות זהות. -->
        <button type="button" id="phPick"${has ? '' : ' hidden'}>${has ? 'החלפה' : 'בחירת תמונה'}</button>
        <button type="button" id="phClear" class="cut"${has ? '' : ' hidden'}>הסרה</button>
      </div>
    </div>
    <p class="hint photo-hint">אפשר גם אחר כך — אבל תמונה אחת היא מה שהופך את העץ למשפחה.</p>
    <input type="file" id="phFile" accept="image/*" hidden>
  </div>`;
}
function wirePhoto(get, set){
  const f = document.getElementById('phFile');
  const prev = document.getElementById('phPrev');
  if(!f) return;
  const pick = document.getElementById('phPick');
  const clear = document.getElementById('phClear');
  /* כפתור "הסרה" שמוצג כשאין תמונה הוא כפתור מת. הוא מופיע רק
     כשיש מה להסיר, והכפתור השני מחליף מילה בהתאם. */
  const sync = has => {
    if(clear) clear.hidden = !has;
    if(pick){
      pick.hidden = !has;              // בלי תמונה המסגרת היא הכפתור היחיד
      pick.textContent = has ? 'החלפה' : 'בחירת תמונה';
    }
    if(prev){
      if(has) prev.removeAttribute('aria-label');
      else prev.setAttribute('aria-label', 'הוספת תמונה');
    }
  };
  const open = () => {
    /* איפוס הערך, אחרת בחירה חוזרת באותו קובץ אינה מפעילה onchange
       והכפתור נראה מת — במיוחד אחרי ביטול של החיתוך. */
    f.value = '';
    f.click();
  };
  pick.onclick = open;
  prev.onclick = open;                 // המסגרת כולה היא כפתור
  clear.onclick = () => { set('', ''); prev.innerHTML = PHOTO_EMPTY; sync(false); };
  f.onchange = () => {
    const file = f.files && f.files[0];
    if(!file) return;
    /* אין יותר מגבלת גודל: אנחנו מקטינים בעצמנו, ולכן תמונה
       ישירות מהטלפון מתקבלת בלי שהמשתמש יצטרך לעשות דבר. */
    if(!/^image\//.test(file.type || '')){ toast('צריך לבחור קובץ תמונה'); return; }
    const back = () => {
      const cur = get();
      prev.innerHTML = imgTag(cur) || PHOTO_EMPTY;
      sync(!!imgTag(cur));
    };
    openCropper(file).then(r => {
      if(!r) return back();            // המשתמש ביטל
      set(r.photo, r.thumb);
      prev.innerHTML = imgTag(r.thumb) || PHOTO_EMPTY;
      sync(!!imgTag(r.thumb));
    }).catch(e => {
      toast(e.message || 'לא הצלחתי לעבד את התמונה');
      back();
    });
  };
}

/* ---------- עריכת אדם, למנהל בלבד ---------- */
/* מחיקה אף פעם לא חסומה. השאלה היחידה היא איך היא מתבצעת:
   מי שתלוי בו ענף מוחלף בממלא מקום, כדי שהעץ לא יתפרק. */
function deleteBlocker(){ return null; }

/* האם האדם שייך לקו הדם של המשפחה */
const isBlood = id => id === DB.root || DB.unions.some(u => u.children.includes(id));

/* מחיקה מלאה או ממלא מקום.
   מי שנישא לתוך המשפחה אפשר למחוק לגמרי גם כשיש ילדים,
   כי הילדים ממשיכים להיות תלויים בבן הזוג מקו הדם.
   כששני בני הזוג הם מהמשפחה — שניהם מוחלפים בממלא מקום. */
function deleteMode(id){
  if(!DB.people[id]) return 'full';
  if(!unionsOf(id).some(u => u.children.length)) return 'full';
  if(isBlood(id)) return 'placeholder';
  // אם אחרי המחיקה תישאר זוגיות עם ילדים ובלי אף הורה — עדיף ממלא מקום
  const orphaning = unionsOf(id).some(u =>
    u.children.length && !u.partners.some(p => p !== id && DB.people[p]));
  return orphaning ? 'placeholder' : 'full';
}

/* כמה אנשים תלויים באדם הזה — לצורך ההודעה לפני המחיקה */
function dependentsOf(id){
  const n = new Set();
  unionsOf(id).forEach(u => u.children.forEach(c => {
    n.add(c);
    subtreeSet(u).forEach(x => n.add(x));
  }));
  return n.size;
}

/* הופך אדם לממלא מקום: הפרטים נמחקים, הקשרים נשארים */
function toPlaceholder(id){
  const p = DB.people[id];
  if(!p) return;
  DB.people[id] = {id, name:'לא ידוע', surname:'', gender:p.gender, placeholder:true};
  for(let i = pending.length - 1; i >= 0; i--)
    if(pending[i].anchor === id || pending[i].target === id) pending.splice(i, 1);
  for(const k in SUB) delete SUB[k];
  refreshReqChip();
}
function deletePerson(id){
  if(deleteMode(id) === 'placeholder'){ toPlaceholder(id); layout(); render(); return; }
  delete DB.people[id];
  // בקשות שהיו תלויות באדם שנמחק כבר לא רלוונטיות
  for(let i = pending.length - 1; i >= 0; i--)
    if(pending[i].anchor === id || pending[i].target === id) pending.splice(i, 1);
  refreshReqChip();
  for(let i = DB.unions.length - 1; i >= 0; i--){
    const u = DB.unions[i];
    u.partners = u.partners.filter(p => p !== id);
    u.children = u.children.filter(c => c !== id);
    // זוגיות נמחקת רק כשלא נשאר בה אף אחד ואין לה ילדים
    if(!u.partners.length && !u.children.length){ expanded.delete(u.id); DB.unions.splice(i, 1); }
  }
  for(const k in SUB) delete SUB[k];
  layout(); render();
}

/* ---------- גיבוי וייבוא ---------- */
/* מספר גרסת מבנה הקובץ. גיבוי שנוצר במספר גבוה מזה נדחה,
   כי ייתכן שיש בו שדות שהגרסה הזאת לא מכירה ולא תשמור. */
const BACKUP_FORMAT = 1;
const clone = x => JSON.parse(JSON.stringify(x));
/* התאמת יחיד ורבים בעברית: plural(1,'אדם','אנשים') → 'אדם אחד' */
const plural = (n, one, many) => n === 1 ? one : n + ' ' + many;

/* כלל רך מול כלל חוסם.
   "אי אפשר לקשר אדם לצאצא שלו" הוא בלתי אפשרי ולכן חוסם.
   "הפרש הגילאים גדול מ-40 שנה" הוא חריג אבל קורה — נישואים
   שניים, הורה מבוגר — ולכן הוא אזהרה שאפשר לאשר. קודם הוא חסם,
   ואדם כזה פשוט לא היה ניתן לרישום בכלל. */
const SOFT_MARK = '⚠';
const soft      = m => SOFT_MARK + m;
const isSoft    = m => typeof m === 'string' && m.charAt(0) === SOFT_MARK;
const softText  = m => isSoft(m) ? m.slice(1) : m;
/* 2026-10-06 → 6.10.2026 */
const ilDate = iso => {
  const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? Number(m[3]) + '.' + Number(m[2]) + '.' + m[1] : String(iso || '').slice(0, 10);
};

/* עותק מלא, לא הפניות לעץ החי. בלי זה, כל מי שישנה את
   התוצאה — למשל כדי לייצא ענף אחד בלבד — היה משנה את העץ עצמו. */
function backupData(){
  /* שדות פנימיים של הפריסה (כמו _occ) אינם חלק מהמשפחה. הם ניפחו
     את קובץ הגיבוי וגם חזרו פנימה בייבוא, כמצב ציור ישן. */
  const unions = clone(DB.unions).map(u => ({
    id: u.id, partners: u.partners, children: u.children, status: statusOf(u)
  }));
  return {
    format: BACKUP_FORMAT,
    family: FAMILY.name,
    exportedAt: new Date().toISOString(),
    root: DB.root,
    people: clone(DB.people),
    unions,
    pending: clone(pending)
  };
}

document.getElementById('btnExport').onclick = () => {
  closeMore();
  const data = JSON.stringify(backupData(), null, 2);
  const url = URL.createObjectURL(new Blob([data], {type:'application/json'}));
  const a = document.createElement('a');
  a.href = url;
  a.download = 'family-tree-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('הגיבוי הורד');
};

/* ---------- בדיקת קובץ גיבוי ----------
   כל התקלות נעצרות כאן. קובץ שלא עובר את כל הבדיקות
   לא נוגע בעץ בכלל — אין ייבוא חלקי.
   מחזיר {err:'...'} או {data:{...}, dropped:n, soft:[...]} */
function readBackup(raw){
  let j;
  try { j = JSON.parse(raw); }
  catch(e){ return {err:'הקובץ אינו JSON תקין. ייתכן שנפגם, או שאינו קובץ גיבוי'}; }
  if(!j || typeof j !== 'object' || Array.isArray(j))
    return {err:'מבנה הקובץ אינו של גיבוי'};
  if(j.format != null && !(Number(j.format) <= BACKUP_FORMAT))
    return {err:'הגיבוי נוצר בגרסה חדשה יותר של האפליקציה'};

  const people = j.people, unions = j.unions;
  if(!people || typeof people !== 'object' || Array.isArray(people))
    return {err:'חסרה בקובץ רשימת האנשים'};
  if(!Array.isArray(unions)) return {err:'חסרה בקובץ רשימת הזוגיות'};
  if(typeof j.root !== 'string' || !j.root) return {err:'חסר בקובץ השורש של העץ'};

  const ids = Object.keys(people);
  if(!ids.length) return {err:'הגיבוי ריק — אין בו אנשים'};
  if(!people[j.root]) return {err:'השורש שרשום בגיבוי אינו קיים ברשימת האנשים'};

  /* אנשים */
  const warnings = [];   /* לא soft: זה היה מצלל את הפונקציה soft() */
  for(const id of ids){
    const p = people[id];
    if(!p || typeof p !== 'object' || Array.isArray(p)) return {err:'רשומת אדם פגומה: ' + id};
    const who = typeof p.name === 'string' && p.name ? p.name : id;
    if(p.id !== id) return {err:'המזהה של ' + who + ' אינו תואם למקומו ברשימה'};
    if(typeof p.name !== 'string' || !p.name.trim()) return {err:'לאדם ' + id + ' אין שם'};
    if(p.gender !== 'male' && p.gender !== 'female')
      return {err:'לאדם ' + who + ' אין מגדר תקין'};
    for(const k of ['surname','maiden','city','phone','email','photo','thumb','birth','death'])
      if(p[k] != null && typeof p[k] !== 'string')
        return {err:'השדה ' + labelOf(k) + ' של ' + who + ' אינו טקסט'};
    /* תאריכים מנורמלים כאן, כדי שכל העץ ישמור על אותו פורמט */
    for(const k of ['birth','death']){
      if(!p[k]) continue;
      const n = normDate(p[k]);
      if(n === null) return {err:'התאריך "' + p[k] + '" של ' + who + ' אינו מזוהה'};
      p[k] = n;
    }
    if(p.birth && p.death && dateMax(p.death) < dateMin(p.birth))
      warnings.push('אצל ' + who + ' תאריך הפטירה מוקדם מתאריך הלידה');
    if(p.notes != null){
      if(!Array.isArray(p.notes)) return {err:'הפתקים של ' + who + ' אינם רשימה'};
      for(const n of p.notes)
        if(!n || typeof n !== 'object' || typeof n.text !== 'string')
          return {err:'יש פתק פגום אצל ' + who};
    }
  }

  /* זוגיות */
  const seenU = new Set(), parentU = {};
  for(const u of unions){
    if(!u || typeof u !== 'object' || Array.isArray(u)) return {err:'רשומת זוגיות פגומה'};
    if(typeof u.id !== 'string' || !u.id) return {err:'לאחת הזוגיות אין מזהה'};
    if(seenU.has(u.id)) return {err:'שתי זוגיות עם אותו מזהה: ' + u.id};
    seenU.add(u.id);
    if(!Array.isArray(u.partners) || !Array.isArray(u.children))
      return {err:'מבנה הזוגיות ' + u.id + ' פגום'};
    if(!u.partners.length && !u.children.length)
      return {err:'יש בגיבוי זוגיות ריקה: ' + u.id};
    if(u.partners.length > 2)
      return {err:'בזוגיות ' + u.id + ' רשומים יותר משני בני זוג'};
    if(new Set(u.partners).size !== u.partners.length)
      return {err:'אותו אדם רשום פעמיים כבן זוג באותה זוגיות'};
    if(new Set(u.children).size !== u.children.length)
      return {err:'אותו ילד רשום פעמיים באותה זוגיות'};
    if(u.status != null && (typeof u.status !== 'string' || !STATUS_HE[u.status] || u.status === 'none'))
      return {err:'סטטוס לא מוכר בזוגיות ' + u.id};
    for(const x of u.partners.concat(u.children))
      if(typeof x !== 'string' || !people[x])
        return {err:'הזוגיות ' + u.id + ' מפנה לאדם שאינו קיים בגיבוי'};
    for(const c of u.children){
      if(u.partners.includes(c))
        return {err:people[c].name + ' רשום באותה זוגיות גם כהורה וגם כילד'};
      if(parentU[c]) return {err:people[c].name + ' רשום כילד בשתי זוגיות'};
      parentU[c] = u.id;
    }
  }

  /* מעגל בעץ — אדם שרשום כצאצא של עצמו.
     בלי הבדיקה הזאת חישוב הפריסה נכנס ללופ אין-סופי ומקפיא את הדפדפן. */
  const parentsOf = {};
  unions.forEach(u => u.children.forEach(c => { parentsOf[c] = u.partners; }));
  const mark = {};                       // 1 = בתהליך, 2 = נקי
  const climb = id => {
    if(mark[id] === 2) return false;
    if(mark[id] === 1) return true;
    mark[id] = 1;
    for(const p of (parentsOf[id] || [])) if(climb(p)) return true;
    mark[id] = 2;
    return false;
  };
  for(const id of ids)
    if(climb(id)) return {err:'יש מעגל בעץ — אדם שרשום כצאצא של עצמו'};

  /* בקשות ממתינות הן נתון זמני, ולכן לא מפילות את הייבוא.
     בקשה שמצביעה על אדם שאינו בגיבוי פשוט נזרקת. */
  let dropped = 0;
  const reqs = [];
  if(Array.isArray(j.pending))
    j.pending.forEach(r => {
      const ok = r && typeof r === 'object' && typeof r.id === 'string' &&
        (r.anchor == null || !!people[r.anchor]) &&
        (r.target == null || !!people[r.target]);
      if(ok) reqs.push(r); else dropped++;
    });

  return {dropped, soft: warnings, data:{
    format: Number(j.format) || 1,
    family: typeof j.family === 'string' ? j.family : '',
    exportedAt: typeof j.exportedAt === 'string' ? j.exportedAt : '',
    root: j.root, people, unions, pending: reqs
  }};
}

/* ---------- השוואה בין הגיבוי לעץ הנוכחי ---------- */
/* השינויים ברשומת אדם, כולל פתקים. מתבסס על diffFields כדי
   לא לשכפל את רשימת השדות. */
function personChanges(cur, inc){
  const ks = diffFields(cur, inc);
  const sig = a => JSON.stringify((a || []).map(n => [n.text || '', n.by || '']));
  if(sig(cur.notes) !== sig(inc.notes)) ks.push('notes');
  if(!!cur.placeholder !== !!inc.placeholder) ks.push('placeholder');
  return ks;
}
const sameUnion = (a, b) =>
  a.partners.join(',') === b.partners.join(',') &&
  a.children.join(',') === b.children.join(',') &&
  statusOf(a) === statusOf(b);

function backupDiff(bk){
  const inc = bk.people, add = [], upd = [], same = [];
  Object.keys(inc).forEach(id => {
    if(!DB.people[id]) add.push(id);
    else if(personChanges(DB.people[id], inc[id]).length) upd.push(id);
    else same.push(id);
  });
  const only = Object.keys(DB.people).filter(id => !inc[id]);

  const curU = {}; DB.unions.forEach(u => curU[u.id] = u);
  const incU = {}; bk.unions.forEach(u => incU[u.id] = u);
  const uAdd  = bk.unions.filter(u => !curU[u.id]).length;
  const uUpd  = bk.unions.filter(u => curU[u.id] && !sameUnion(curU[u.id], u)).length;
  const uOnly = DB.unions.filter(u => !incU[u.id]).length;

  /* מצב העץ אחרי מיזוג, בלי לגעת בעץ האמיתי — רק כדי לדעת מי ירחף */
  const simP = Object.assign({}, DB.people);
  Object.keys(inc).forEach(id => simP[id] = inc[id]);
  const simU = DB.unions.map(u => incU[u.id] || u)
    .concat(bk.unions.filter(u => !curU[u.id]));
  const floatAfter = Object.keys(simP).length -
    reachableFromRoot({people:simP, unions:simU, root:DB.root}).size;
  const floatNow = Object.keys(DB.people).length - reachableFromRoot().size;

  return {add, upd, same, only, uAdd, uUpd, uOnly, floatNow, floatAfter,
          rootDiff: bk.root !== DB.root};
}

/* ---------- ביצוע הייבוא ----------
   mode: 'merge' מוסיף ומעדכן ולא מוחק, 'replace' מחליף את העץ כולו.
   drop: במיזוג בלבד — למחוק גם את מי שבעץ ואינו בגיבוי.
   מחזיר תיאור מה קרה, להודעה למשתמש. */
function applyBackup(bk, mode, drop){
  /* כשמחוברים לשרת, מזהים שאינם בפורמט של המסד מוחלפים כאן.
     אחרי זה שכבת ההשוואה הרגילה דוחפת הכל — אין מסלול כתיבה שני. */
  if(SUPA.enabled) bk = remapIds(bk);
  const out = {added:0, updated:0, removed:0, blanked:0};
  const inc = bk.people;

  if(mode === 'replace'){
    DB = {people: clone(inc), unions: clone(bk.unions), root: bk.root};
    pending.length = 0;
    clone(bk.pending || []).forEach(r => pending.push(r));
    out.added = Object.keys(DB.people).length;
  } else {
    Object.keys(inc).forEach(id => {
      if(DB.people[id]) out.updated++; else out.added++;
      DB.people[id] = clone(inc[id]);
    });
    const byId = {}; DB.unions.forEach(u => byId[u.id] = u);
    bk.unions.forEach(u => {
      const t = byId[u.id];
      if(t){ t.partners = u.partners.slice(); t.children = u.children.slice();
             t.status = statusOf(u); }
      else DB.unions.push(clone(u));
    });
    if(drop){
      /* השורש לעולם לא נמחק — בלעדיו אין עץ */
      let list = Object.keys(DB.people).filter(id => !inc[id] && id !== DB.root);
      /* קולפים מהעלים פנימה: בכל סבב מוחקים רק את מי שאפשר למחוק
         לגמרי. כך ענף שלם שכולו מחוץ לגיבוי נמחק כולו, ורק מי
         שהילדים שלו נשארים בעץ הופך לממלא מקום. */
      let moved = true;
      while(moved){
        moved = false;
        list = list.filter(id => {
          if(!DB.people[id]) return false;
          if(deleteMode(id) !== 'full') return true;
          deletePerson(id); out.removed++; moved = true;
          return false;
        });
      }
      list.forEach(id => {
        if(!DB.people[id]) return;
        if(deleteMode(id) === 'placeholder') out.blanked++; else out.removed++;
        deletePerson(id);
      });
    }
  }

  /* איפוס כל מה שתלוי במזהים שהשתנו */
  expanded.clear();
  for(const k in hostOf) delete hostOf[k];
  for(const k in SUB)    delete SUB[k];
  savedExpanded = null;
  draft = null;
  if(editMode){
    editMode = false;
    const b = document.getElementById('btnEditMode');
    if(b){ b.textContent = 'מצב עריכה'; b.classList.remove('mode-on'); }
  }
  /* בקשות שאיבדו את האדם שאליו הן מקושרות */
  for(let i = pending.length - 1; i >= 0; i--){
    const r = pending[i];
    if((r.anchor && !DB.people[r.anchor]) || (r.target && !DB.people[r.target]))
      pending.splice(i, 1);
  }
  refreshReqChip();
  return out;
}

/* ---------- מסך הייבוא ---------- */
const countLine = (label, n, cls) => !n ? '' :
  '<div class="imp-row"><span>' + label + '</span><b class="' + (cls || '') + '">' + n + '</b></div>';

function importReportHTML(bk, df, mode, drop){
  if(mode === 'replace'){
    const gone = df.only.length;
    return countLine('אנשים אחרי הייבוא', Object.keys(bk.people).length) +
      countLine('זוגיות אחרי הייבוא', bk.unions.length) +
      countLine(gone === 1 ? 'יימחק מהעץ — אינו בגיבוי' : 'יימחקו מהעץ — אינם בגיבוי', gone, 'bad') +
      countLine('בקשות ממתינות שיוחזרו מהגיבוי', (bk.pending || []).length) +
      (gone ? '<p class="imp-note bad">החלפה מלאה מוחקת לגמרי, כולל הפתקים, את ' +
        plural(gone, 'האדם הזה', 'האנשים האלה') + ': ' +
        esc(df.only.slice(0, 6).map(id => fullName(DB.people[id])).join(', ')) +
        (gone > 6 ? ' ועוד ' + (gone - 6) : '') + '</p>' : '') +
      (bk.root !== DB.root ? '<p class="imp-note">השורש יוחלף ל' +
        esc(fullName(bk.people[bk.root])) + ', כפי שרשום בגיבוי.</p>' : '');
  }
  return ((SUPA.enabled && isForeignBackup(bk) && df.same.length === 0 && df.add.length > 1)
    ? '<p class="imp-note bad">הגיבוי הזה לא נוצר מהעץ שבשרת, ולכן אי אפשר להתאים בין האנשים שבו ' +
      'לאנשים הקיימים. <b>במיזוג כולם ייכנסו כחדשים, וכל אדם יופיע פעמיים.</b> ' +
      'אם המטרה היא להחליף את העץ — בחרו החלפה מלאה.</p>'
    : '') +
    countLine(df.add.length === 1 ? 'אדם חדש שיתווסף' : 'אנשים חדשים שיתווספו', df.add.length, 'good') +
    countLine(df.upd.length === 1 ? 'אדם שפרטיו יתעדכנו' : 'אנשים שפרטיהם יתעדכנו', df.upd.length) +
    countLine(df.same.length === 1 ? 'אדם ללא שינוי' : 'אנשים ללא שינוי', df.same.length, 'mute') +
    countLine(df.uAdd === 1 ? 'זוגיות חדשה' : 'זוגיות חדשות', df.uAdd, 'good') +
    countLine(df.uUpd === 1 ? 'זוגיות שתתעדכן' : 'זוגיות שיתעדכנו', df.uUpd) +
    countLine(df.only.length === 1 ? 'בעץ ואינו בגיבוי' : 'בעץ ואינם בגיבוי',
              df.only.length, drop ? 'bad' : 'mute') +
    (df.only.length ? '<p class="imp-note' + (drop ? ' bad' : '') + '">' +
      esc(df.only.slice(0, 6).map(id => fullName(DB.people[id])).join(', ')) +
      (df.only.length > 6 ? ' ועוד ' + (df.only.length - 6) : '') +
      (drop ? '. מי שתלויים בו ילדים יהפוך ל"לא ידוע" במקום להימחק, כדי שהענף לא יתפרק.'
            : (df.only.length === 1 ? '. במיזוג הוא נשאר בעץ.' : '. במיזוג הם נשארים בעץ.')) +
      '</p>' : '') +
    (df.uOnly ? '<p class="imp-note">' +
      plural(df.uOnly, 'זוגיות אחת קיימת', 'זוגיות קיימות') +
      ' בעץ ואינן בגיבוי. במיזוג הן נשארות.</p>' : '') +
    (df.floatAfter > df.floatNow ? '<p class="imp-note bad">' +
      plural(df.floatAfter - df.floatNow, 'אדם אחד לא יהיה מחובר', 'אנשים לא יהיו מחוברים') +
      ' לעץ מהשורש הנוכחי, ויופיע באזור המרחפים.</p>' : '') +
    (df.rootDiff ? '<p class="imp-note">בגיבוי רשום שורש אחר (' +
      esc(fullName(bk.people[bk.root])) +
      '). במיזוג השורש הנוכחי נשמר. להחלפת השורש יש לבחור החלפה מלאה.</p>' : '');
}

function openImportPanel(res, fileName){
  const bk = res.data;
  const st = {mode:'merge', drop:false};
  const df = backupDiff(bk);
  const nFam = bk.family && FAMILY.name && bk.family !== FAMILY.name;

  openPanel('ייבוא מגיבוי', `
    <div class="form-head">
      <b>${esc(fileName || 'קובץ גיבוי')}</b>
      <span>${plural(Object.keys(bk.people).length, 'אדם אחד', 'אנשים')} · ${
        plural(bk.unions.length, 'זוגיות אחת', 'זוגיות')}${
        bk.exportedAt ? ' · גובה ב-' + esc(ilDate(bk.exportedAt)) : ''}</span>
    </div>
    ${nFam ? '<p class="err">שימו לב: הגיבוי הוא של "' + esc(bk.family) +
      '" והאפליקציה הזאת היא של "' + esc(FAMILY.name) + '".</p>' : ''}
    ${res.dropped ? '<p class="imp-note">' +
      plural(res.dropped, 'בקשה ממתינה אחת בגיבוי מצביעה', 'בקשות ממתינות בגיבוי מצביעות') +
      ' על אנשים שאינם בו, ולא ייובאו.</p>' : ''}
    ${res.soft.length ? '<p class="imp-note bad">' +
      esc(res.soft.slice(0,3).join('. ')) +
      (res.soft.length > 3 ? ' ועוד ' + (res.soft.length - 3) : '') +
      '. הייבוא יתבצע בכל זאת, כדאי לבדוק אחר כך.</p>' : ''}
    <div class="field">
      <label>איך לייבא</label>
      <div class="pick" id="impMode">
        <button data-m="merge" class="on">מיזוג</button>
        <button data-m="replace" class="cut">החלפה מלאה</button>
      </div>
      <p class="imp-note" id="impHint">מיזוג מוסיף ומעדכן, ולא מוחק אף אחד.</p>
    </div>
    <div class="imp-report" id="impReport"></div>
    <div id="impDropWrap"></div>
    <div id="impActions" class="form-actions">
      <button class="btn btn-primary" id="impGo">ייבוא</button>
      <button class="btn btn-ghost" id="impNo">ביטול</button>
    </div>`,
  () => {
    const g = id => panelBody.querySelector('#' + id);

    const paint = () => {
      g('impReport').innerHTML = importReportHTML(bk, df, st.mode, st.drop);
      g('impHint').textContent = st.mode === 'merge'
        ? 'מיזוג מוסיף ומעדכן, ולא מוחק אף אחד.'
        : 'החלפה מלאה הופכת את העץ למה שכתוב בגיבוי בלבד.';
      g('impDropWrap').innerHTML =
        (st.mode === 'merge' && df.only.length)
          ? '<button class="anchor-btn" id="impDrop" style="border-style:solid">' +
            (st.drop ? '☑' : '☐') + ' למחוק גם את ' +
            plural(df.only.length, 'האדם שבעץ ואינו בגיבוי', 'האנשים שבעץ ואינם בגיבוי') +
            '</button>'
          : '';
      const d = g('impDrop');
      if(d) d.onclick = () => { st.drop = !st.drop; paint(); };
      g('impMode').querySelectorAll('button').forEach(b => {
        b.classList.toggle('on', b.dataset.m === st.mode);
      });
    };

    g('impMode').onclick = e => {
      const b = e.target.closest('button[data-m]');
      if(!b) return;
      st.mode = b.dataset.m;
      if(st.mode === 'replace') st.drop = false;
      paint();
    };
    paint();

    g('impNo').onclick = closePanel;
    g('impGo').onclick = () => {
      /* אישור כפול, כמו בכל פעולה שאינה ניתנת לביטול */
      panelBody.classList.add('confirming');
      const warn = st.mode === 'replace'
        ? 'החלפה מלאה: העץ הנוכחי יימחק ובמקומו ייכנס מה שכתוב בגיבוי. לבצע?'
        : st.drop
          ? 'מיזוג, וגם מחיקת ' +
            plural(df.only.length, 'אדם אחד שאינו בגיבוי', 'אנשים שאינם בגיבוי') + '. לבצע?'
          : 'מיזוג הגיבוי לעץ. לבצע?';
      g('impActions').innerHTML =
        '<div style="width:100%"><p class="err" style="color:var(--ink)">' + warn + '</p>' +
        '<div class="form-actions">' +
        '<button class="btn btn-primary" id="impYes">כן</button>' +

}

   מודול 10 — טופס אדם משותף, מצב עריכה, ובקשות עריכה
   ============================================================ */
/* רק שלושת הראשונים גלויים כברירת מחדל. השאר מקופל — לא כדי
   להסתיר, אלא כדי שמי שיודע מעט לא יראה טופס שנראה כאילו אינו
   מסוגל למלא אותו. */
const FIELDS = [
  {k:'name',    label:'שם פרטי',      req:true, col:true},
  {k:'surname', label:'שם משפחה',     req:true, col:true},
  {k:'birth',   label:'תאריך לידה',   type:'date'},
  {k:'maiden',  label:'שם נעורים',    group:'extra'},
  {k:'death',   label:'תאריך פטירה',  type:'date', group:'extra'},
  {k:'city',    label:'עיר מגורים',   group:'extra'},
  {k:'phone',   label:'טלפון',  group:'extra', half:true},
  {k:'email',   label:'אימייל', group:'extra', half:true},
];

/* תאריך יכול להיות שנה בלבד, חודש ושנה, או תאריך מלא.
   בדורות הראשונים לרוב יודעים רק שנה. */
const pad2 = n => String(n).padStart(2, '0');

/* מספר הימים בחודש, כולל שנים מעוברות. יום 0 של החודש הבא
   הוא האחרון של החודש הנוכחי. */
const daysInMonth = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();

/* תאריך שהצורה שלו נכונה עדיין יכול להיות בלתי אפשרי:
   31 באפריל, 29 בפברואר בשנה שאינה מעוברת, חודש 13, שנת 2099.
   עד שהבדיקה הזו נוספה, "13/1948" הגיע למסך והפיל את הכרטיס. */
function realDate(y, m, d){
  const maxYear = new Date().getFullYear() + 1;
  if(!(y >= 1000 && y <= maxYear)) return false;
  if(m === undefined) return true;
  if(!(m >= 1 && m <= 12)) return false;
  if(d === undefined) return true;
  return d >= 1 && d <= daysInMonth(y, m);
}

function normDate(s){
  s = (s || '').trim();
  if(!s) return '';
  let m, y, mo, dy;
  if(/^\d{4}$/.test(s)){
    return realDate(+s) ? s : null;
  }
  if((m = s.match(/^(\d{4})-(\d{1,2})$/)))         { y = +m[1]; mo = +m[2]; }
  else if((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) { y = +m[1]; mo = +m[2]; dy = +m[3]; }
  else if((m = s.match(/^(\d{1,2})[./](\d{4})$/))) { y = +m[2]; mo = +m[1]; }
  else if((m = s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})$/))) { y = +m[3]; mo = +m[2]; dy = +m[1]; }
  else return null;                                     // צורה לא מזוהה

  if(!realDate(y, mo, dy)) return null;                 // צורה תקינה, תאריך בלתי אפשרי
  return dy === undefined ? y + '-' + pad2(mo)
                          : y + '-' + pad2(mo) + '-' + pad2(dy);
}
const isFullDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
const dateMin = s => !s ? '' : s.length === 4 ? s + '-01-01' : s.length === 7 ? s + '-01' : s;
const dateMax = s => !s ? '' : s.length === 4 ? s + '-12-31' : s.length === 7 ? s + '-31' : s;
const yearOfDate = s => s ? Number(String(s).slice(0, 4)) : null;
const GENDER_HE = g => g === 'male' ? 'זכר' : g === 'female' ? 'נקבה' : '';

const snapshot = p => ({
  gender:p.gender||'', photo:p.photo||'', thumb:p.thumb||'',
  name:p.name||'', surname:p.surname||'', maiden:p.maiden||'',
  birth:p.birth||'', death:p.death||'', city:p.city||'',
  phone:p.phone||'', email:p.email||''
});

/* רשימת מה שבתוך "עוד פרטים". withMaiden הוא בוליאני ולא מגדר,
   כי "שם נעורים" תלוי גם בקשר המשפחתי ולא רק במגדר — וגזירה
   חוזרת מהמגדר בלבד הבטיחה שדה שנשאר מוסתר. */
function foldSummary(extra, withMaiden){
  return extra.filter(f => f.k !== 'maiden' || withMaiden)
              .map(f => f.label).join(' · ');
}

/* טופס אדם מלא. כל השדות מוצגים, גם הריקים. */
function personFormHTML(d){
  const today = new Date().toISOString().slice(0,10);
  const fld = f => {
      const isDate = f.type === 'date';
      return '<div class="field' + (f.half ? ' half' : '') + (f.col ? ' col' : '') + '"' +
          (f.k==='maiden' ? ' id="pfMaidenWrap"' + (d.gender==='female'?'':' hidden') : '') +
          (f.group === 'extra' ? ' data-opt="1"' : '') + '>' +
          '<label>' + f.label + (f.req ? ' <span class="req">*</span>' : '') + '</label>' +
          (f.textarea
            ? '<textarea id="pf_' + f.k + '" rows="4" placeholder="סיפור, זיכרון, כינוי, או כל פרט ' +
                'משפחתי אחר שכדאי לדעת">' + esc(d[f.k] || '') + '</textarea>'
            : isDate
            ? '<div class="datewrap">' +
                '<label class="datebtn" title="בחירה מלוח שנה">' +
                  '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" ' +
                    'stroke="currentColor" stroke-width="1.7" stroke-linecap="round">' +
                    '<rect x="3" y="5" width="18" height="16" rx="3"/>' +
                    '<path d="M8 3v4M16 3v4M3 10h18"/></svg>' +
                  '<input type="date" id="pick_' + f.k + '" max="' + today + '"></label>' +
                '<input class="datetext" id="pf_' + f.k + '" value="' + esc(d[f.k] || '') +
                  '" placeholder="שנה בלבד, או תאריך מלא" inputmode="numeric">' +
              '</div><span class="hint">אפשר לרשום רק שנה, למשל 1948</span>'
            : '<input id="pf_' + f.k + '" value="' + esc(d[f.k] || '') + '">') +
        '</div>';
  };
  const base  = FIELDS.filter(f => f.group !== 'extra');
  const extra = FIELDS.filter(f => f.group === 'extra');
  /* כתוב מתחת לקיפול מה יש בפנים. קיפול בלי רשימה נראה כאילו
     הוסתר משהו, ואז אנשים פותחים אותו בכל פעם סתם.
     "שם נעורים" מופיע רק לאישה, ולכן גם ברשימה הוא מותנה —
     אחרת הרשימה מבטיחה שדה שלא יימצא בפנים. */
  const inside = foldSummary(extra, d.gender === 'female');
  return '<div class="form-fields">' + photoField(d.photo || '', d.name || '') +
    '<div class="field"><label>מגדר</label><div class="pick two">' +
      '<button data-g="male" class="'   + (d.gender==='male'?'on':'')   + '">זכר</button>' +
      '<button data-g="female" class="' + (d.gender==='female'?'on':'') + '">נקבה</button>' +
    '</div></div>' +
    base.map(fld).join('') +
    '<button type="button" class="fold" id="pfFold" aria-expanded="false">' +
      '<span><span class="t">עוד פרטים</span><span class="s">' + esc(inside) + '</span></span>' +
      '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" ' +
        'stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">' +
        '<polyline points="6 9 12 15 18 9"/></svg>' +
    '</button>' +
    '<div class="fold-body" id="pfExtra" hidden>' + extra.map(fld).join('') + '</div>' +
    '</div>';
}

/* פתק בודד בסגנון דף שורות */
function noteCard(n){
  return '<div class="note-card"><div class="note-body">' + esc(n.text) + '</div>' +
    '<div class="note-by">' + esc(n.by || 'לא ידוע') + '</div></div>';
}
let extraOpen = false;      // נשמר בין טפסים באותה הפעלה
function readPersonForm(root, d){
  FIELDS.forEach(f => {
    const el = root.querySelector('#pf_' + f.k);
    if(el) d[f.k] = (el.value || '').trim();
  });
  return d;
}
function wirePersonForm(root, d){
  // בחירה מלוח שנה ממלאת את שדה הטקסט
  FIELDS.filter(f => f.type === 'date').forEach(f => {
    const pick = root.querySelector('#pick_' + f.k), txt = root.querySelector('#pf_' + f.k);
    if(pick && txt) pick.onchange = () => { if(pick.value){ txt.value = pick.value; d[f.k] = pick.value; } };
  });
  /* הקיפול. כשהמנהל פותח אותו פעם אחת הוא נשאר פתוח לכל הטפסים
     בהמשך הפעלה — מי שממלא הרבה לא צריך לפתוח בכל פעם מחדש. */
  const fold = root.querySelector('#pfFold'), body = root.querySelector('#pfExtra');
  if(fold && body){
    const set = open => {
      body.hidden = !open;
      fold.setAttribute('aria-expanded', open ? 'true' : 'false');
    };
    set(extraOpen);
    fold.onclick = () => { extraOpen = body.hidden; set(extraOpen); };
  }
  root.querySelectorAll('.pick button').forEach(b => b.onclick = () => {
    readPersonForm(root, d);
    d.gender = b.dataset.g;
    root.querySelectorAll('.pick button').forEach(x => x.classList.toggle('on', x === b));
    const w = root.querySelector('#pfMaidenWrap');
    if(w) w.hidden = d.gender !== 'female';
  });
  wirePhoto(() => d.thumb || d.photo, (full, thumb) => { d.photo = full; d.thumb = thumb; });
}
/* איזה שדה הכשיל את הבדיקה האחרונה. ההודעה מוצגת ליד כפתור השמירה,
   בתחתית הטופס, בזמן שהשדה הבעייתי נמצא לרוב מחוץ למסך למעלה —
   ולכן צריך גם לגלול אליו ולסמן אותו. */
let badFieldKey = null;

function validatePerson(d){
  badFieldKey = null;
  /* הגזירה אינה קוסמטית: המסד דורש שם שאינו ריק אחרי גזירת רווחים,
     ולכן "   " היה עובר כאן ונדחה שם — עם שגיאה סתומה שעוצרת את כל
     השמירה. גוזרים גם כדי שלא יישמר שם עם רווחים בקצוות. */
  ['name','surname','maiden','city','phone','email'].forEach(k => {
    if(typeof d[k] === 'string') d[k] = d[k].trim();
  });
  if(!d.name || !d.surname){
    badFieldKey = d.name ? 'surname' : 'name';
    return 'שם פרטי ושם משפחה הם שדות חובה';
  }
  if(d.gender !== 'male' && d.gender !== 'female') return 'צריך לבחור מגדר';
  for(const f of FIELDS.filter(x => x.type === 'date')){
    const n = normDate(d[f.k]);
    /* הודעה אחת לשתי התקלות — צורה לא מזוהה ותאריך בלתי אפשרי —
       עם דוגמאות, כי "לא מזוהה" לבדו לא אומר למשתמש מה לתקן. */
    if(n === null){
      badFieldKey = f.k;
      return f.label + ' לא תקין. אפשר שנה (1948), חודש ושנה (3/1948) או תאריך מלא (5/3/1948)';
    }
    d[f.k] = n;
  }
  if(d.birth && d.death && dateMax(d.death) < dateMin(d.birth)){
    badFieldKey = 'death';
    return 'תאריך הפטירה מוקדם לתאריך הלידה';
  }
  if(d.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)){
    badFieldKey = 'email';
    return 'כתובת האימייל לא תקינה';
  }
  return null;
}

/* מציג את ההודעה, ובנוסף גולל אל השדה שגרם לה ומסמן אותו */
function showFormError(root, slotId, msg){
  const slot = root.querySelector('#' + slotId);
  if(slot) slot.innerHTML = '<p class="err">' + esc(msg) + '</p>';
  if(!badFieldKey) return;
  const input = root.querySelector('#pf_' + badFieldKey);
  if(!input) return;
  const box = input.closest('.field') || input;
  box.classList.add('bad');
  if(input.scrollIntoView) input.scrollIntoView({block:'center'});
  setTimeout(() => box.classList.remove('bad'), 2500);
}

/* עריכה יכולה לשבור את סדר הדורות — למשל הורה שנעשה צעיר מילדו.
   הבדיקה הזו רצה על אדם שכבר נמצא בעץ, מול הוריו וילדיו. */
function relationalIssue(id, d){
  const y = yearOfDate(d.birth);
  const par = DB.unions.find(u => u.children.includes(id));
  if(y && par) for(const pid of par.partners){
    const py = yearOfDate((DB.people[pid] || {}).birth);
    if(py && y - py < 12) return soft('הפרש הגילאים מההורים קטן מ-12 שנים');
  }
  for(const u of unionsOf(id)) for(const c of u.children){
    const cy = yearOfDate((DB.people[c] || {}).birth);
    if(y && cy && cy - y < 12) return soft('הפרש הגילאים מהילדים קטן מ-12 שנים');
  }
  /* אין בדיקה על גיל בפטירה. ילד שנפטר צעיר, או אב שנפטר
     לפני שנולד ילדו, הם מקרים אמיתיים ואסור לחסום אותם. */
  return null;
}

/* ---------- מצב עריכה של המנהל ---------- */
const btnEditMode = document.getElementById('btnEditMode');
btnEditMode.onclick = () => {

  btnEditMode.classList.toggle('mode-on', editMode);

};

/* מרנדר את גוף הכרטיסייה כטופס עריכה */
function renderSheetEdit(id, keep){
  const p = DB.people[id];
  if(!p) return;
  const d = keep || snapshot(p);
  /* המזהה חייב לשרוד את המעבר דרך הטופס. בלעדיו ההשוואה רואה
     פתקים חדשים לגמרי, מוחקת את כולם מהשרת ומוסיפה מחדש —
     בכל עריכה, גם כשלא נגעו בפתקים. */
  if(!keep) d.notes = (p.notes || []).map(n => ({id:n.id, text:n.text, by:n.by}));

  sheetBody.innerHTML =
    '<div class="sheet-top"><span></span>' +
      '<button class="panel-x" id="sheetX" title="סגירה">×</button></div>' +
    '<h2 style="font-family:var(--font-name);font-size:20px;margin:0 0 14px">עריכת ' +
      esc(fullName(p)) + '</h2>' +
    parentFieldHTML(id, d) +
    reconnectFieldHTML(id, d) +
    personFormHTML(d) +
    unionStatusHTML(id, d) +
    notesEditorHTML(d) +
    '<div id="pfErr"></div>' +
    '<div id="pfActions" class="form-actions">' +
      '<button class="btn btn-primary" id="pfSave">אישור</button>' +
      '<button class="btn btn-ghost" id="pfCancel">ביטול</button>' +
    '</div>' +
    '<div class="admin-row"><button class="btn btn-ghost" id="pfDel" ' +
      'style="color:var(--clay);border-color:#E0BDB6">מחיקה</button></div>';

  wirePersonForm(sheetBody, d);
  wireUnionStatus(sheetBody, d);
  /* ציור מחדש של רשימת הפתקים בלבד, בלי לאבד את שאר הטופס */
  const redrawNotes = () => renderSheetEditNotes(sheetBody, d, redrawNotes);
  wireNotesEditor(sheetBody, d, redrawNotes);
  const g = i => sheetBody.querySelector('#' + i);
  g('sheetX').onclick = closeSheet;

  const sbtn = g('pfSpouse');
  if(sbtn) sbtn.onclick = () => {
    readPersonForm(sheetBody, d);
    pickSpouse(id, tid => {
      const bad = spouseBlocker(id, tid);
      if(bad && !isSoft(bad)){ toast(bad); return; }
      if(bad) toast(softText(bad));        // אזהרה בלבד — הקישור נעשה
      d.spouseOf = tid;
      closePanel();
      renderSheetEdit(id, d);
    }, () => { closePanel(); renderSheetEdit(id, d); });
  };

  const pbtn = g('pfParents');
  if(pbtn && id !== DB.root) pbtn.onclick = () => {
    readPersonForm(sheetBody, d);
    pickCouple(id, uid => {
      const bad = reparentBlocker(id, uid);
      if(bad && !isSoft(bad)){ toast(bad); return; }
      if(bad) toast(softText(bad));        // אזהרה בלבד — השיוך נעשה
      d.parentUnion = uid;                 // יוחל רק באישור הסופי
      closePanel();
      renderSheetEdit(id, d);
    }, () => { closePanel(); renderSheetEdit(id, d); });
  };

  const confirmStep = (text, run) => {
    sheetBody.classList.add('confirming');
    g('pfActions').innerHTML =
      '<div style="width:100%"><p class="err" style="color:var(--ink)">' + text + '</p>' +
      '<div class="form-actions"><button class="btn btn-primary" id="pfYes">כן</button>' +
      '<button class="btn btn-ghost" id="pfNo">לא</button></div></div>';
    g('pfYes').onclick = () => { sheetBody.classList.remove('confirming'); run(); };
    g('pfNo').onclick = () => { sheetBody.classList.remove('confirming'); renderSheetEdit(id, d); };
  };

  g('pfSave').onclick = () => {
    readPersonForm(sheetBody, d);
    /* כל הבדיקות נאספות, ולא נעצרים על הראשונה.
       עם || האזהרה הרכה הייתה עוצרת את השרשרת, והחסימות שאחריה
       — למשל שיוך להורים שנמצאים מתחת בעץ — לא היו נבדקות בכלל. */
    const issues = [
      validatePerson(d),
      relationalIssue(id, d),
      d.parentUnion !== undefined ? reparentBlocker(id, d.parentUnion) : null,
      d.spouseOf ? spouseBlocker(id, d.spouseOf) : null
    ].filter(Boolean);
    const bad = issues.find(m => !isSoft(m)) || issues[0] || null;
    if(bad && !isSoft(bad)){ showFormError(sheetBody, 'pfErr', bad); return; }
    /* אזהרה רכה אינה עוצרת — היא רק מוודאת שהמנהל ראה אותה */
    confirmStep(bad ? esc(softText(bad)) + '. לשמור בכל זאת?' : 'לשמור את השינויים?', () => {
      d.noteBy = 'המנהל';
      applyFields(p, d);
      layout(); render(); closeSheet(); toast('נשמר');
    });
  };
  g('pfCancel').onclick = () => confirmStep('לבטל את השינויים?', () => closeSheet());
  g('pfDel').onclick = () => {
    if(deleteMode(id) === 'placeholder'){
      /* ממלא מקום שכבר ריק: המחיקה הייתה בונה אותו מחדש זהה, כלומר
         המשתמש מאשר ולא קורה שום דבר — בלי הודעה. עדיף להסביר. */
      if(p.placeholder){
        toast('הרשומה הזו כבר ריקה, והיא מחזיקה את הענף שמתחתיה');
        return;
      }
      const n = dependentsOf(id);
      confirmStep('באדם הזה תלויים ' + plural(n, 'בן משפחה אחד', 'בני משפחה') +
        '. הפרטים יימחקו והרשומה תוחלף בממלא מקום, כדי שהענף לא יתפרק. להמשיך?', () => {
        deletePerson(id); closeSheet(); toast('הפרטים נמחקו, הענף נשמר');
      });
    } else {
      const kids = unionsOf(id).reduce((n, u) => n + u.children.length, 0);
      confirmStep('למחוק את ' + esc(fullName(p)) + ' לצמיתות?' +
        (kids ? ' ' + plural(kids, 'הילד יישאר רשום', 'הילדים יישארו רשומים') +
                ' לבן/בת הזוג.' : ''), () => {
        deletePerson(id); closeSheet(); toast('נמחק');
      });
    }
  };
}

/* ---------- העברת אדם להורים אחרים ---------- */
const parentUnionOf = id => DB.unions.find(u => u.children.includes(id));

/* כל מי שנמצא מתחת לאדם. משמש כדי לא ליצור לולאה בעץ. */
function descendantsOf(id){
  const out = new Set(), walk = p => {
    if(out.has(p)) return;
    out.add(p);
    unionsOf(p).forEach(u => u.children.forEach(walk));
  };
  unionsOf(id).forEach(u => u.children.forEach(walk));
  return out;
}

const coupleLabel = u => u.partners
  .map(p => DB.people[p] ? fullName(DB.people[p]) : '—').join(' ו');

/* אילו זוגיות אפשר לשייך אליהן את האדם הזה */
function reparentOptions(id){
  const below = descendantsOf(id);
  below.add(id);
  const cur = parentUnionOf(id);
  return DB.unions.filter(u =>
    u !== cur && !u.partners.some(p => below.has(p)));
}

function reparentBlocker(id, unionId){
  if(id === DB.root) return 'זה שורש העץ. כדי לשייך אותו להורים, הוסיפו לו הורה';
  if(!unionId) return null;
  const u = DB.unions.find(x => x.id === unionId);
  if(!u) return 'הזוגיות לא נמצאה';
  const below = descendantsOf(id); below.add(id);
  if(u.partners.some(p => below.has(p)))
    return 'אי אפשר לשייך אדם להורים שנמצאים מתחתיו בעץ';
  const y = yearOfDate((DB.people[id] || {}).birth);
  if(y) for(const p of u.partners){
    const py = yearOfDate((DB.people[p] || {}).birth);
    if(py && y - py < 12) return soft('הפרש הגילאים מ' + DB.people[p].name + ' קטן מ-12 שנים');
  }
  return null;
}

function applyReparent(id, unionId){
  const cur = parentUnionOf(id);
  if(cur) cur.children = cur.children.filter(c => c !== id);
  if(unionId){
    const u = DB.unions.find(x => x.id === unionId);
    if(u){ u.children.push(id); expanded.add(u.id); }
  }
  for(const k in SUB) delete SUB[k];
}
