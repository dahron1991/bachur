<style>
/* ============================================================
   1. טוקנים — צבעים, גופנים, מידות
   ============================================================ */
:root{
  --cream:        #F7F2E8;   /* רקע המפה */
  --paper:        #FFFCF6;   /* רקע כרטיס */
  --wood:         #7A5334;   /* חום עץ — אלמנטים ראשיים */
  --wood-soft:    #C4A882;   /* חום בהיר — מסגרות עדינות */
  --forest:       #2E5D45;   /* ירוק יער — ענפים וקווים */
  --forest-soft:  #6E9B84;
  --clay:         #9B3B2E;   /* אדמדם — מחיקה וביטול */
  --ink:          #33281F;   /* טקסט ראשי */
  --ink-soft:     #7A6A5A;   /* טקסט משני */
  --male:         #4E7A93;   /* טורקיז עמום — זכר */
  --female:       #B0708C;   /* ורוד עמום — נקבה */
  --link:         #A89377;   /* עץ-אגוז עמום — קווי החיבור */

  /* שבעה דורות, מהחום העמוק ביותר לירוק */
  --g0:#6B4A2B; --g1:#8A6234; --g2:#9A7C46; --g3:#7E8450;
  --g4:#5C8058; --g5:#43765A; --g6:#2E6B50;

  --r-card: 14px;
  --r-sheet: 22px;
  --shadow-card: 0 2px 0 rgba(122,83,52,.18);
  --shadow-lift: 0 10px 30px rgba(51,40,31,.22);

  --font-ui: 'Assistant', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-name: 'Frank Ruhl Libre', 'David Libre', Georgia, serif;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
[hidden]{display:none !important;}   /* גובר על display של .chip */
html,body{height:100%; margin:0; overflow:hidden;}
body{
  font-family:var(--font-ui);
  background:var(--cream);
  color:var(--ink);
  overscroll-behavior:none;
  -webkit-user-select:none; user-select:none;
}

/* ============================================================
   2. סרגל עליון
   ============================================================ */
/* אין רקע ואין שכבה. רק הכפתורים והטקסט תופסים מקום,
   כך שאפשר לגרור ולצבוט גם בחלק העליון של המסך. */
.topbar{
  position:fixed; inset:0 0 auto 0; z-index:40;
  display:flex; flex-direction:column; align-items:stretch; gap:6px;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  pointer-events:none;
}
/* אין כאן "לכל הילדים". רק הכפתורים והתפריט לוכדים נגיעה,
   וזה מוגדר עליהם ישירות. שורת הכותרת עצמה שקופה למגע. */
.bar-line{pointer-events:none;}
/* חשוב: pointer-events על ההורה לא חוסם ילדים שמגדירים auto בעצמם,
   ולכן הסרגל המוסתר נשאר לחיץ. visibility פותר את זה. */
.topbar.tucked{opacity:0; transform:translateY(-14px); visibility:hidden;}
.topbar.tucked > *{pointer-events:none;}
.topbar{transition:opacity .2s, transform .2s, visibility .2s;}
.bar-line{display:flex; align-items:center; gap:9px; width:100%;}
/* הטקסט לא לוכד נגיעות, כדי שלא יחסום מחוות על העץ */
.brand{
  font-family:var(--font-name); font-weight:700; font-size:18px;
  letter-spacing:-.01em; margin:0; white-space:nowrap;
  color:var(--wood); pointer-events:none;
  text-shadow:0 0 6px var(--cream), 0 0 12px var(--cream);
}
.meta{
  font-size:11.5px; color:var(--ink-soft); flex:1; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  pointer-events:none;
  text-shadow:0 0 6px var(--cream), 0 0 12px var(--cream);
}
/* בלי רקע ובלי מסגרת — רק הסמל עצמו, באותו חום של השם */
.icon-btn{
  flex:none; width:32px; height:32px; border-radius:8px;
  border:none; background:transparent;
  color:var(--wood); font-size:22px; line-height:1; cursor:pointer;
  display:grid; place-items:center; padding:0;
  pointer-events:auto;
  filter:drop-shadow(0 0 5px var(--cream));
}
.icon-btn:active{color:var(--forest);}
.icon-btn.open{color:var(--forest);}
/* כלים של המנהל — למטה, על רקע כהה יותר */
.admin-box{
  width:100%; margin-top:6px; padding:5px;
  background:#F0E6D6; border-radius:11px;
  display:flex; flex-direction:column;
}
.admin-box .chip{border-bottom:1px solid #E3D6C0;}
.admin-box .chip:last-of-type{border-bottom:none;}
.admin-box .chip:active{background:#E3D6C0;}

.more{
  align-self:flex-start;            /* נפתח מתחת להמבורגר, בצד ימין */
  width:min(268px, 100%);
  display:flex; flex-direction:column;
  background:var(--paper); border:1.5px solid #EDE3D3; border-radius:14px;
  padding:6px; box-shadow:0 10px 30px rgba(51,40,31,.18);
  pointer-events:auto;
}
/* חותמת הגרסה: שקטה, אבל תמיד נגישה. התשובה לשאלה "זה כבר
   התעדכן אצלי?" צריכה לקחת שתי שניות, לא מחזור שאלות. */
.more .build{
  margin:8px 4px 2px; font-size:11px; color:var(--wood-soft);
  text-align:center; letter-spacing:.02em;
}
.more .chip{
  width:100%; border:none; background:none; border-radius:9px;
  min-height:0; padding:12px 13px; font-size:14.5px;
  display:flex; align-items:center; justify-content:flex-start; gap:7px;
  border-bottom:1px solid #F4EDE0;
}
.more .chip:last-of-type{border-bottom:none;}
.more .chip:active{background:#F4EFE4;}
.chip .badge{
  background:var(--clay); color:#fff; border-radius:999px;
  font-size:11px; padding:1px 6px; margin-inline-start:2px;
}
.chip{
  border:1.5px solid var(--wood-soft); background:var(--paper);
  color:var(--wood); font-family:var(--font-ui); font-size:13.5px; font-weight:600;
  border-radius:999px; padding:8px 14px; min-height:38px;
  display:inline-flex; align-items:center; gap:6px; cursor:pointer;
}
.chip:active{background:#F0E6D6;}

/* ============================================================
   3. אזור המפה — הזזה ושינוי גודל
   ============================================================ */
#viewport{
  position:fixed; inset:0;
  touch-action:none;              /* חובה: מבטל גלילת דפדפן ומאפשר מחוות משלנו */
  cursor:grab;
  background-image:radial-gradient(rgba(122,83,52,.10) 1px, transparent 1px);
  background-size:26px 26px;
}
#viewport.grabbing{cursor:grabbing;}
#canvas{position:absolute; top:0; left:0; transform-origin:0 0; touch-action:none;}
#links{position:absolute; top:0; left:0; overflow:visible;}
#nodes{position:absolute; top:0; left:0;}
.node, .ring, .act{touch-action:none;}

/* ============================================================
   4. כרטיס אדם
   ============================================================ */
.node{
  position:absolute;
  width:104px; height:132px;
  background:var(--paper);
  border:2px solid var(--g0);
  border-radius:var(--r-card);
  box-shadow:var(--shadow-card);
  /* הכרטיס נשאר 104×132 בדיוק. התמונה תופסת את כל הרוחב במקום
     עיגול ממורכז, ולכן אין כאן ריפוד ואין מרכוז — רצועה, קו, שם. */
  display:flex; flex-direction:column;
  overflow:hidden;
  cursor:pointer;
  transition:box-shadow .16s, transform .16s;
}
.node[data-gen="0"]{border-color:var(--g0);}
.node[data-gen="1"]{border-color:var(--g1);}
.node[data-gen="2"]{border-color:var(--g2);}
.node[data-gen="3"]{border-color:var(--g3);}
.node[data-gen="4"]{border-color:var(--g4);}
.node[data-gen="5"]{border-color:var(--g5);}
.node[data-gen="6"]{border-color:var(--g6);}
.node.is-open{
  box-shadow:0 0 0 3px rgba(46,93,69,.2), var(--shadow-card);
}
.node.pressing{transform:scale(.965);}
.node.pressing::after{
  content:''; position:absolute; inset:-5px; border-radius:19px;
  border:3px solid var(--forest); pointer-events:none;
  animation:hold var(--hold,950ms) linear .25s both;
}
@keyframes hold{from{opacity:0; transform:scale(1.07);} to{opacity:.85; transform:scale(1);}}
@media (prefers-reduced-motion:reduce){ .node.pressing::after{animation:none; opacity:.5;} }

/* מסך "העץ ריק" — הנקודה היחידה שממנה אפשר להתחיל עץ חדש */
#empty{
  position:fixed; inset:0; z-index:12; display:grid; place-items:center;
  padding:28px; pointer-events:none;
}
#empty[hidden]{display:none !important;}
.empty-card{
  background:var(--paper); border:1.5px solid var(--line, #E6DCC8); border-radius:18px;
  padding:26px 24px; max-width:340px; width:100%; text-align:center;
  box-shadow:0 18px 46px rgba(51,40,31,.13); pointer-events:auto;
}
.empty-card h2{font-family:var(--font-name); font-size:21px; margin:0 0 8px; color:var(--ink);}
.empty-card p{font-family:var(--font-ui); font-size:13.5px; line-height:1.6;
  color:var(--ink-soft); margin:0 0 18px;}
.empty-card .btn{width:100%; margin-bottom:8px;}

/* חיווי שמירה בסרגל */
.sync{
  width:9px; height:9px; border-radius:50%; flex:none; margin-inline-start:7px;
  background:var(--forest); transition:background .2s, opacity .2s; opacity:.55;
}
.sync.saving{background:var(--wood); opacity:1; animation:syncPulse .9s ease-in-out infinite;}
.sync.error{background:var(--clay); opacity:1; width:11px; height:11px;}
@keyframes syncPulse{0%,100%{opacity:.35} 50%{opacity:1}}

/* הודעה על עדכון של מנהל אחר. מודיעה בלבד — אינה משנה את המסך */
.remote-note{
  font:inherit; font-size:11.5px; line-height:1; cursor:pointer;
  margin-inline-start:8px; padding:5px 9px; border-radius:999px;
  border:1px solid var(--wood); background:transparent; color:var(--wood);
  white-space:nowrap; flex:none;
}
.remote-note[hidden]{display:none;}

/* ---------- מסך חיתוך התמונה ---------- */
#cropper{
  /* רקע אטום לגמרי: בשקיפות חלקית הטופס שמאחור בצבץ
     והתנגש בכותרת. חיתוך תמונה הוא משימה ממוקדת. */
  position:fixed; inset:0; z-index:95; background:#1F1812;
  display:none; flex-direction:column; align-items:center; justify-content:center;
  gap:18px; padding:24px 20px calc(env(safe-area-inset-bottom) + 24px);
  touch-action:none; user-select:none;
}
#cropper.show{display:flex;}
#cropper h3{
  font-family:var(--font-ui); font-size:15px; font-weight:700;
  color:#F3EADA; margin:0; text-align:center;
}
#cropper h3 span{display:block; font-size:12.5px; font-weight:400; color:#B9AC98; margin-top:5px;}
/* המסגרת היא מה שנשמר — 5:3. שלוש הצורות חולקות גובה אחד:
   העיגול הוא הריבוע שבמרכז, הכרטיס שבעץ רחב ממנו מעט, והמסגרת
   כולה היא כרטיס האדם. די בכלל אחד למי שמעלה: הפנים בעיגול. */
.crop-frame{
  position:relative; overflow:hidden; flex:none;
  border-radius:6px; background:#1C1611;
  box-shadow:0 0 0 2px rgba(243,234,218,.55);
  touch-action:none; cursor:grab;
}
.crop-guide{position:absolute; inset:0; pointer-events:none;}
.crop-guide span{position:absolute; display:block;}
/* ההצללה רכה ונמוגה פנימה. שני מלבנים כהים בקו חד נראו רע. */
.crop-guide .g-dim{top:0; bottom:0;}
.crop-guide .g-dim.l{left:0;
  background:linear-gradient(to right, rgba(20,15,11,.42), rgba(20,15,11,.12) 50%, rgba(20,15,11,0));}
.crop-guide .g-dim.r{right:0;
  background:linear-gradient(to left, rgba(20,15,11,.42), rgba(20,15,11,.12) 50%, rgba(20,15,11,0));}
.crop-guide .g-card{top:0; bottom:0;
  border-left:1.5px dashed rgba(255,252,246,.8); border-right:1.5px dashed rgba(255,252,246,.8);}
/* סימון הראש. קודם היה כאן עיגול בגובה המסגרת כולה, עם ההנחיה
   "שהפנים יהיו בתוך העיגול" — ומי שציית הגדיל את הפנים עד שמילאו
   את כל הגובה, כלומר שמר תמונה שהראש נוגע בקצה שלה. הסימון הוא
   עכשיו בגודל ראש ממש, ויושב מעט מעל המרכז, כך שציות להנחיה
   נותן פורטרט עם מרווח מעל הראש. */
.crop-guide .g-circle{border-radius:50%; border:2px solid rgba(255,252,246,.95);
  box-sizing:border-box;}
.crop-legend{
  display:flex; gap:14px; flex-wrap:wrap; justify-content:center;
  margin:0; font-size:11.5px; color:#B9AC98; max-width:min(84vw,360px); text-align:center;
}
.crop-legend i{display:inline-block; width:16px; vertical-align:middle; margin-inline-end:5px;}
.crop-frame.dragging{cursor:grabbing;}
.crop-frame img{
  position:absolute; top:0; left:0; transform-origin:0 0;
  max-width:none; max-height:none; pointer-events:none; -webkit-user-drag:none;
}
.crop-zoom{width:min(84vw,340px); display:flex; align-items:center; gap:12px;}
.crop-zoom input{flex:1; accent-color:#C8A86B; height:30px;}
.crop-zoom b{color:#B9AC98; font-size:16px; font-weight:700; width:16px; text-align:center;}
.crop-acts{display:flex; gap:10px; width:min(84vw,340px);}
.crop-acts button{
  flex:1; border-radius:12px; padding:13px 0; cursor:pointer;
  font-family:var(--font-ui); font-size:15.5px; font-weight:700; border:1.5px solid transparent;
}
#cropOk{background:var(--forest); color:#fff;}
#cropNo{background:transparent; color:#E4D8C4; border-color:#6B5B49;}
#cropOk[disabled]{opacity:.6; cursor:default;}

/* תמונה בתוך עיגול: בלי stretch, הדפדפן לא מצליח לפתור את
   height:100% בתוך grid עם שורה אוטומטית, ונופל ליחס הטבעי של
   התמונה. תמונה לאורך הייתה אז גולשת מהעיגול ודורסת את השם.
   הכלל הזה תופס כל עיגול תמונה באפליקציה. */
.dot img, .photo-pick .prev img, .big-avatar img{
  align-self:stretch; justify-self:stretch;
  width:100%; height:100%; min-width:0; min-height:0;
  object-fit:cover; display:block;
}
.dot, .big-avatar{overflow:hidden;}

/* רצועת התמונה: כל רוחב הכרטיס, 86 מתוך 128 הפנימיים.
   מה שנשאר — 39 — הוא שתי שורות שם בדיוק. */
.node .face{
  height:86px; flex:none; position:relative; overflow:hidden;
  display:grid; place-items:center;
  font-family:var(--font-name); font-weight:700; font-size:40px; color:#fff;
  background:var(--wood-soft);
}
.node .face img{width:100%; height:100%; object-fit:cover; display:block;}
.node .face span{color:#fff;}
.node[data-gender="male"]   .face{background:var(--male);}
.node[data-gender="female"] .face{background:var(--female);}
/* המגדר נקרא מקו דק בין התמונה לשם. בלי התמונה בעיגול, זה
   הסימון היחיד שנשאר — ולכן הוא לא יכול להיות דק מזה. */
.node .sexline{height:3px; flex:none; background:var(--wood-soft);}
.node[data-gender="male"]   .sexline{background:var(--male);}
.node[data-gender="female"] .sexline{background:var(--female);}
.node .name{
  flex:1; min-height:0; padding:0 5px;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-name); font-weight:700; font-size:15px;
  line-height:1.15; text-align:center; color:var(--ink);
}
.node .name span{
  /* שם ארוך במיוחד — שם משפחה כפול, או הדבקה בטעות — גלש אל מחוץ
     לכרטיס וכיסה את השכנים. כאן הוא נשבר בתוך המילה אם צריך,
     ונחתך אחרי שתי שורות. */
  overflow-wrap:anywhere; word-break:break-word;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; max-width:100%;
}


/* מרחף — מי שאינו מחובר לעץ. מוצג מעל העץ ברווח גדול. */
.node[data-float]{border-color:var(--clay); border-style:dashed;}
.node .floatmark{
  position:absolute; top:6px; inset-inline-end:7px;
  width:18px; height:18px; border-radius:50%;
  background:var(--clay); color:#fff;
  font-size:12px; font-weight:700; display:grid; place-items:center;
}

/* ממלא מקום — רשומה שנוצרה כשאדם נמחק, כדי לשמור על הענף */
.node[data-ph]{border-color:var(--wood-soft); background:#F6F1E7;}
.node[data-ph] .face{background:var(--wood-soft) !important;}
.node[data-ph] .sexline{background:var(--wood-soft) !important;}
.node[data-ph] .name{color:var(--ink-soft); font-style:italic;}

/* כרטיס כפיל — אותו אדם שמוצג גם בענף אחר.
   הכרטיס עצמו רגיל לגמרי; רק סימן קטן בפינה. */
.node .mirror{
  position:absolute; top:5px; inset-inline-start:6px;
  font-size:12px; line-height:1; color:var(--wood-soft);
  pointer-events:none;
}

/* כפתור פתיחה/סגירה של ענף */
.toggle{
  position:absolute; width:26px; height:26px; border-radius:50%;
  border:2px solid var(--wood); background:var(--cream); color:var(--wood);
  font-family:var(--font-ui); font-size:12px; font-weight:700; line-height:1;
  display:grid; place-items:center; cursor:pointer; padding:0;
  touch-action:none; z-index:15;
}
.toggle:active{background:var(--wood); color:var(--cream);}
.toggle.open{font-size:14px;}



/* ===== מסך כניסה ===== */
#login{
  position:fixed; inset:0; z-index:90; background:var(--cream);
  display:grid; place-items:center; padding:24px;
  transition:opacity .3s;
}
#login.hide{opacity:0; pointer-events:none;}
.login-card{width:100%; max-width:340px; text-align:center;}
/* ברירת המחדל, כשאין ללוגו תמונה: עיגול עם האות הראשונה של שם
   המשפחה. זה מה שרואה משפחה שעוד לא העלתה לוגו משלה. */
.login-mark{
  width:88px; height:88px; margin:0 auto 18px; border-radius:50%;
  background:var(--wood); color:var(--cream); overflow:hidden;
  display:grid; place-items:center;
  font-family:var(--font-name); font-weight:700; font-size:36px;
}
/* וכשיש תמונה: היא תופסת את מלוא רוחב הכרטיס, בלי עיגול ובלי
   רקע משלה. הגובה נגזר מהיחס של התמונה עצמה, ולכן היא לעולם
   אינה נחתכת — object-fit:contain ולא cover. */
.login-mark.has-logo{
  width:100%; height:auto; border-radius:0;
  background:none; margin:0 auto 20px; display:block;
}
.login-mark img{width:100%; height:100%; object-fit:cover;}
.login-mark.has-logo img{width:100%; height:auto; object-fit:contain; display:block;}
.login-card h1{font-family:var(--font-name); font-size:25px; margin:0 0 6px;}
.login-card h1[hidden]{display:none;}
.login-card p{font-size:14px; color:var(--ink-soft); margin:0 0 20px;}
#loginPass{
  width:100%; font-family:var(--font-ui); font-size:17px; text-align:center;
  background:var(--paper); border:1.5px solid #E3D6C0; border-radius:12px;
  padding:14px; margin-bottom:12px; -webkit-appearance:none;
}
#loginPass:focus{outline:none; border-color:var(--forest);}
#login .btn{width:100%;}
.login-note{
  font-size:11.5px; line-height:1.6; color:var(--ink-soft);
  margin-top:20px; padding:11px 13px; background:#F4EFE4;
  border-radius:10px; border-inline-start:3px solid var(--wood-soft); text-align:start;
}


/* ===== השוואת שינויים בבקשת עריכה ===== */
.diff{border-bottom:1px solid #F2EADC; padding:12px 0;}
.diff .dk{font-size:12.5px; color:var(--ink-soft); margin-bottom:5px;}
.diff .dv{font-size:15px; padding:7px 10px; border-radius:8px; margin-bottom:5px;}
.diff .old{background:#F4EFE4; color:var(--ink-soft); text-decoration:line-through;
  position:relative; padding-inline-start:74px;}
/* תווית על השורה עצמה. ההסבר היה רק בתחתית המסך, אחרי כל השדות,
   וקודם לכן לא היה ברור איזה ערך הוא הקיים ואיזה המוצע. */
.diff .old::before{
  content:'בעץ כרגע'; position:absolute; inset-inline-start:10px; top:50%;
  transform:translateY(-50%); font-size:10.5px; text-decoration:none;
  color:var(--wood); opacity:.85; white-space:nowrap;
}
.diff .new{background:#E8F0EA; color:var(--ink); font-weight:700;}
.diff .old.empty, .diff .new.empty{font-style:italic; text-decoration:none; opacity:.7;}
.diff .ok{
  border:1.5px solid #E3D6C0; background:var(--cream); color:var(--ink-soft);
  border-radius:999px; padding:5px 13px; font-family:var(--font-ui);
  font-size:12.5px; font-weight:700; cursor:pointer;
}
.diff .ok.on{border-color:var(--forest); background:#E8F0EA; color:var(--forest);}
.opts{display:flex; flex-direction:column; gap:6px; margin-bottom:5px;}
.opt{
  text-align:start; border:1.5px solid #E3D6C0; background:var(--cream);
  border-radius:9px; padding:9px 11px; font-family:var(--font-ui);
  font-size:14.5px; color:var(--ink); cursor:pointer;
}
.opt.on{border-color:var(--forest); background:#E8F0EA; font-weight:700;}
.opt .tag{
  display:block; font-size:11px; font-weight:700; color:var(--ink-soft); margin-bottom:2px;
}
.opt.on .tag{color:var(--forest);}
.diff .ok[disabled]{opacity:.5; cursor:default;}
.sugg{border:1.5px solid #EDE3D3; border-radius:12px; overflow:hidden; margin-top:-6px;}
.sugg .prow{border-bottom:1px solid #F2EADC; padding:10px 12px;}
.sugg .prow:last-child{border-bottom:none;}
.mode-on{background:var(--forest) !important; color:#fff !important; border-color:var(--forest) !important;}

/* בזמן אישור כפול אי אפשר לשנות שום דבר מאחור */
.confirming .diff, .confirming .field, .confirming .prow,
.confirming .admin-row, .confirming .sugg, .confirming h2{
  pointer-events:none; opacity:.5;
}


/* ===== כותרת טופס, פרטי קשר, תאריך גמיש ===== */
.form-head{
  text-align:center; padding:2px 0 16px; border-bottom:1.5px solid #EDE3D3; margin-bottom:16px;
}
.form-head b{display:block; font-family:var(--font-name); font-size:22px; font-weight:700;}
.form-head span{display:block; font-size:13px; color:var(--ink-soft); margin-top:3px;}
.contact-sep{
  display:flex; align-items:center; gap:9px; margin:22px 0 14px;
  color:var(--ink-soft); font-size:12px; font-weight:700;
}
.contact-sep::before, .contact-sep::after{content:''; flex:1; height:1px; background:#EDE3D3;}
.field[data-opt] input{background:#FBF7EF;}
.hint{display:block; font-size:11.5px; color:var(--ink-soft); margin-top:5px;}
.by-line{
  font-size:12.5px; color:var(--ink-soft); text-align:center;
  margin:-10px 0 16px; padding-bottom:12px; border-bottom:1px solid #F2EADC;
}
.contact-mini{
  display:flex; gap:18px; flex-wrap:wrap; margin-top:22px;
  font-size:12.5px; color:var(--ink-soft);
}
.contact-mini span{min-width:0; overflow:hidden;}
.contact-mini b{
  /* 10.5 פיקסל היה קטן מדי לקריאה בטלפון */
  display:block; font-size:12px; font-weight:700; opacity:.9;
  -webkit-user-select:none; user-select:none;   /* התווית נעולה */
}
.contact-mini i{
  display:block; font-style:normal; overflow:hidden; text-overflow:ellipsis;
  -webkit-user-select:text; user-select:text;   /* רק התוכן ניתן להעתקה */
}
.notes-list.sheet{margin-top:20px; max-height:none;}
.field textarea{
  width:100%; font-family:var(--font-ui); font-size:15px; color:var(--ink);
  background:#FBF7EF; border:1.5px solid #E3D6C0; border-radius:11px;
  padding:11px 13px; resize:vertical; line-height:1.6;
}
.field textarea:focus{outline:none; border-color:var(--forest);}
.contact-head{
  margin-top:16px; font-size:11.5px; font-weight:700; color:var(--ink-soft);
  border-top:1.5px solid #EDE3D3; padding-top:12px;
}


/* ===== פרטים נוספים, שורה כפולה, ופתקים ===== */
.extra-gap{height:26px;}
/* "עוד פרטים": קיפול שכתוב מתחתיו מה יש בפנים. קיפול בלי רשימה
   נראה כאילו הוסתר משהו. */
.fold{
  width:100%; margin:4px 0 14px; background:none; cursor:pointer;
  border:none; border-top:1px solid #EDE2D0; border-bottom:1px solid #EDE2D0;
  padding:13px 0; font-family:var(--font-ui); text-align:start;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.fold .t{display:block; font-size:14.5px; font-weight:700; color:var(--ink);}
.fold .s{display:block; font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
.fold svg{flex:none; transition:transform .2s;}
.fold[aria-expanded="true"]{border-bottom:none; margin-bottom:0;}
.fold[aria-expanded="true"] svg{transform:rotate(180deg);}
/* [hidden] לבדו אינו מנצח display:grid, ולכן הכלל המפורש */
.fold-body[hidden]{display:none;}
.fold-body{
  background:#FDF9F0; border-bottom:1px solid #EDE2D0;
  margin:0 -6px 14px; padding:14px 6px 2px;
}
/* רשת של שתי עמודות. הכול תופס רוחב מלא חוץ מהשדות המסומנים
   כחצאים, ושני חצאים רצופים יושבים זה לצד זה.
   קודם זה היה flex בעמודה, ולכן inline-block על החצאים לא השפיע
   כלל: הם נערמו זה מעל זה, כל אחד בחצי רוחב. */
.form-fields, .fold-body{display:grid; grid-template-columns:1fr 1fr; column-gap:10px;}
.form-fields > *, .fold-body > *{grid-column:1 / -1; min-width:0;}
.field.half, .field.col{grid-column:auto;}
.field.half label{font-size:11.5px;}
.field.half input{font-size:14px; padding:10px 11px;}
.notes-wrap{margin-top:4px;}
.notes-list{
  max-height:340px; overflow-y:auto; display:flex; flex-direction:column; gap:10px;
  margin-bottom:14px; padding-inline-end:2px;
}
.note-card{
  border:1.5px solid #E3D3A0; border-radius:12px;
  background:#FCF6DC; overflow:hidden;      /* צהוב של פנקס שורות */
  /* מהמסגרת העליונה לקו הראשון: 16 + 17 = 33.
     מהקו האחרון למסגרת התחתונה: 9 + 1 + שורת השם + 10 = 33. */
  padding-top:16px;
}
.note-card .note-body{
  padding:0 14px;
  font-family:var(--font-name);
  font-size:15px; line-height:26px; color:#3A3020; white-space:pre-wrap;
  /* קישור שהודבק לסיפור הוא רצף ארוך בלי רווחים, והוא גלש אל מחוץ
     לפתק. כאן הוא נשבר גם באמצע מילה. */
  overflow-wrap:anywhere; word-break:break-word;
  /* הקווים נמתחים מקצה לקצה. ההזזה של 8 פיקסלים מיישרת את הקו
     בדיוק לבסיס האותיות, כך שהטקסט יושב עליו ואותיות סופיות חוצות אותו. */
  background-image:repeating-linear-gradient(#FCF6DC 0 25px, #DFCB92 25px 26px);
  background-position:0 -8px;
}
.note-card .note-by{
  /* אחרי הקו האחרון נשארים 9 פיקסלים בגוף, ועוד 1 כאן — סה"כ 10,
     בדיוק כמו הרווח שמעל השורה הראשונה */
  /* הוגדל והוכהה: ב-10.5 פיקסל ובצבע הקודם הניגודיות הייתה 3.87,
     מתחת לסף הקריאוּת — ומי שחתום על הסיפור הוא בדיוק מי שרוצים
     לזהות. */
  text-align:center; font-size:12px; color:#6E5F3C; padding:1px 0 10px;
}


/* עורך פתקים */
.note-card.edit{position:relative; padding-top:14px;}
.note-card.edit textarea{
  width:100%; border:none; background:transparent; resize:vertical;
  font-family:var(--font-name); font-size:15px; line-height:24px;
  color:#3A3020; padding:0 38px 6px 14px; display:block; outline:none;
}
.note-x{
  position:absolute; top:8px; inset-inline-start:10px;
  width:26px; height:26px; border-radius:50%;
  border:1.5px solid #E3D3A0; background:#FCF6DC; color:var(--clay);
  font-size:16px; line-height:1; cursor:pointer; padding:0;
}
.note-x:active{background:var(--clay); color:#fff;}
.note-confirm{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:12px 14px; font-size:13px; font-weight:700; color:#3A3020;
}
.note-confirm span{flex:1; min-width:120px;}
.note-confirm button{
  border:1.5px solid #E3D3A0; background:#FCF6DC; color:#3A3020;
  border-radius:9px; padding:6px 16px; font-family:var(--font-ui);
  font-size:13px; font-weight:700; cursor:pointer;
}
.note-confirm .yes{border-color:var(--clay); color:var(--clay);}

/* ===== בוחר תמונה ===== */
/* התמונה ביחס שבו היא נשמרת (5:3), ולא עיגול קטן: מי שמעלה
   רואה מראש את מה שיתקבל. */
.photo-wide .prev{
  display:grid; place-items:center; width:100%; aspect-ratio:5 / 3;
  border:2px dashed var(--wood-soft); border-radius:14px;
  background:var(--cream); color:var(--wood); overflow:hidden;
  padding:0; cursor:pointer; font-family:var(--font-ui);
}
.photo-wide .prev b{display:block; font-size:16px; font-weight:700; color:var(--wood);}
.photo-wide .prev svg{display:block; margin:0 auto 10px; color:var(--wood-soft);}
.photo-wide .prev img{width:100%; height:100%; object-fit:cover; display:block;}
.photo-wide .prev:has(img){border-style:solid; border-color:transparent;}
.photo-wide .acts{display:flex; gap:10px; margin-top:10px;}
.photo-wide button:not(.prev){
  flex:1; border:1.5px solid #E3D6C0; background:var(--cream); color:var(--wood);
  border-radius:10px; padding:11px 14px; font-family:var(--font-ui);
  font-size:13.5px; font-weight:700; cursor:pointer;
}
.photo-wide button.cut{color:var(--clay);}
.photo-wide button[hidden]{display:none;}
.photo-hint{text-align:center; margin-top:10px;}
.admin-row{display:flex; gap:10px; margin-top:18px;}
.admin-row .btn{min-height:44px; font-size:14px;}

/* ===== לוח כללי (ימי הולדת, טופס, בקשות, חיפוש) ===== */
#panel{
  position:fixed; z-index:55; inset:auto 0 0 0;
  height:88vh; background:var(--paper);
  border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  box-shadow:0 -8px 34px rgba(51,40,31,.3);
  transform:translateY(101%);
  transition:transform .24s cubic-bezier(.32,.72,0,1);
  display:flex; flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
}
#panel.show{transform:translateY(0);}
.panel-head{
  display:flex; align-items:center; gap:10px;
  padding:16px 20px 12px; border-bottom:1.5px solid #EDE3D3;
}
.panel-head h3{margin:0; font-family:var(--font-name); font-size:20px; font-weight:700; flex:1;}
.panel-x{
  border:none; background:#F0E6D6; color:var(--wood);
  width:34px; height:34px; border-radius:50%; font-size:19px; cursor:pointer;
}
.panel-body{flex:1; overflow-y:auto; padding:16px 20px 88px; -webkit-overflow-scrolling:touch;}

/* מתג לועזי / עברי */
.seg{display:flex; background:#F0E6D6; border-radius:11px; padding:3px; margin-bottom:16px;}
.seg button{
  flex:1; border:none; background:transparent; cursor:pointer;
  font-family:var(--font-ui); font-size:14px; font-weight:700; color:var(--ink-soft);
  padding:9px 0; border-radius:9px;
}
.seg button.on{background:var(--paper); color:var(--wood); box-shadow:0 1px 3px rgba(51,40,31,.12);}

/* שורת אדם ברשימה */
.prow{
  display:flex; align-items:center; gap:12px; width:100%;
  padding:11px 4px; border-bottom:1px solid #F2EADC;
  background:none; border-inline:none; border-top:none; cursor:pointer; text-align:start;
  font-family:var(--font-ui);
}
.prow .dot{
  width:42px; height:42px; border-radius:50%; flex:none;
  display:grid; place-items:center; color:#fff;
  font-family:var(--font-name); font-weight:700; font-size:17px;
}
/* מגדר: היום הצבע נמצא רק ברקע העיגול, ולכן מי שיש לו תמונה —
   אין לו סימון כלל. הטבעת גלויה בשני המקרים. */
.prow .dot.gring{outline:2px solid currentColor; outline-offset:2px;}
/* מסך "לא נמצא" הוא ההזדמנות הטבעית להוסיף */
.search-add{margin-top:4px; padding-top:18px; border-top:1px dashed #E6DBC8;}
.search-add p{margin:0 0 12px; font-size:13px; font-weight:700; color:var(--ink-soft);}
.search-add .btn{width:100%;}
/* ימי הולדת: הפרדה בין החודש הקרוב לשאר השנה */
.bday-h{
  margin:18px 2px 7px; font-size:12px; font-weight:700;
  letter-spacing:.04em; color:var(--ink-soft);
}
.bday-h:first-child{margin-top:2px;}
.bday-scope{margin:9px 2px 0; font-size:12px; color:var(--ink-soft);}
mark{
  background:rgba(46,93,69,.14); color:var(--forest);
  border-radius:3px; padding:0 1px; font-weight:700;
}
.prow .who{flex:1; min-width:0;}
.prow .who b{display:block; font-size:15px; font-weight:700; color:var(--ink);}
.prow .who span{font-size:12.5px; color:var(--ink-soft);}
.prow .who .meta{display:block; font-size:11.5px; color:var(--wood-soft); margin-top:2px;}
.prow .cnt{
  /* ברירת המחדל שקטה. מה שרחוק אינו צריך צבע — הוא רק נתון. */
  flex:none; font-size:12px; font-weight:700; color:var(--ink-soft);
  background:#F2EADC; border-radius:999px; padding:5px 10px; white-space:nowrap;
}
/* ירוק ולא כתום: כתום נקרא כאזהרה, ויום הולדת אינו אזהרה.
   מוחל רק מעשרה ימים ומטה. */
.prow .cnt.soon{background:#E8F0EA; color:var(--forest);}
.prow .cnt.edit{background:#F0E6D6; color:var(--wood);}
.prow .cnt b{display:block; font-weight:400; font-size:10.5px; opacity:.85; margin-top:2px;}
.prow .cnt.new {background:#E8F0EA; color:var(--forest);}
.prow .cnt.story{background:#FCF6DC; color:#8A7A55;}
.prow .cnt.today{background:var(--forest); color:#fff;}

/* טופס */
.field{margin-bottom:14px;}
.field label{display:block; font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:6px;}
.field input, .field select{
  width:100%; font-family:var(--font-ui); font-size:16px; color:var(--ink);
  background:var(--cream); border:1.5px solid #E3D6C0; border-radius:11px;
  padding:12px 13px; -webkit-appearance:none;
}
.field input:focus{outline:none; border-color:var(--forest);}
/* סימון השדה שגרם לשגיאה, אחרי שגוללנו אליו */
.field.bad input, .field.bad textarea, .field.bad .datetext{
  border-color:var(--clay); background:#FBF0ED;
}
.field.bad label{color:var(--clay);}

/* שדה התאריך — חייב לבוא אחרי הכללים הכלליים של השדות */
.datewrap{display:flex; gap:8px; align-items:center;}
.datetext{flex:1; min-width:0;}
.datebtn{
  position:relative; flex:0 0 42px; height:48px;
  display:flex; align-items:center; justify-content:center;
  background:transparent; border:none; padding:0;
  color:var(--wood); cursor:pointer;
}
.datebtn svg{display:block;}
.datebtn:active{color:var(--forest);}
/* חייב לבוא אחרי הכלל הכללי של .field input, אחרת הוא נדרס */
.field .datebtn input, .datebtn input{
  position:absolute; inset:0; width:100%; height:100%;
  opacity:0; border:none; padding:0; margin:0; cursor:pointer;
  -webkit-appearance:none; background:transparent;
}
.field .datebtn{
  position:relative; flex:0 0 42px; height:48px;
  display:flex; align-items:center; justify-content:center;
  background:transparent; border:none; padding:0; margin:0;
}
.req{color:var(--clay);}
.pick{display:flex; gap:8px;}
.pick button{
  flex:1; border:1.5px solid #E3D6C0; background:var(--cream); color:var(--ink-soft);
  border-radius:11px; padding:12px 0; font-family:var(--font-ui); font-size:15px; font-weight:700; cursor:pointer;
}
.pick button.on{border-color:var(--forest); background:#E8F0EA; color:var(--forest);}
.pick button.cut{color:var(--clay);}
/* בורר אחד במקום שני כפתורים נפרדים: גם מראה מה נבחר, וגם תופס
   פחות. חל רק על המגדר — שאר הבוררים נשארים כפי שהם. */
.pick.two{background:#F0E6D6; border-radius:12px; padding:4px; gap:5px;}
.pick.two button{
  border:none; background:none; border-radius:9px; padding:11px 0;
  color:var(--ink-soft); font-weight:400;
}
.pick.two button.on{
  background:var(--paper); color:var(--ink); font-weight:700;
  box-shadow:0 1px 2px rgba(122,83,52,.14);
}
.pick button.cut.on{border-color:var(--clay); background:#FBF2EF; color:var(--clay);}
.ustat{flex-wrap:wrap;}
.ustat button{flex:1 1 40%;}
.anchor-btn[disabled]{opacity:.55; cursor:default;}
.anchor-btn{
  width:100%; text-align:start; background:var(--cream);
  border:1.5px dashed var(--wood-soft); border-radius:11px;
  padding:12px 13px; font-family:var(--font-ui); font-size:15px; color:var(--ink); cursor:pointer;
  margin-bottom:14px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.anchor-btn .swap{flex:none; font-size:13px; font-weight:700; color:var(--forest);}
.form-actions{display:flex; gap:10px; padding-top:6px;}
/* דוח הייבוא */
.imp-report{margin:2px 0 10px;}
.imp-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:9px 12px; margin-bottom:6px; border-radius:10px;
  background:var(--cream); border:1.5px solid #EDE2CE;
  font-family:var(--font-ui); font-size:14.5px; color:var(--ink);
}
.imp-row b{font-size:17px; font-weight:800; color:var(--wood);}
.imp-row b.good{color:var(--forest);}
.imp-row b.bad{color:var(--clay);}
.imp-row b.mute{color:var(--ink-soft);}
.imp-note{
  font-family:var(--font-ui); font-size:12.5px; line-height:1.55;
  color:var(--ink-soft); margin:2px 2px 12px;
}
.imp-note.bad{color:var(--clay); font-weight:600;}
.err{color:var(--clay); font-size:13px; font-weight:700; margin:6px 0 12px;}
.empty{text-align:center; color:var(--ink-soft); font-size:14px; padding:34px 10px;}

/* תצוגה מוגדלת של התמונה */
#lightbox{
  position:fixed; inset:0; z-index:70; display:grid; place-items:center;
  background:rgba(51,40,31,.74);
  opacity:0; pointer-events:none; transition:opacity .2s;
}
#lightbox.show{opacity:1; pointer-events:auto;}
.big-avatar{
  width:min(72vw,320px); aspect-ratio:1; border-radius:50%;
  display:grid; place-items:center;
  font-family:var(--font-name); font-weight:700;
  font-size:min(30vw,132px); color:#fff;
  transform:scale(.88); transition:transform .22s cubic-bezier(.34,1.3,.64,1);
}
#lightbox.show .big-avatar{transform:scale(1);}
.big-avatar img{width:100%; height:100%; border-radius:50%; object-fit:cover;}

/* ============================================================
   5. טבעת הפעולות — נפתחת בלחיצה ארוכה
   ============================================================ */
.ring{
  position:absolute; width:104px; height:132px;
  pointer-events:none; z-index:20;
}
.ring.show{pointer-events:auto;}
.act{
  position:absolute; width:34px; height:34px; border-radius:50%;
  border:none; background:var(--forest); color:#fff;
  display:grid; place-items:center; font-size:19px; font-weight:600; line-height:1;
  box-shadow:var(--shadow-lift); cursor:pointer;
  opacity:0; transform:scale(.4); pointer-events:none;
  transition:opacity .17s ease, transform .17s cubic-bezier(.34,1.4,.64,1);
}
.ring.show .act{opacity:1; transform:scale(1); pointer-events:auto;}
.ring.show .act:nth-child(2){transition-delay:.03s;}
.ring.show .act:nth-child(3){transition-delay:.06s;}
.ring.show .act:nth-child(4){transition-delay:.09s;}
.act:active{background:#22452F;}
.act .lbl{
  position:absolute; top:100%; left:50%; transform:translateX(-50%); margin-top:3px;
  font-family:var(--font-ui); font-size:9.5px; font-weight:700;
  color:var(--forest); background:var(--cream);
  padding:1px 5px; border-radius:999px; white-space:nowrap;
}
.act-top    {top:-46px;   left:50%; margin-left:-17px;}
.act-bottom {bottom:-46px;left:50%; margin-left:-17px;}
.act-start  {top:49px;   inset-inline-start:-44px;}
.act-end    {top:49px;   inset-inline-end:-44px;}
.ring.show .act-top{transform:translateY(0) scale(1);}
@media (prefers-reduced-motion:reduce){
  .act{transition:opacity .01s;}
}


/* ============================================================
   7. חלון תחתון (Bottom Sheet)
   ============================================================ */
#scrim{
  position:fixed; inset:0; z-index:45;
  background:rgba(51,40,31,.28);
  opacity:0; pointer-events:none; transition:opacity .18s;
}
#scrim.show{opacity:1;}
#scrim.blocking{pointer-events:auto;}

#sheet{
  position:fixed; z-index:50; inset:auto 0 0 0;
  height:70vh; max-height:70vh;
  background:var(--paper);
  border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  box-shadow:0 -8px 34px rgba(51,40,31,.3);
  transform:translateY(101%);
  transition:transform .2s cubic-bezier(.32,.72,0,1);
  display:flex; flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
}
#sheet.show{transform:translateY(0);}
#sheet.dragging{transition:none;}

.grab{padding:10px 0 4px; display:grid; place-items:center; touch-action:none; cursor:grab;}
.grab i{display:block; width:44px; height:5px; border-radius:3px; background:var(--wood-soft);}

/* ההודעה הצפה יושבת 26 פיקסלים מהתחתית ומסתירה את השורה שמתחתיה.
   היא חולפת, אבל בזמן שהיא שם המידע נעלם — ולכן נשמר לה מקום
   בסוף הגלילה. */
.sheet-body{overflow-y:auto; padding:6px 20px 84px; -webkit-overflow-scrolling:touch;}

.sheet-top{display:flex; justify-content:space-between; align-items:center; padding:2px 0 8px;}
.hero{
  display:flex; flex-direction:column; align-items:center;
  text-align:center; gap:14px; padding-bottom:18px;
}
.hero h2{font-family:var(--font-name); font-size:24px; font-weight:700; margin:0 0 4px;
  overflow-wrap:anywhere; word-break:break-word;}
.hero .sub{font-size:13.5px; color:var(--ink-soft); line-height:1.5;}
.hero-text{width:100%;}
.stats-tg{
  display:flex; align-items:center; justify-content:center; gap:5px;
  margin:14px auto 0; padding:13px 0; font:inherit; font-size:14px;
  width:100%; border:none; border-top:1px solid #EDE2D0; border-bottom:1px solid #EDE2D0;
  background:none; color:var(--ink-soft); cursor:pointer;
}
.stats-tg svg{display:block; transition:transform .2s; flex:none;}
.stats-tg.open svg{transform:rotate(180deg);}
.stats-tg:active{color:var(--wood);}
.stats-line{
  margin:8px 0 0; font-size:12.5px; line-height:2;
  color:var(--ink-soft); text-align:center;
}
.stats-line b{color:var(--ink); font-weight:700;}
.stats-sep{color:var(--wood-soft); margin:0 5px;}

.facts{
  border-top:1.5px solid #EDE3D3;
  display:grid; grid-template-columns:auto 1fr; gap:0;
}
.facts dt{
  padding:13px 0 13px; font-size:13.5px; color:var(--ink-soft);
  border-bottom:1px solid #F2EADC; min-width:96px;
}
.facts dd{
  margin:0; padding:13px 0; font-size:15px; font-weight:600;
  border-bottom:1px solid #F2EADC; text-align:start;
  font-variant-numeric:tabular-nums;
}
.facts dd.muted{font-weight:400; color:var(--ink-soft);}

/* ===== כותרת הכרטיס: רצועת תמונה ברוחב מלא =====
   הרצועה שוברת את ריפוד הגוף (6/20/20) במכוון, ולכן השוליים
   השליליים. היחס הוא 5:3 — בדיוק מה שהקרופר שומר. */
.hero-wide{
  position:relative; margin:-6px -20px 0;
  /* הרוחב חייב להיאמר במפורש, וחייב לכלול את שני הריפודים.
     width:100% לבדו היה טעות: הוא נתן לרצועה את רוחב התוכן
     (בלי 2×20), השוליים השליליים רק הזיזו אותה הצידה, ונפער
     רווח בן 40 פיקסל בצד אחד. בלי רוחב מפורש בכלל, min-height
     גבר על היחס — הדפדפן קבע גובה 200, הכפיל ב-5/3 וקיבל רוחב
     333 שגלש ממסך של 320. calc פותר את שניהם. */
  width:calc(100% + 40px); box-sizing:border-box;
  aspect-ratio:5 / 3; min-height:200px;
  /* רקע כהה ולא בהיר: הטקסט הלבן יושב עליו, ושכבת ההחשכה שמעל
     התמונה היא rgba — כלומר אם התמונה בהירה והרקע בהיר, אין שום
     ערובה לקריאוּת. מכאן הבסיס כהה בעצמו. */
  background:#2A2119; overflow:hidden;
  display:flex; align-items:flex-end;
}
.hero-wide .shot{position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; display:block;}
/* תמונה שצרה מ-5:3 — כל מה שהועלה לפני המעבר ליחס הזה — נחתכה
   כאן מלמעלה ומלמטה, כלומר דווקא בראש. עם fit היא מוצגת בגובה
   מלא וממורכזת, והמסגרת מסביבה מתמלאת בעותק המטושטש. */
.hero-wide.fit .shot{object-fit:contain;}
/* תמונה ריבועית שהועלתה לפני השינוי: ממורכזת, על עותק מטושטש
   של עצמה. בלי זה היא הייתה נמתחת או מותירה פסים ריקים. */
.hero-wide .blur{position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; filter:blur(22px) saturate(.7) brightness(.72);
  transform:scale(1.14); display:block;}
.hero-wide .shade{
  position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(to top, rgba(22,16,10,.92) 0%,
             rgba(22,16,10,.42) 42%, rgba(22,16,10,0) 74%);
}
.hero-wide .letter{
  position:absolute; inset:0; display:grid; place-items:center;
  font-family:var(--font-name); font-weight:700; font-size:92px;
  color:rgba(255,252,246,.9);
}
.hero-wide .cap{position:relative; width:100%; padding:0 22px 16px;}
.hero-wide h2{
  font-family:var(--font-name); font-size:27px; font-weight:700; color:#FFFCF6;
  margin:0 0 4px; line-height:1.16; overflow-wrap:anywhere; word-break:break-word;
}
.hero-wide .sub{font-size:13.5px; color:#F0E7D8; margin:0; line-height:1.5;}
.hero-wide h2 .maiden{font-size:14px; font-weight:400; color:#F0E7D8;}
.hero-min h2 .maiden{font-size:14px; font-weight:400; color:var(--ink-soft);}
.sheet-top.over{
  position:absolute; inset-inline:14px; top:14px; z-index:2; padding:0;
}
/* אטום לגמרי ולא .93: בשקיפות חלקית הסימן נמדד מול הרקע הכהה
   של הרצועה, והניגודיות שלו צונחת ל-1.1 */
.sheet-top.over .panel-x{background:var(--paper); color:var(--ink);}

/* מי שאין לו תמונה — שורה אחת עם מדליון, בלי רצועה ריקה */
.hero-min{display:flex; align-items:center; gap:15px; padding:8px 0 2px;}
.hero-min .medal{
  width:76px; height:76px; flex:none; border-radius:50%;
  display:grid; place-items:center; color:#fff;
  font-family:var(--font-name); font-weight:700; font-size:32px;
  box-shadow:0 0 0 3px var(--paper), 0 0 0 5px currentColor;
}
.hero-min .medal span{color:#fff;}
.hero-min .txt{min-width:0;}
.hero-min h2{font-family:var(--font-name); font-size:26px; font-weight:700;
  margin:0 0 3px; line-height:1.15; overflow-wrap:anywhere; word-break:break-word;}
.hero-min .sub{font-size:13.5px; color:var(--ink-soft); margin:0; line-height:1.5;}

/* עובדות כתגיות. מה שאין פשוט לא נוצר. */
.chips{display:flex; flex-wrap:wrap; gap:7px; padding:15px 0 0;}
.chips span{
  font-size:13px; background:#F2EBE4; border:1px solid #E3D8CC;
  color:#5E4E3E; border-radius:999px; padding:6px 12px;
}

/* ===== המחברת: דף אחד מתמשך לכל הפתקים ===== */
.sec-h{font-family:var(--font-name); font-size:19px; font-weight:700; margin:0 0 10px;}
.notes-sec{padding-top:20px;}
.notebook{
  border:1px solid #E8DECA; border-radius:4px 14px 14px 4px;
  background-color:#FFFDF7;
  background-image:
    linear-gradient(to left, transparent 0 33px, #E8C4B6 33px 34px, transparent 34px),
    repeating-linear-gradient(to bottom, transparent 0 27px, #EAE2CF 27px 28px);
  background-position:0 0, 0 18px;
  padding:18px 46px 16px 18px;
  box-shadow:0 1px 0 #F2E9D8;
}
.nb-text{
  margin:0; font-size:15px; line-height:28px; color:var(--ink);
  white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word;
}
/* מילה ראשונה מודגשת ולא אות פתיחה מוגדלת: אות גדולה הייתה
   שוברת את יישור השורות, וכל הרעיון הוא שהטקסט יושב על הקווים. */
.nb-text b{font-family:var(--font-name); font-weight:700; color:var(--wood);}
/* #A08E78 נתן ניגודיות 3.11 על נייר המחברת — מתחת לסף. ומי
   שחתום על הפתק הוא בדיוק מי שרוצים לזהות. */
.nb-by{margin:0; font-size:12.5px; line-height:28px; color:#80705A;}
.nb-gap{height:28px;}
/* המחברת כשכותבים בה. פתוחה במכוון — בלי מסגרת ובלי פינות — כדי
   שתיקרא כהמשך של אותו דף שבכרטיס, ולא כתיבת טקסט. */
.nb-form{
  margin:26px 0 0; padding:0 34px 0 4px;
  background-image:
    linear-gradient(to left, transparent 0 25px, #E8C4B6 25px 26px, transparent 26px),
    repeating-linear-gradient(to bottom, transparent 0 27px, #EAE2CF 27px 28px);
  background-position:0 0, 0 20px;
}
.nb-form textarea{
  width:100%; box-sizing:border-box; display:block;
  border:none; background:none; outline:none; resize:none; overflow:hidden;
  font-family:var(--font-name); font-size:16px; line-height:28px; color:var(--ink);
  padding:28px 0 0;                      /* שורה ריקה אחת לפני הכתיבה */
}
.nb-form textarea::placeholder{color:#C3B49C;}
/* שתי שורות ריקות ואז החתימה, מוזחת פנימה מקו השוליים */
.nb-sign{display:flex; align-items:flex-end; gap:9px; height:84px; padding:0 44px 3px 0;}
.nb-sign span{font-size:12.5px; color:var(--ink-soft); line-height:25px; flex:none;}
.nb-sign input{
  flex:1; min-width:0; height:25px; padding:0;
  border:none; background:none; outline:none;
  font-family:var(--font-name); font-size:16px; line-height:25px; color:var(--wood);
}
.nb-sign input::placeholder{color:#C3B49C;}
.nb-sign.bad span{color:var(--clay);}
.nb-sign.bad input::placeholder{color:#C08478;}
/* בטופס הפתק הרצועה אינה שוברת את הריפוד — היא יושבת בתוכו,
   ולכן גם הרוחב חוזר לרגיל יחד עם השוליים. */
.hero-wide.inform{margin:16px 0 0; width:100%; border-radius:14px;}
/* שורה שאומרת לאן הדבר הולך. מתחת לכל כפתור אישור סופי של אורח. */
.send-note{
  margin:10px 0 0; font-size:12.5px; line-height:1.6;
  color:var(--ink-soft); text-align:center;
}
.nb-add{display:flex; flex-direction:column; align-items:center; gap:8px; margin-top:16px;}
.nb-add p{margin:0; font-size:12.5px; color:var(--ink-soft); text-align:center;}
.btn-pill{
  font-family:var(--font-ui); font-size:14.5px; font-weight:700; color:#fff;
  background:var(--forest); border:none; border-radius:999px;
  padding:12px 24px; cursor:pointer;
}
.btn-pill:active{background:#22452F;}

/* פרטי תקשורת — בתחתית, מתחת לפתקים */
.contact-end{margin-top:26px; padding-top:16px; border-top:1px solid #F0E7D8;}
.contact-end h3{
  font-size:12px; font-weight:700; letter-spacing:.04em;
  color:var(--ink-soft); margin:0 0 9px;
}
.contact-end .ce{display:flex; gap:8px; font-size:13.5px; margin-bottom:5px;}
.contact-end .ce b{font-weight:400; color:var(--ink-soft); min-width:46px; flex:none;}
.contact-end .ce a{color:var(--wood); overflow:hidden; text-overflow:ellipsis;}

.sheet-actions{display:flex; gap:10px; padding:18px 0 4px;}
.btn{
  flex:1; min-height:50px; border-radius:13px; border:none;
  font-family:var(--font-ui); font-size:15.5px; font-weight:700; cursor:pointer;
}
.btn-primary{background:var(--forest); color:#fff;}
.btn-primary:active{background:#22452F;}
.btn-ghost{background:transparent; color:var(--wood); border:1.5px solid var(--wood-soft);}
.btn-ghost:active{background:#F0E6D6;}

.note{
  margin-top:14px; padding:12px 14px; border-radius:11px;
  background:#F4EFE4; border-inline-start:3px solid var(--wood-soft);
  font-size:12.5px; line-height:1.55; color:var(--ink-soft);
}

/* הודעה קופצת */
#toast{
  position:fixed; z-index:60; bottom:calc(env(safe-area-inset-bottom) + 26px);
  inset-inline:0; margin:auto; width:max-content; max-width:82vw;
  background:var(--ink); color:#fff; font-size:14px; font-weight:600;
  padding:12px 20px; border-radius:999px;
  opacity:0; transform:translateY(14px); pointer-events:none;
  transition:opacity .22s, transform .22s;
}
#toast.show{opacity:1; transform:translateY(0);}
/* כשחלון תחתון פתוח, התחתית היא אזור קריאה: ההודעה ישבה בדיוק על
   שורה של פתק. למעלה יש את הכותרת או רצועת התמונה, ושם היא לא
   מסתירה טקסט. הכיוון מתהפך גם באנימציה, אחרת היא נכנסת מלמטה
   אל מקום עליון. */
#toast.top{
  bottom:auto; top:calc(env(safe-area-inset-top) + 18px);
  transform:translateY(-14px);
}
#toast.top.show{transform:translateY(0);}

:focus-visible{outline:3px solid var(--forest); outline-offset:2px;}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="login-mark" id="loginMark"></div>
    <h1 id="loginName"></h1>
    <p id="loginWelcome"></p>
    <input id="loginPass" type="password" placeholder="סיסמה" autocomplete="off">
