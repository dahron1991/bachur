<script>
"use strict";
/* ============================================================
   מודול 0.0 — סירוב להיטען בתוך אתר אחר

   התקיפה: אתר זר טוען את האפליקציה בתוך מסגרת שקופה, מניח
   כפתור משלו מעל המקום שבו יושב "מחיקה", ומזמין מנהל שכבר
   מחובר ללחוץ. הלחיצה נופלת על האפליקציה האמיתית.

   ההגנה הנכונה היא כותרת frame-ancestors, אבל GitHub Pages
   אינו מאפשר לקבוע כותרות, ובתגית meta הדפדפן מתעלם ממנה.
   לכן הבדיקה נעשית כאן, לפני שמצטייר משהו: אם אנחנו בתוך
   מסגרת — לא מריצים את האפליקציה בכלל, ומציעים לפתוח אותה
   בחלון שלה.
   ============================================================ */
(function(){
  let framed = false;
  try { framed = window.top !== window.self; }
  catch(e){ framed = true; }   /* חסימת גישה ל-top היא עצמה סימן למסגרת */
  if(!framed) return;
  document.documentElement.setAttribute('dir', 'rtl');
  document.body.textContent = '';
  const box = document.createElement('div');
  box.setAttribute('style',
    'font:16px system-ui,sans-serif;direction:rtl;text-align:center;' +
    'padding:48px 20px;color:#3A3028;background:#F7F2E8;' +
    'position:fixed;inset:0;z-index:99999');
  const h = document.createElement('p');
  h.textContent = 'האפליקציה אינה נפתחת בתוך אתר אחר.';
  const a = document.createElement('a');
  a.href = location.href;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.textContent = 'פתיחה בחלון נפרד';
  a.setAttribute('style', 'color:#2F5D50;font-weight:700');
  box.appendChild(h); box.appendChild(a);
  document.body.appendChild(box);
  /* עוצרים את כל השאר. throw כאן מפסיק את הסקריפט הזה בלבד. */
  throw new Error('framed');
})();

/* ============================================================
   מודול 0 — הגדרות המשפחה

   כל מה שמשתנה בין משפחה למשפחה יושב כאן, בבלוק אחד.
   כדי להקים עותק למשפחה אחרת מחליפים רק את הערכים האלה.

   בגרסה המחוברת הבלוק הזה לא נערך ביד: הוא נטען מטבלת
   families לפי המשפחה שאליה נכנסו, ומולא באותם שדות בדיוק.
   ============================================================ */
const FAMILY = {
  name:    'משפחת בחור',
  welcome: 'ברוכים הבאים לאילן היוחסין המשפחתי',
  hint:    'הזינו את הסיסמה שקיבלתם במשפחה',
  /* כתובת הלוגו. ריק — תוצג האות הראשונה של שם המשפחה בעיגול.
     הכתובת כאן היא מה שרואה מי שנכנס בפעם הראשונה; אחרי הכניסה
     היא נטענת מטבלת families ודורסת את מה שכאן. שתיהן צריכות
     להצביע לאותו קובץ, אחרת הלוגו יקפוץ בין השתיים. */
  logo:    'https://dahron1991.github.io/bachur/logo.jpg',
  passGuest: '',
  passAdmin: ''
};

/* ============================================================
   מודול 0.5 — החיבור לשרת

   כל מה שנוגע ל-Supabase יושב כאן, במקום אחד.
   SUPA.enabled=false מחזיר את האפליקציה למצב דמה מקומי לגמרי,
   בלי שום פנייה לרשת — כך אפשר לפתח ולבדוק בלי חיבור.
   ============================================================ */
const SUPA = {
  url:  'https://qmmkalmixlsibfktdncq.supabase.co',
  /* המפתח הזה נועד לשבת בקוד הדפדפן. הוא מזהה את הפרויקט ואינו
     מעניק גישה: כל ההגנה היא בהגנת השורות ובאסימון המשפחה. */
  key:  'sb_publishable_rvVfL-h6EworK3lKs0cIPw_Liy4cCI1',
  slug: 'default',
  enabled: true
};

const TOKEN_KEY = 'ft_token';
let TOKEN = null;
try { TOKEN = localStorage.getItem(TOKEN_KEY) || null; } catch(e){ TOKEN = null; }
const saveToken = t => {
  TOKEN = t;
  try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch(e){}
};

/* פנייה לשרת. מחזירה את גוף התשובה, או זורקת שגיאה בעברית. */
async function api(path, {method = 'GET', body = null, headers = {}} = {}){
  const h = Object.assign({
    'apikey': SUPA.key,
    'Authorization': 'Bearer ' + SUPA.key,
    'Content-Type': 'application/json'
  }, headers);
  if(TOKEN) h['x-family-token'] = TOKEN;

  /* פסק זמן: רשת שנתקעת בלי להיכשל הייתה משאירה את הכפתור
     במצב "טוען" לנצח, בלי שום הודעה. */
  const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
  const bail = ctrl ? setTimeout(() => ctrl.abort(), 20000) : null;
  let res;
  try {
    res = await fetch(SUPA.url + path, {
      method, headers: h,
      body: body == null ? null : JSON.stringify(body),
      signal: ctrl ? ctrl.signal : undefined
    });
  } catch(e){
    throw new Error((e && e.name === 'AbortError')
      ? 'השרת לא הגיב. נסו שוב בעוד רגע'
      : 'אין חיבור לשרת. בדקו את האינטרנט ונסו שוב');
  } finally {
    if(bail) clearTimeout(bail);
  }
  if(res.status === 401 || res.status === 403){
    const e = new Error('ההרשאה פגה. יש להיכנס מחדש');
    e.auth = true;
    throw e;
  }
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch(e){ data = null; }
  if(!res.ok){
    const raw = (data && (data.message || data.error || data.hint)) || '';
    throw new Error(serverMsg(raw, res.status));
  }
  return data;
}

/* ---------- תרגום שגיאות השרת ----------
   השרת עונה באנגלית, ולפעמים בשם של אילוץ. בלי התרגום הזה
   בן משפחה רואה "too_many_attempts" ולא מבין שצריך פשוט להמתין,
   או רואה "סיסמה שגויה" כשהסיסמה דווקא נכונה והוא רק נחסם. */
const SERVER_MSG = [
  ['too_many_attempts',      'יותר מדי ניסיונות כניסה. יש להמתין רבע שעה ולנסות שוב'],
  ['too many pending',       'יש יותר מדי בקשות שממתינות לאישור. בקשו מהמנהל לטפל בהן ונסו שוב'],
  ['belongs to another family','הבקשה מצביעה על אדם שאינו במשפחה הזאת'],
  ['requests_payload_size',  'הבקשה גדולה מדי. נסו שוב עם תמונה קטנה יותר'],
  /* שמות האילוצים נלקחו מהמסד עצמו, לא מהזיכרון.
     הסדר חשוב: המדויק לפני הכללי. */
  ['people_birth_real',      'תאריך הלידה אינו קיים בלוח השנה'],
  ['people_death_real',      'תאריך הפטירה אינו קיים בלוח השנה'],
  ['people_birth_check',     'תאריך הלידה אינו בתצורה נכונה. אפשר שנה בלבד, למשל 1948'],
  ['people_death_check',     'תאריך הפטירה אינו בתצורה נכונה. אפשר שנה בלבד'],
  ['people_name_check',      'צריך למלא שם פרטי'],
  ['people_gender_check',    'צריך לבחור מגדר'],
  ['notes_text_check',       'הפתק ריק'],
  ['unions_status_check',    'סטטוס הזוגיות אינו מוכר'],
  ['partners_differ',        'אי אפשר לקשר אדם לעצמו'],
  ['requests_kind_check',    'סוג הבקשה אינו מוכר'],
  ['requests_relation_check','הקשר המשפחתי בבקשה אינו מוכר'],
  ['request_shape',          'בבקשה חסר האדם שאליו היא מתייחסת'],
  ['row-level security',     'אין הרשאה לפעולה הזאת'],
  ['duplicate key',          'הרשומה הזאת כבר קיימת'],
  ['server_error',           'השרת נתקל בתקלה. נסו שוב בעוד רגע'],
  ['bad_request',            'הבקשה לא נשלחה כראוי. נסו שוב'],
];
function serverMsg(raw, status){
  const t = String(raw || '').toLowerCase();
  for(const [key, he] of SERVER_MSG) if(t.includes(key)) return he;
  if(status === 429) return 'יותר מדי ניסיונות. יש להמתין ולנסות שוב';
  if(status === 413) return 'מה שנשלח גדול מדי';
  /* הודעה גולמית באנגלית טובה יותר מכלום, אבל רק כשיש בה משהו */
  return raw ? String(raw) : ('השרת החזיר שגיאה ' + status);
}

const rest = (table, query) => api('/rest/v1/' + table + (query ? '?' + query : ''));

/* שליפה בעמודים.
   שרת REST יכול להיות מוגדר להחזיר לכל היותר מספר שורות מסוים.
   שליפה אחת גדולה הייתה מחזירה חלק מהסיפורים **בלי שום סימן לכך**,
   והמשפחה הייתה רואה עץ חסר ומאמינה שזה הכול. כאן נשלפים עמודים
   עד שחוזר עמוד קצר מהמלא, ואז בטוח שזה הסוף.

   המיון לפי המזהה אינו קישוט: בלי סדר יציב, שתי שליפות עוקבות
   יכולות להחזיר את אותה שורה פעמיים ולדלג על אחרת. */
const PAGE_ROWS = 500;
async function restAll(table, query){
  const out = [];
  for(let from = 0; ; from += PAGE_ROWS){
    const page = await api('/rest/v1/' + table + '?' + query +
      '&order=id.asc&limit=' + PAGE_ROWS + '&offset=' + from);
    if(!Array.isArray(page)) return out;
    out.push.apply(out, page);
    if(page.length < PAGE_ROWS) return out;
    if(out.length > 200000) return out;      // בלם מפני לולאה אין-סופית
  }
}

/* ---------- כניסה ---------- */
async function serverLogin(password){
  const r = await api('/functions/v1/login', {
    method: 'POST', body: {slug: SUPA.slug, password}
  }).catch(e => { if(e.auth) return {ok:false}; throw e; });
  if(!r || !r.ok) return null;
  saveToken(r.token);
  return r;
}

let FAMILY_ID = null;              // מזהה המשפחה שבאסימון

/* ---------- כתיבה ----------
   כל כתיבה נושאת את family_id. המסד דורש אותו, וההגנה בודקת
   שהוא תואם לאסימון — ולכן אי אפשר לכתוב למשפחה אחרת. */
const withFamily = row => Object.assign({}, row, {family_id: FAMILY_ID});

async function insertRows(table, rows){
  if(!rows.length) return [];
  /* שומר: מזהה שאינו בפורמט של המסד גורם לדחייה של כל המנה,
     עם קוד שגיאה סתום. עדיף להיעצר כאן עם הודעה מובנת. */
  const bad = rows.find(r => r.id && !isUuid(r.id));
  if(bad) throw new Error('מזהה לא תקין בטבלה ' + table + ': ' + bad.id);
  const out = [];
  for(let i = 0; i < rows.length; i += 200){      // מנות, כדי לא לשלוח בקשה ענקית
    /* merge-duplicates: ניסיון חוזר אחרי כישלון באמצע לא יתנגש
       על שורה שכבר נכנסה, אלא יעדכן אותה. בלי זה כל ניסיון שני
       נכשל על מפתח כפול והסנכרון נתקע לנצח. */
    const r = await api('/rest/v1/' + table, {
      method: 'POST',
      body: rows.slice(i, i + 200).map(withFamily),
      headers: {'Prefer': 'return=representation,resolution=merge-duplicates'}
    });
    if(Array.isArray(r)) out.push(...r);
  }
  return out;
}

/* עדכון רשומה אחת, עם בדיקת גרסה.
   הכתיבה מותנית בכך שהחותמת שבידנו היא עדיין זו שבשרת.
   אם מישהו הקדים אותנו — לא מתעדכנת אף שורה, ואנחנו יודעים. */
async function updateRow(table, id, patch, ver){
  const q = 'id=eq.' + encodeURIComponent(id) +
            (ver ? '&updated_at=eq.' + encodeURIComponent(ver) : '');
  /* החותמת החדשה אינה נשלחת מכאן יותר. המסד קובע אותה בעצמו,
     ומחזיר אותה בתשובה. קודם הדפדפן שלח את השעה שלו — ואז שעון
     לא מדויק באחד המנהלים היה הופך את סדר השינויים, וכל כותב
     ששכח לשלוח אותה היה משתיק את בדיקת הגרסה בלי שאף אחד ידע. */
  const r = await api('/rest/v1/' + table + '?' + q, {
    method: 'PATCH',
    body: patch,
    headers: {'Prefer': 'return=representation'}
  });
  if(Array.isArray(r) && !r.length){
    const e = new Error('הרשומה עודכנה בינתיים על ידי מנהל אחר');
    e.stale = true;
    throw e;
  }
  return Array.isArray(r) ? r[0] : r;
}

/* מחיקה במנות של 80 מזהים.
   המזהים נוסעים בכתובת ולא בגוף הבקשה, וכתובת ארוכה מדי נדחית
   על ידי השרת לפני שהיא בכלל מגיעה למסד. 200 מזהים הם כבר 7,500
   תווים — כלומר מחיקה של משפחה שלמה הייתה נכשלת בלי אזהרה
   ומשאירה את כל האנשים הישנים בשרת. */
async function deleteRows(table, ids){
  if(!ids.length) return;
  for(let i = 0; i < ids.length; i += 80){
    const slice = ids.slice(i, i + 80);
    await api('/rest/v1/' + table + '?id=in.(' + slice.map(encodeURIComponent).join(',') + ')',
              {method: 'DELETE'});
  }
}

/* מזהה חדש, בפורמט שהמסד דורש */
const newUuid = () => (crypto && crypto.randomUUID) ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 3 | 8)).toString(16);
    });
const isUuid = v => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v || '');

/* גיבוי "זר" = לא נוצר מהשרת הזה, ולכן אין דרך להתאים את האנשים
   שבו לאנשים שכבר קיימים. במיזוג כולם ייכנסו כחדשים. */
const isForeignBackup = bk => !bk || !bk.people || !bk.unions ? false :
  Object.keys(bk.people).some(id => !isUuid(id)) || bk.unions.some(u => !isUuid(u.id));

/* גיבוי שנוצר במצב דמה נושא מזהים כמו p1, שהמסד לא מקבל.
   כאן הם מוחלפים במזהים תקינים, והקשרים מתורגמים יחד איתם.
   מזהה שכבר תקין נשאר כפי שהוא — כך גיבוי מהשרת ממוזג לפי זהות. */
function remapIds(bk){
  /* הכל או כלום, במכוון. המרה חלקית יוצרת מצב מעורב שבו זוגיות
     מקבלת מזהה חדש אבל הילד שלה שומר על הישן — ואז אותו ילד
     נמצא גם בזוגיות הישנה וגם בחדשה. גיבוי הוא או של השרת הזה,
     או זר. מצב ביניים אינו קיים. */
  if(!isForeignBackup(bk)) return bk;

  const map = {};
  Object.keys(bk.people).forEach(id => map[id] = newUuid());
  const umap = {};
  bk.unions.forEach(u => umap[u.id] = newUuid());

  const people = {};
  Object.keys(bk.people).forEach(id => {
    const p = Object.assign({}, bk.people[id]);
    p.id = map[id];
    people[p.id] = p;
  });
  const unions = bk.unions.map(u => ({
    id: umap[u.id],
    partners: u.partners.map(x => map[x]).filter(Boolean),
    children: u.children.map(x => map[x]).filter(Boolean),
    status: u.status
  }));
  return Object.assign({}, bk, {people, unions, root: map[bk.root] || bk.root});
}

/* ============================================================
   ההשוואה — מה לשלוח לשרת
   אין רישום של פעולות. אחרי כל שינוי משווים את העץ שבזיכרון
   לעותק של מה שהשרת מחזיק, ושולחים רק את ההפרש.
   כך לא משנה מאיזה מקום בקוד הגיע השינוי — אין מה להחמיץ.
   ============================================================ */
let SAVED = null;                  // מה שאנחנו יודעים שהשרת מחזיק

const deepCopy = x => JSON.parse(JSON.stringify(x));
/* serverRoot אופציונלי: מה שהשרת באמת מחזיק, שאינו בהכרח
   מה שאנחנו מציגים. ההפרש ביניהם הוא שינוי שצריך להישלח. */
const markSaved = (db, serverRoot) => {
  SAVED = {
    people: deepCopy(db.people),
    unions: deepCopy(db.unions),
    pending: deepCopy(pending),
    root: serverRoot !== undefined ? serverRoot : db.root
  };
};

/* לאיזו זוגיות כל אדם שייך כילד */
function parentMap(db){
  const m = {};
  db.unions.forEach(u => u.children.forEach(c => m[c] = u.id));
  return m;
}

/* שדות האדם שנשמרים במסד */
const DB_FIELDS = ['name','surname','maiden','birth','death','city','phone','email'];
const dbPersonRow = p => {
  const row = {name: p.name, gender: p.gender, placeholder: !!p.placeholder};
  DB_FIELDS.forEach(k => row[k] = p[k] || null);
  row.photo_path = p.photoPath || null;
  row.thumb_path = p.thumbPath || null;
  return row;
};
const sameRow = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const noteSig = n => (n.text || '') + '\u0000' + (n.by || '');

/* בונה את רשימת הפעולות. לא נוגע בשרת — רק מחשב. */
function planSync(cur, saved){
  const plan = {addP:[], updP:[], delP:[], addU:[], updU:[], delU:[],
                addN:[], updN:[], delN:[], addR:[], updR:[], delR:[],
                photos:[], root:null};
  if(!saved) return plan;

  const pNow = parentMap(cur), pWas = parentMap(saved);

  Object.keys(cur.people).forEach(id => {
    const now = cur.people[id], was = saved.people[id];
    if(!was){ plan.addP.push(id); return; }
    const a = dbPersonRow(now), b = dbPersonRow(was);
    a.parent_union = pNow[id] || null;
    b.parent_union = pWas[id] || null;
    if(!sameRow(a, b)) plan.updP.push(id);
  });
  Object.keys(saved.people).forEach(id => { if(!cur.people[id]) plan.delP.push(id); });

  const uNow = {}; cur.unions.forEach(u => uNow[u.id] = u);
  const uWas = {}; saved.unions.forEach(u => uWas[u.id] = u);
  cur.unions.forEach(u => {
    const was = uWas[u.id];
    if(!was){ plan.addU.push(u.id); return; }
    if(u.partners.join(',') !== was.partners.join(',') || statusOf(u) !== statusOf(was))
      plan.updU.push(u.id);
  });
  saved.unions.forEach(u => { if(!uNow[u.id]) plan.delU.push(u.id); });

  /* פתקים: חדש הוא כזה שאין לו מזהה מהשרת */
  Object.keys(cur.people).forEach(id => {
    const now = (cur.people[id] || {}).notes || [];
    const was = ((saved.people[id] || {}).notes) || [];
    const wasById = {}; was.forEach(n => { if(n.id) wasById[n.id] = n; });
    now.forEach(n => {
      /* "יש מזהה" אינו מספיק כדי להסיק שהפתק כבר בשרת: אם ההוספה
         נכשלה באמצע, או שהפתק חזר מגיבוי, יש לו מזהה שאינו שם.
         קודם מצב כזה נפל בין הכיסאות — לא נוסף ולא עודכן — והפתק
         נעלם מההשוואה לנצח. ההוספה חוזרת עם אותו מזהה, והמסד
         מעדכן במקום להתנגש. */
      const old = n.id ? wasById[n.id] : null;
      if(!old){ plan.addN.push({person: id, note: n}); return; }
      if(noteSig(old) !== noteSig(n)) plan.updN.push({person: id, note: n});
    });
    const keep = new Set(now.filter(n => n.id).map(n => n.id));
    was.forEach(n => { if(n.id && !keep.has(n.id)) plan.delN.push(n.id); });
  });
  /* פתקים של מי שנמחק נמחקים יחד איתו במסד, ולכן לא נספרים כאן */

  /* בקשות ממתינות. התור הוא מערך גלובלי ולא חלק מהעץ,
     ולכן הוא נשווה כאן בנפרד. */
  const rWas = {}; (saved.pending || []).forEach(r => rWas[r.id] = r);
  const rNow = {}; pending.forEach(r => rNow[r.id] = r);
  pending.forEach(r => {
    const was = rWas[r.id];
    if(!was){ plan.addR.push(r.id); return; }
    if(JSON.stringify(reqToRow(r)) !== JSON.stringify(reqToRow(was))) plan.updR.push(r.id);
  });
  (saved.pending || []).forEach(r => { if(!rNow[r.id]) plan.delR.push(r.id); });

  /* תמונה שממתינה להעלאה אינה שדה רגיל ולכן לא תיתפס בהשוואת
     השורות. בלעדיה הסנכרון בכלל לא היה רץ. */
  plan.photos = Object.keys(cur.people)
    .filter(id => cur.people[id].pendingPhoto || cur.people[id].dropPhoto);

  if(cur.root !== saved.root) plan.root = cur.root;
  return plan;
}

const planCount = p => p.addP.length + p.updP.length + p.delP.length +
  p.addU.length + p.updU.length + p.delU.length +
  p.addN.length + p.updN.length + p.delN.length +
  p.addR.length + p.updR.length + p.delR.length +
  (p.photos || []).length + (p.root ? 1 : 0);

/* מבצע את התוכנית. הסדר חשוב:
   מוסיפים לפני שמקשרים, ומוחקים אחרי שהקשרים כבר נותקו. */
async function runSync(plan, db){
  const pm = parentMap(db);

  /* אדם מצביע לזוגיות ההורים, וזוגיות מצביעה לבני הזוג — מעגל.
     לכן הזוגיות נוצרות קודם בלי בני זוג, האנשים נשלחים פעם אחת
     עם הקישור להורים, ורק אז הזוגיות מקבלות את בני הזוג.
     הזוגיות הן שורות קטנות, ולכן עדיף לשלוח אותן פעמיים
     מאשר לשלוח פעמיים את האנשים, שנושאים את כל הפרטים. */
  if(plan.addU.length)
    await insertRows('unions', plan.addU.map(id => ({id, partner_a: null, partner_b: null})));

  if(plan.addP.length){
    const back = await insertRows('people', plan.addP.map(id => {
      const r = dbPersonRow(db.people[id]);
      r.id = id;
      r.parent_union = pm[id] || null;
      return r;
    }));
    back.forEach(r => { if(db.people[r.id] && r.updated_at) db.people[r.id].ver = r.updated_at; });
  }

  if(plan.addU.length)
    /* ייתכן שהמשתמש מחק משהו בזמן הכתיבה. רשומה שנעלמה מדולגת
       כאן במקום להפיל את כל הסנכרון עם שגיאה לא מובנת. */
    await insertRows('unions', plan.addU.map(id => {
      const u = db.unions.find(x => x.id === id);
      return u ? {id: u.id, partner_a: u.partners[0] || null,
                  partner_b: u.partners[1] || null, status: statusOf(u)} : null;
    }).filter(Boolean));

  for(const id of plan.updU){
    const u = db.unions.find(x => x.id === id);
    if(!u) continue;
    const r = await updateRow('unions', id,
      {partner_a: u.partners[0] || null, partner_b: u.partners[1] || null, status: statusOf(u)},
      u.ver);
    if(r && r.updated_at) u.ver = r.updated_at;
  }

  /* אנשים קיימים מעודכנים אחד-אחד, כי כל אחד נושא בדיקת גרסה משלו */
  for(const id of plan.updP){
    const p = db.people[id];
    if(!p) continue;
    const row = dbPersonRow(p);
    row.parent_union = pm[id] || null;
    const r = await updateRow('people', id, row, p.ver);
    if(r && r.updated_at) p.ver = r.updated_at;
  }

  /* המזהה נקבע כאן ולא בשרת, ונשמר מיד על הפתק המקומי.
     בלי זה הפתק נשאר בלי מזהה, ההשוואה הבאה רואה אותו כחדש,
     והוא נוסף שוב ושוב — פתקים כפולים בכל סנכרון. */
  if(plan.addN.length){
    const rows = plan.addN.map(x => {
      /* המזהה כבר נקבע בשלב התכנון. אם בכל זאת אין — נוצר כאן. */
      const id = x.note.id || newUuid();
      x.note.id = id;
      return {id, person_id: x.person, text: x.note.text, author: x.note.by || null};
    });
    await insertRows('notes', rows);
  }
  for(const x of plan.updN)
    await updateRow('notes', x.note.id, {text: x.note.text, author: x.note.by || null}, null);
  if(plan.delN.length) await deleteRows('notes', plan.delN);

  /* התמונות עולות אחרי שהאנשים כבר קיימים בשרת, ואז הנתיבים
     שחוזרים נכתבים ברשומה בסיבוב הבא של ההשוואה. */
  if((plan.photos || []).length) await pushPhotos();

  /* בקשות מצביעות לאנשים, ולכן הן נכנסות אחרי שהאנשים קיימים
     ונמחקות לפני שהאנשים נמחקים. */
  if(plan.addR.length)
    await insertRows('requests', plan.addR.map(id => reqToRow(pending.find(r => r.id === id))));
  for(const id of plan.updR){
    const r = pending.find(x => x.id === id);
    if(!r) continue;
    const back = await updateRow('requests', id, reqToRow(r), r.ver);
    if(back && back.updated_at) r.ver = back.updated_at;
  }
  if(plan.delR.length) await deleteRows('requests', plan.delR);

  if(plan.delU.length) await deleteRows('unions', plan.delU);
  if(plan.delP.length) await deleteRows('people', plan.delP);

  if(plan.root)
    await api('/rest/v1/families?id=eq.' + FAMILY_ID,
              {method: 'PATCH', body: {root_person_id: plan.root}});
}

/* ---------- חיווי שמירה ---------- */
let syncErrMsg = '', syncFails = 0, syncHalted = false;

function setSyncState(state, msg){
  syncErrMsg = state === 'error' ? (msg || 'השמירה נכשלה') : '';
  const el = document.getElementById('syncDot');
  if(!el) return;
  el.className = 'sync ' + state;
  el.title = state === 'saving' ? 'שומר…'
           : state === 'error'  ? syncErrMsg + ' — לחצו לניסיון נוסף'
           : 'הכל שמור';
  el.hidden = !SUPA.enabled || !role;
  el.onclick = state === 'error' ? retrySync : null;
  /* ההודעה מוצגת פעם אחת לכל תקלה, לא בכל ניסיון —
     אחרת היא קופצת שוב ושוב ומסתירה את המסך. */
  if(state === 'error' && syncFails <= 1) toast(syncErrMsg);
}

/* ניסיון ידני אחרי שהעצירה נכנסה */
function retrySync(){
  syncHalted = false; syncFails = 0;
  setSyncState('saving');
  syncNow();
}

/* ---------- תמונות ----------
   התמונה שנחתכה היא עדיין טקסט בזיכרון. היא נשלחת לאחסון רק
   אחרי שהאדם כבר קיים בשרת, כי פונקציית השרת מוודאת שהוא שייך
   למשפחה שבאסימון לפני שהיא מקבלת קובץ. */
const isDataUrl = v => typeof v === 'string' && v.startsWith('data:');

function markPhotoForUpload(p, d){
  if(!SUPA.enabled) return;
  if(isDataUrl(d.photo)){
    p.pendingPhoto = {full: d.photo, thumb: d.thumb || d.photo};
  } else if(!d.photo && (p.photoPath || p.thumbPath)){
    /* התמונה הוסרה: הנתיבים יורדים מהרשומה, והקבצים יימחקו
       מהאחסון כדי שלא יתפסו מקום לנצח. */
    p.dropPhoto = [p.photoPath, p.thumbPath].filter(Boolean);
    delete p.photoPath; delete p.thumbPath; delete p.pendingPhoto;
  }
}

/* מעלה את מה שממתין. רצה אחרי שהאנשים כבר נכתבו. */
async function pushPhotos(){
  const up = Object.values(DB.people).filter(p => p.pendingPhoto);
  for(const p of up){
    const r = await api('/functions/v1/photos', {method:'POST', body:{
      action: 'upload', personId: p.id,
      full: p.pendingPhoto.full, thumb: p.pendingPhoto.thumb
    }});
    if(!r || !r.ok)
      throw new Error('העלאת התמונה נכשלה' + (r && r.error ? ' (' + r.error + ')' : ''));
    p.photoPath = r.photo_path;
    p.thumbPath = r.thumb_path;
    /* פונקציית השרת כבר עדכנה את הרשומה, ולכן החותמת שבידנו
       התיישנה. בלי לרענן אותה, העדכון הבא לאדם הזה היה נדחה. */
    if(r.updated_at) p.ver = r.updated_at;
    delete p.pendingPhoto;
    if(r.urls){
      Object.assign(photoCache, r.urls);
      if(r.urls[r.thumb_path]) p.thumb = r.urls[r.thumb_path];
      if(r.urls[r.photo_path]) p.photo = r.urls[r.photo_path];
    }
  }
  const drop = Object.values(DB.people).filter(p => p.dropPhoto);
  for(const p of drop){
    await api('/functions/v1/photos', {method:'POST',
      body: {action:'remove', paths: p.dropPhoto}}).catch(() => {});
    delete p.dropPhoto;
    delete p.photo; delete p.thumb;
  }
}

/* ---------- הנקודה שכל שינוי עובר דרכה ---------- */
let syncTimer = null, syncing = false, syncQueued = false;

function scheduleSync(){
  if(!SUPA.enabled || !SAVED || !FAMILY_ID || syncHalted) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, 250);     // כמה שינויים ברצף נשלחים יחד
}

async function syncNow(){
  if(!SUPA.enabled || !SAVED || !FAMILY_ID) return;
  if(syncing){ syncQueued = true; return; }
  const plan = planSync(DB, SAVED);
  if(!planCount(plan)) return;

  /* מזהי הפתקים נקבעים כאן, לפני הצילום שבשורות הבאות, כדי שהצילום
     יישא אותם. אחרת הפתק היה נראה חדש בהשוואה הבאה ונשלח שוב. */
  plan.addN.forEach(x => { if(!x.note.id) x.note.id = newUuid(); });

  /* צילום העץ ברגע התכנון.
     הכתיבה אורכת זמן, והמשתמש יכול לשנות משהו בזמן הזה. אם נסמן
     בסוף את העץ *החי* כ"מה שהשרת מחזיק", השינוי הזה ייבלע לתוך
     קו הבסיס: ההשוואה הבאה לא תראה אותו, והוא לא יישלח לעולם —
     ויעלם ברענון הבא. הצילום מכיל בדיוק את מה שנשלח, ולכן כל מה
     שנעשה אחריו נשאר הפרש וייצא בסיבוב הבא. */
  const atPlan = {
    people: deepCopy(DB.people), unions: deepCopy(DB.unions),
    pending: deepCopy(pending), root: DB.root
  };

  syncing = true;
  setSyncState('saving');
  try {
    await runSync(plan, DB);
    SAVED = atPlan;
    syncFails = 0;
    setSyncState('saved');
    /* הטביעה בשרת זזה בגללנו. בלי לעדכן אותה כאן, הבדיקה הבאה
       הייתה מדווחת על "עדכון מבחוץ" שכלל לא היה. */
    await restamp();
  } catch(e){
    /* אסימון שפג אינו תקלת רשת: ניסיון רביעי לא יעזור, וצריך
       להחזיר את המשתמש למסך הכניסה במקום להשאיר נקודה אדומה. */
    if(e && e.auth){ onAuthLost(); return; }
    syncFails++;
    /* אחרי שלושה כשלונות ברצף מפסיקים לנסות לבד. תקלה שחוזרת
       לא תיפתר בניסיון רביעי, והלולאה רק מציפה את השרת ואת המסך. */
    if(syncFails >= 3) syncHalted = true;
    setSyncState('error', (e.stale
      ? 'מישהו עדכן את העץ בינתיים. רעננו כדי לקבל את המצב החדש'
      : (e.message || 'השמירה נכשלה')) + (syncHalted ? '. השמירה האוטומטית נעצרה' : ''));
  } finally {
    syncing = false;
    if(syncQueued){ syncQueued = false; scheduleSync(); }
  }
}

/* ---------- בקשות ממתינות ----------
   באפליקציה הסוג הוא הקשר עצמו (ילד, בן זוג, אח, הורה).
   במסד זה מפוצל לשניים: kind='add' והקשר בעמודה נפרדת,
   כדי שאפשר יהיה לבדוק אותו ברמת המסד ולא רק בקוד. */
const ADD_KINDS = ['child','spouse','sibling','parent'];

function reqToRow(r){
  const isAdd = ADD_KINDS.includes(r.kind);
  return {
    id: r.id,
    kind: isAdd ? 'add' : r.kind,
    relation: isAdd ? r.kind : null,
    anchor_id: isAdd ? (r.anchor || null) : null,
    target_id: isAdd ? null : (r.target || null),
    payload: r.kind === 'note' ? {text: r.text || ''} : (r.data || {}),
    submitted_by: r.by || null
  };
}

/* ---------- ניקוי בקשה שנכנסת מהשרת ----------
   העמודה payload היא jsonb בלי שום אילוץ, ובן משפחה עם סיסמת אורח
   רשאי לכתוב לטבלת הבקשות — זה מותר לו בכוונה, אחרת אי אפשר לשלוח
   בקשה. כלומר **כל** מה שמגיע בשדה הזה הוא נתון שאולי נשתל ביד.

   שתלו שם מבנה חסר, והפתיחה של תור הבקשות קרסה למסך לבן אצל המנהל.
   שתלו שם מחרוזת ארוכה במיוחד, והתור נתקע. שתלו שם כתובת תמונה
   מזויפת, והקוד של הזר רץ אצל המנהל.

   לכן כאן, בשער היחיד שבו הנתון הופך לבקשה באפליקציה, נשמרים רק
   השדות המוכרים, כל אחד כמחרוזת ובאורך חסום, והתמונות נבדקות.
   הבריחה ב-esc היא השכבה השנייה, לא הראשונה. */
/* רשימת השדות **נגזרת** מ-FIELDS ואינה משוכפלת ממנה. אחרת שדה
   חדש שיתווסף לטופס היה נזרק כאן בשקט, והבקשה הייתה מגיעה למנהל
   בלעדיו — בלי שום הודעה. שלושת השדות שאינם בטופס נוספים במפורש.
   (FIELDS מוגדר בהמשך הקובץ; הפונקציה נקראת רק בזמן ריצה.) */
const REQ_EXTRA = ['gender', 'photo', 'thumb'];
const reqKeys = () => REQ_EXTRA.concat(FIELDS.map(f => f.k));

/* תקרת אורך לפי שדה. 80 תווים לכל מה שלא רשום כאן. */
const REQ_CAP = {birth:10, death:10, phone:40, email:120, gender:6};
const capOf = k => REQ_CAP[k] || 80;

function cleanPayload(raw){
  const src = (raw && typeof raw === 'object' && !Array.isArray(raw)) ? raw : {};
  const out = {};
  reqKeys().forEach(k => {
    if(!(k in src)) return;
    const v = src[k];
    if(v == null || typeof v === 'object') return;
    if(k === 'photo' || k === 'thumb'){
      const ok = safeImg(v);                 // כתובת שאינה מוכרת נזרקת
      if(ok) out[k] = ok;
      return;
    }
    out[k] = String(v).slice(0, capOf(k));
  });
  /* השם מוצג כאות ראשונה בעיגול, ובלעדיו העיגול מפיל את כל המסך */
  if(typeof out.name !== 'string') out.name = '';
  if(typeof out.surname !== 'string') out.surname = '';
  if(out.gender !== 'male' && out.gender !== 'female') delete out.gender;
  return out;
}

function rowToReq(row){
  const base = {id: row.id, by: String(row.submitted_by || '').slice(0, 80),
                at: row.created_at, ver: row.updated_at};
  const pay = cleanPayload(row.payload);
  if(row.kind === 'add')
    return Object.assign(base, {kind: row.relation || 'child',
                                anchor: row.anchor_id, data: pay});
  if(row.kind === 'note')
    return Object.assign(base, {kind: 'note', target: row.target_id,
                                text: String((row.payload || {}).text || '').slice(0, 4000)});
  return Object.assign(base, {kind: 'edit', target: row.target_id, data: pay});
}

/* ---------- טעינת העץ ----------
   בונה בדיוק את אותו מבנה שהאפליקציה עובדת איתו היום,
   כדי שמנוע הפריסה והציור לא ישתנה כלל. */
async function loadTree(){
  /* השורש נשאל מהשרת ולא מהעותק השמור. בכניסה אוטומטית העותק
     הוא מלפני כניסה קודמת, ושורש שנקבע מאז לא היה מופיע בו —
     ואז האפליקציה הייתה שולחת אותו מחדש בכל טעינה. */
  const [people, unions, notes, fam, reqs] = await Promise.all([
    restAll('people',  'select=*'),
    restAll('unions',  'select=*'),
    restAll('notes',   'select=*'),
    rest('families','select=id,root_person_id&limit=1').catch(() => null),
    /* משתמש רגיל אינו רשאי לראות את התור, והשרת מחזיר לו ריק.
       זה תקין — הוא שולח בקשות אבל לא רואה אותן. */
    restAll('requests','select=*').catch(() => [])
  ]);
  const famRow = Array.isArray(fam) ? fam[0] : null;
  if(famRow){
    if(famRow.id) FAMILY_ID = famRow.id;
    FAMILY.rootId = famRow.root_person_id || null;
  }

  const P = {};
  people.forEach(r => {
    const p = {id: r.id, name: r.name, surname: r.surname || '', gender: r.gender};
    ['maiden','birth','death','city','phone','email'].forEach(k => { if(r[k]) p[k] = r[k]; });
    if(r.placeholder) p.placeholder = true;
    if(r.photo_path)  p.photoPath = r.photo_path;
    if(r.thumb_path)  p.thumbPath = r.thumb_path;
    p.ver = r.updated_at;                       // החותמת, לבדיקת גרסה בכתיבה
    P[r.id] = p;
  });

  const U = [], byId = {};
  unions.forEach(r => {
    const u = {
      id: r.id,
      partners: [r.partner_a, r.partner_b].filter(x => x && P[x]),
      children: [],
      status: r.status || 'married',
      ver: r.updated_at
    };
    byId[r.id] = u; U.push(u);
  });

  /* הילדים מגיעים מהעמודה parent_union שעל האדם, לא מטבלת קישור */
  people.forEach(r => { if(r.parent_union && byId[r.parent_union]) byId[r.parent_union].children.push(r.id); });

  /* הבכור ראשון במערך — וברשת ההפוכה הוא יוצא הימני ביותר */
  const yr = id => yearOfDate((P[id] || {}).birth) || 9999;
  U.forEach(u => u.children.sort((a, b) => yr(a) - yr(b)));

  /* הסיפורים מוצגים לפי סדר הכתיבה. השליפה מגיעה בעמודים ממוינים
     לפי מזהה, ולכן הסדר נקבע כאן ולא נשען על סדר התשובה מהשרת. */
  notes.slice()
    .sort((a, b) => String(a.created_at || '').localeCompare(String(b.created_at || '')))
    .forEach(n => {
      const p = P[n.person_id];
      if(!p) return;
      (p.notes = p.notes || []).push({id: n.id, text: n.text, by: n.author || ''});
    });

  /* שורש שהגיע מהשרת מול שורש שחושב כאן כברירת מחדל.
     ההבדל חשוב: אם חישבנו אותו בעצמנו, השרת עדיין לא יודע עליו
     וצריך לשלוח — אחרת העמודה תישאר ריקה לנצח. */
  const serverRoot = (FAMILY.rootId && P[FAMILY.rootId]) ? FAMILY.rootId : null;
  const root = serverRoot || (people.find(r => !r.parent_union) || people[0] || {}).id || null;

  /* תור הבקשות מוצג לפי סדר ההגשה — הוותיקה למעלה */
  const reqRows = (Array.isArray(reqs) ? reqs : []).slice()
    .sort((a, b) => String(a.created_at || '').localeCompare(String(b.created_at || '')));

  return {people: P, unions: U, root, serverRoot,
          requests: reqRows.map(rowToReq)};
}

/* ---------- תמונות ----------
   הדלי סגור. כל תמונה נדרשת בקישור חתום, והשרת חותם רק נתיבים
   של המשפחה שבאסימון. נשלפות הקטנות בלבד — הגדולה רק בלחיצה. */
const photoCache = {};

async function signPaths(paths){
  const need = paths.filter(p => p && !photoCache[p]);
  if(!need.length) return;
  for(let i = 0; i < need.length; i += 300){
    const slice = need.slice(i, i + 300);
    const r = await api('/functions/v1/photos', {
      method: 'POST', body: {action: 'sign', paths: slice}
    }).catch(() => null);
    if(r && r.urls) Object.assign(photoCache, r.urls);
  }
}

/* ממלא את p.thumb ו-p.photo בקישורים חתומים. שדות התצוגה לא השתנו,
   ולכן כל קוד הציור ממשיך לעבוד בלי שינוי. */
async function attachThumbs(db){
  const list = Object.values(db.people).map(p => p.thumbPath).filter(Boolean);
  await signPaths(list);
  Object.values(db.people).forEach(p => {
    if(p.thumbPath && photoCache[p.thumbPath]) p.thumb = photoCache[p.thumbPath];
  });
}
async function attachFullPhoto(p){
  if(!p || !p.photoPath) return;
  if(!photoCache[p.photoPath]) await signPaths([p.photoPath]);
  if(photoCache[p.photoPath]) p.photo = photoCache[p.photoPath];
}


/* העץ שבזיכרון. מוגדר כאן, מחוץ לאזור הדמה, כדי שמחיקת הדמה
   לא תשאיר את האפליקציה בלי מבנה נתונים. בייצור הוא נשאר ריק
   עד הכניסה, ואז נטען מהשרת. */
let DB = {people:{}, unions:[], root:null};
let DEMO_PAIR = null;


/* ============================================================
   מודול 2 — פריסה. מחשב רק את מי שגלוי כרגע.
   ============================================================ */
const CARD_W = 104, CARD_H = 132;
const SPOUSE_GAP    = 16;
const UNMARRIED_GAP = 52;
const SIB_GAP       = 26;
const BRANCH_STEP   = 30;
const LEVEL_H       = 214;

/* מצב הזוגיות: נשואים, גרושים, או בני זוג שלא נישאו.
   השדה הישן married נשמר לתאימות. */
const statusOf = u => u.status || (u.married === false ? 'partners' : 'married');
const STATUS_HE = {married:'נשואים', divorced:'גרושים', partners:'בני זוג', none:'ניתוק'};
const gapFor = u => (statusOf(u) === 'divorced' ? UNMARRIED_GAP : SPOUSE_GAP);

const pos = {}, gen = {}, META = {}, KEY = {};
let FLOATING = new Set();     // מפתחות ציור של מרחפים שמוצגים כרגע
let FLOAT_IDS = new Set();    // כל האנשים שאינם מחוברים לעץ

/* מי שמשתמש רגיל רשאי לראות: כולם חוץ ממרחפים */
const visibleToUser = id => isAdmin() || !FLOAT_IDS.has(id);
const visiblePeople = () => Object.values(DB.people).filter(p => visibleToUser(p.id));   // מפתחות הכרטיסים שאינם מחוברים לעץ
let BLOOD = new Set();      // מי מקבל מקום קבוע לפי קו הדם
const hostOf = {};          // אצל איזה בן זוג מוצגים הילדים של זוגיות משותפת

/* כשגם הבעל וגם האישה הם בני המשפחה, הזוגיות מצוירת בשני המקומות.
   הילדים תלויים רק אצל אחד מהם — זה ה"מארח" — ואפשר להעביר אותם
   לצד השני בלחיצה על הכפתור שם. */
function hostFor(u){
  if(u.partners.includes(DB.root)) return DB.root;   // הזוג המייסד קבוע
  const h = hostOf[u.id];
  if(h && u.partners.includes(h)) return h;
  return u.partners.find(p => BLOOD.has(p)) || u.partners[0];
}
let boardW = 0, boardH = 0;

const unionsOf = (id, db) => (db || DB).unions.filter(u => u.partners.includes(id));
const spouseIn = (u, id) => u.partners.find(p => p !== id);

/* אילו ענפים פרוסים. בהתחלה — רק הזוגיות של דור המייסדים,
   כך שרואים אותם ואת ילדיהם עם בני הזוג שלהם. */
const foundingU = () => DB.unions.find(u => u.partners.includes(DB.root));
const expanded = new Set();      // בפתיחה הכל סגור: רק הזוג המייסד
let savedExpanded = null;   // התצוגה האישית, נשמרת לפני פריסה מלאה

const hasKids    = u => u.children.length > 0;

/* כמה אנשים בסך הכל תלויים בזוגיות הזו — ילדים, בני זוגם,
   נכדים וכן הלאה עד סוף הענף. מחושב פעם אחת ונשמר. */
const SUB = {};
/* אוסף של כל מי שתלוי בזוגיות. חייב להיות אוסף ולא מונה,
   כי בנישואים בתוך המשפחה אותו אדם נגיע אליו משני מסלולים
   ואסור לספור אותו פעמיים. */
function subtreeSet(u){
  if(SUB[u.id]) return SUB[u.id];
  const s = new Set();
  SUB[u.id] = s;                       // הגנה מפני לולאה
  u.children.forEach(c => {
    s.add(c);
    unionsOf(c).slice(0, 2).forEach(cu => {
      const sp = spouseIn(cu, c);
      if(sp) s.add(sp);
      subtreeSet(cu).forEach(x => s.add(x));
    });
  });
  return s;
}
function subtreeCount(u){ return subtreeSet(u).size; }
const kidsOf     = u => (expanded.has(u.id) ? u.children : []);
const kidsShownAt = (u, id) => (expanded.has(u.id) && hostFor(u) === id) ? u.children : [];
const gapBetween = (a, b) => SIB_GAP + BRANCH_STEP * Math.max(META[a].h, META[b].h);

/* אחים מסודרים מהבכור לצעיר. הבכור בקצה הימני של המסך,
   ולכן הוא הראשון בסדר הלוגי (שמאל→ימין מתהפך בציור). */
/* ילד שאינו קיים ברשימת האנשים אינו אמור להופיע, אבל גיבוי ישן
   או נתון שנשבר במקום אחר יכולים להביא אותו — והמיון קרס עליו. */
const byAge = (a, b) =>
  (((DB.people[a] || {}).birth || '') < ((DB.people[b] || {}).birth || '') ? -1 : 1);

function rowMetrics(kids){
  const seq = kids.filter(id => DB.people[id]).sort(byAge);
  seq.forEach(measure);
  let B = 0; const centers = [];
  seq.forEach((k, i) => {
    if(i) B += gapBetween(seq[i-1], k);
    centers.push(B + META[k].off);
    B += META[k].w;
  });
  return {
    seq, B, centers,
    mL: seq.length ? (centers[0] + centers[centers.length-1]) / 2 : 0,
    h : seq.length ? 1 + Math.max(...seq.map(k => META[k].h)) : 0
  };
}

/* רשומת מידות ניטרלית, לכרטיס בודד בלי ענף מתחתיו */
const soloMetrics = () => ({us:[], rows:[], h:0, w:CARD_W,
                            off:CARD_W/2, anchor:CARD_W/2, half:0});

function measure(id){
  if(META[id]) return META[id];
  if(!DB.people[id]) return (META[id] = soloMetrics());
  /* סימון "בעבודה" לפני הירידה פנימה.
     המטמון נכתב עד כה רק בסוף, ולכן עץ שיש בו מעגל — אדם שרשום
     כצאצא של עצמו, או אדם שהוא גם בן זוג וגם ילד באותה זוגיות —
     גרם לרקורסיה בלי סוף, והמסך כולו מת בלי דרך להתאושש.
     הנתונים האלה לא אמורים להיווצר, אבל הציור חייב לשרוד אותם. */
  META[id] = soloMetrics();
  // בן/בת הזוג מופיעים רק אחרי שפותחים את הענף
  /* הזוגיות מצוירת רק בצד שמארח אותה. בצד השני של קשר פנימי
     נשאר רק כפתור עם המספר, ולחיצה עליו מעבירה את הכל לשם.
     הזוג המייסד הוא היוצא מהכלל — הוא תמיד מוצג יחד. */
  const us = unionsOf(id).slice(0, 2).filter(u =>
    (expanded.has(u.id) && hostFor(u) === id) ||
    (id === DB.root && u.partners.includes(DB.root)));
  const m = {us, rows: us.map(u => rowMetrics(hostFor(u) === id ? kidsOf(u) : []))};
  m.h = m.rows.length ? Math.max(0, ...m.rows.map(r => r.h)) : 0;

  if(us.length === 0){
    m.w = CARD_W; m.off = CARD_W/2; m.anchor = CARD_W/2;
  }
  else if(us.length === 1){
    const r = m.rows[0], g = gapFor(us[0]);
    // הורה יחיד — בלי בן/בת זוג הכרטיס יושב לבד על ציר הזוגיות
    const solo  = !spouseIn(us[0], id);
    const half  = solo ? 0        : (CARD_W + g)/2;
    const pHalf = solo ? CARD_W/2 : CARD_W + g/2;
    m.half = half;
    const L = r.B ? Math.max(pHalf, r.mL)       : pHalf;
    const R = r.B ? Math.max(pHalf, r.B - r.mL) : pHalf;
    m.w = L + R; m.anchor = L; m.off = L - half;
  }
  else {
    const r1 = m.rows[0], r2 = m.rows[1];
    let st1 = CARD_W + gapFor(us[0]), st2 = CARD_W + gapFor(us[1]);
    if(r1.B && r2.B){
      const need  = (r1.B - r1.mL) + r2.mL + SIB_GAP;
      const extra = 2 * (need - (st1 + st2)/2);
      if(extra > 0){
        const free1 = us[0].married === false, free2 = us[1].married === false;
        if(free1 && !free2)      st1 += extra;
        else if(free2 && !free1) st2 += extra;
        else { st1 += extra/2; st2 += extra/2; }
      }
    }
    const s1 = -st1/2 - r1.mL, s2 = st2/2 - r2.mL;
    const lefts = [-st1 - CARD_W/2], rights = [st2 + CARD_W/2];
    if(r1.B){ lefts.push(s1); rights.push(s1 + r1.B); }
    if(r2.B){ lefts.push(s2); rights.push(s2 + r2.B); }
    m.st1 = st1; m.st2 = st2; m.s1 = s1; m.s2 = s2;
    m.off = -Math.min(...lefts);
    m.w = m.off + Math.max(...rights);
    m.anchor = m.off;
  }
  META[id] = m;
  return m;
}

/* שרשרת האבות שבה אנחנו נמצאים כרגע. היא קיימת רק כדי לעצור
   מעגל: אדם שרשום כצאצא של עצמו גרם לרקורסיה בלי סוף, והמסך כולו
   מת. עומק אמיתי, אפילו מאות דורות, אינו מוגבל בשום צורה. */
const placing = new Set();

function place(id, depth, left){
  const m = META[id];
  if(!m) return;
  const y = depth * LEVEL_H;
  if(placing.has(id)){            // מעגל — מציירים את הכרטיס ולא יורדים
    pos[id] = pos[id] || {x: left + (m.off || 0) - CARD_W/2, y};
    gen[id] = depth; KEY[id] = id;
    return;
  }
  placing.add(id);
  try { placeInner(id, depth, left, m, y); }
  finally { placing.delete(id); }
}

function placeInner(id, depth, left, m, y){
  /* מי שכבר יש לו מקום בקו הדם מצויר כאן ככפיל, במפתח נפרד */
  // מי שכבר מצויר, או שייך לקו הדם, מקבל כאן כפיל — כדי לא לדרוס את מקומו
  const keyFor = (u, pid) => (u && (BLOOD.has(pid) || pos[pid])) ? 'g:' + u.id + ':' + pid : pid;
  const put = (key, pid, c) => {
    if(!pid) return null;
    pos[key] = {x: c - CARD_W/2, y}; gen[key] = depth; KEY[key] = pid;
    return key;
  };

  if(m.us.length === 0){ put(id, id, left + m.off); return; }

  if(m.us.length === 1){
    const u = m.us[0], sp = spouseIn(u, id);
    const half = m.half;
    const mid = left + m.anchor;
    u._occ.push({a: put(id, id, mid - half), b: put(keyFor(u, sp), sp, mid + half),
                 host: hostFor(u) === id, side: id});
    placeRow(m.rows[0], depth+1, mid - m.rows[0].mL);
  } else {
    const P = left + m.off;
    const u1 = m.us[0], u2 = m.us[1];
    const s1 = spouseIn(u1, id), s2 = spouseIn(u2, id);
    put(id, id, P);
    u1._occ.push({a: id, b: put(keyFor(u1, s1), s1, P - m.st1), host: hostFor(u1) === id, side: id});
    u2._occ.push({a: id, b: put(keyFor(u2, s2), s2, P + m.st2), host: hostFor(u2) === id, side: id});
    placeRow(m.rows[0], depth+1, P + m.s1);
    placeRow(m.rows[1], depth+1, P + m.s2);
  }
}

function placeRow(r, depth, L){
  let x = L;
  r.seq.forEach((k, i) => {
    if(i) x += gapBetween(r.seq[i-1], k);
    place(k, depth, x);
    x += META[k].w;
  });
}

/* עומק העץ כולו, בלי קשר למה שפרוס כרגע על המסך */
function totalDepth(){
  const seen = new Set();
  const walk = (id, d) => {
    if(!id || seen.has(id)) return d;
    seen.add(id);
    let deep = d;
    unionsOf(id).slice(0, 2).forEach(u =>
      u.children.forEach(c => { deep = Math.max(deep, walk(c, d + 1)); }));
    return deep;
  };
  return walk(DB.root, 0) + 1;
}

/* קו הדם: השורש וכל מי שהוא ילד של זוגיות פרוסה.
   אלה מקבלים מקום קבוע. מי שמתחתן פנימה מצויר לידם. */
function computeBlood(){
  const s = new Set([DB.root]);
  const walk = id => {
    unionsOf(id).slice(0, 2).forEach(u => {
      if(!expanded.has(u.id)) return;
      u.children.forEach(c => { if(!s.has(c)){ s.add(c); walk(c); } });
    });
  };
  walk(DB.root);
  return s;
}

const FLOAT_GAP = 150;   // מרחק בין אזור המרחפים לעץ

/* מי נגיש מהשורש — בלי קשר למה שפרוס כרגע.
   מי שלא נגיש הוא "מרחף": קיים בנתונים ואין לו מקום בעץ. */
function reachableFromRoot(db){
  /* db אופציונלי: מאפשר לבדוק נגישות על מסד נתונים מדומה,
     למשל כדי להציג בדוח הייבוא מי ירחף אחרי המיזוג. */
  const D = db || DB;
  /* שני אוספים נפרדים, בכוונה:
     seen   — מי שנגיש (כולל בני זוג שנפגשו בדרך)
     walked — מי שכבר עברנו על הזוגיות שלו
     אם היינו משתמשים באוסף אחד, מי שנפגש קודם כבן זוג ואחר כך כילד
     לא היה נבדק לעולם, והזוגיות השנייה שלו הייתה נשכחת. */
  const seen = new Set(), walked = new Set();
  const walk = id => {
    if(!id || walked.has(id) || !D.people[id]) return;
    walked.add(id); seen.add(id);
    unionsOf(id, D).forEach(u => {
      u.partners.forEach(x => { if(D.people[x]) seen.add(x); });
      u.children.forEach(walk);
    });
  };
  walk(D.root);
  return seen;
}

const PAD = 60;

function layout(){
  for(const k in pos)  delete pos[k];
  for(const k in gen)  delete gen[k];
  for(const k in META) delete META[k];
  for(const k in KEY)  delete KEY[k];
  DB.unions.forEach(u => { u._occ = []; });
  BLOOD = computeBlood();

  measure(DB.root);
  place(DB.root, 0, 0);

  /* אזור המרחפים: מי שאינו נגיש מהשורש מצויר מעל העץ.
     כל מרחף נפרס כענף משלו, כדי שצאצאיו יישארו איתו. */
  const mainKeys = new Set(Object.keys(pos));
  const reach = reachableFromRoot();
  // כל מי שלא נגיש מהשורש — כולל צאצאים של מרחפים
  FLOAT_IDS = new Set(Object.keys(DB.people).filter(id => !reach.has(id)));
  const floatRoots = Object.keys(DB.people)
    .filter(id => !reach.has(id) && !parentUnionOf(id));
  FLOATING = new Set();
  // אזור המרחפים הוא כלי עבודה של המנהל. משתמש רגיל לא רואה אותו.
  if(floatRoots.length && isAdmin()){
    let fx = 0, deepest = 0;
    floatRoots.forEach(id => {
      measure(id);
      place(id, 0, fx);
      fx += META[id].w + SIB_GAP * 3;
    });
    Object.keys(pos).forEach(k => {
      if(mainKeys.has(k)) return;
      FLOATING.add(k);
      deepest = Math.max(deepest, pos[k].y);
    });
    const lift = deepest + CARD_H + FLOAT_GAP;
    FLOATING.forEach(k => { pos[k].y -= lift; });
  }

  const xs = Object.values(pos).map(p => p.x), ys = Object.values(pos).map(p => p.y);
  /* עץ ריק: Math.max על רשימה ריקה מחזיר מינוס אינסוף, והלוח היה
     מקבל רוחב וגובה פסולים. הדפדפן דחה אותם והדפיס שגיאה —
     בדיוק במסך הראשון שמשפחה חדשה רואה. */
  if(!xs.length){ boardW = CARD_W + PAD * 2; boardH = CARD_H + PAD * 2; return; }
  const minX = Math.min(...xs), minY = Math.min(...ys);
  Object.values(pos).forEach(p => { p.x += PAD - minX; p.y += PAD - minY; });
  boardW = Math.max(...Object.values(pos).map(p => p.x)) + CARD_W + PAD;
  boardH = Math.max(...Object.values(pos).map(p => p.y)) + CARD_H + PAD;
}

/* ============================================================
   מודול 3 — ציור
   ============================================================ */
const svg     = document.getElementById('links');
const nodesEl = document.getElementById('nodes');
const canvas  = document.getElementById('canvas');
const NS = 'http://www.w3.org/2000/svg';

/* עובדים במערכת צירים לוגית משמאל לימין, ומהפכים כאן ל-RTL */
const RX = x => boardW - x - CARD_W;
const cx = id => RX(pos[id].x) + CARD_W/2;

function line(x1,y1,x2,y2){
  const l = document.createElementNS(NS,'line');
  l.setAttribute('x1',x1); l.setAttribute('y1',y1);
  l.setAttribute('x2',x2); l.setAttribute('y2',y2);
  l.setAttribute('stroke','var(--link)');
  l.setAttribute('stroke-width','2.5');
  l.setAttribute('stroke-linecap','round');
  svg.appendChild(l);
}

function drawLinks(){
  DB.unions.forEach(u => u._occ.forEach(oc => {
    const a = oc.a, b = oc.b;
    if(!a || !pos[a]) return;
    const y = pos[a].y + CARD_H/2;
    const midX = b ? (cx(a) + cx(b))/2 : cx(a);
    let dropFrom = b ? y : pos[a].y + CARD_H;

    const st = statusOf(u);
    if(!b){
      /* הורה יחיד — הקו יורד ישר מתחתית הכרטיס */
    } else if(st === 'divorced'){
      /* גרושים: הקו יוצא מהצדדים, יורד, ורק אז מתחבר.
         נשואים ובני זוג נראים זהה — קו ישר. */
      const xl = Math.min(cx(a), cx(b)) + CARD_W/2;
      const xr = Math.max(cx(a), cx(b)) - CARD_W/2;
      const dipY = y + 36, STUB = 12;
      line(xl, y, xl + STUB, y);
      line(xl + STUB, y, xl + STUB, dipY);
      line(xl + STUB, dipY, xr - STUB, dipY);
      line(xr - STUB, dipY, xr - STUB, y);
      line(xr - STUB, y, xr, y);
      dropFrom = dipY;
    } else {
      line(cx(a), y, cx(b), y);
    }

    const kids = (oc.host ? kidsOf(u) : []).filter(k => pos[k]);
    if(!kids.length) return;

    const busY  = pos[a].y + CARD_H + (LEVEL_H - CARD_H)/2;
    const kidXs = kids.map(cx);
    const busC  = (Math.min(...kidXs) + Math.max(...kidXs)) / 2;

    if(Math.abs(busC - midX) < 1){
      line(midX, dropFrom, midX, busY);
    } else {
      const elbowY = busY - 26;
      line(midX, dropFrom, midX, elbowY);
      line(midX, elbowY, busC, elbowY);
      line(busC, elbowY, busC, busY);
    }
    line(Math.min(...kidXs), busY, Math.max(...kidXs), busY);
    kids.forEach(k => line(cx(k), busY, cx(k), pos[k].y));
  }));
}

function buildNode(key){
  const p = DB.people[KEY[key]];
  if(!p) return;
  const isGhost = key !== p.id;
  const el = document.createElement('div');
  el.className = 'node' + (isGhost ? ' ghost' : '');
  el.dataset.id = p.id;
  el.dataset.key = key;
  el.dataset.gender = p.gender;
  el.dataset.gen = Math.min(gen[key], 6);
  if(p.placeholder) el.dataset.ph = '1';
  if(FLOATING.has(key)) el.dataset.float = '1';
  el.style.left = RX(pos[key].x) + 'px';
  el.style.top  = pos[key].y + 'px';
  el.innerHTML =
    (isGhost ? '<span class="mirror" title="מופיע/ה גם במקום אחר בעץ">⧉</span>' : '') +
    (FLOATING.has(key) ? '<span class="floatmark" title="לא מחובר/ת לעץ">!</span>' : '') +
    '<div class="face">' + avatarInner(p) + '</div>' +
    '<div class="sexline"></div>' +
    '<div class="name"><span>' + esc(p.name) + '</span></div>';
  nodesEl.appendChild(el);
}

/* כפתור פתיחה/סגירה מתחת לכל זוגיות שיש לה ילדים */
function buildToggles(){
  DB.unions.forEach(u => {
    /* הצד המארח מקבל כפתור מההופעה המצוירת.
       בן משפחה שהזוגיות שלו מצוירת בענף השני מקבל כפתור נפרד,
       שמעביר אליו את הענף. בן זוג שנישא פנימה לא מקבל כפתור משלו. */
    const occ = (u._occ || []).slice();
    const covered = new Set(occ.map(o => o.side));
    u.partners.forEach(p => {
      if(pos[p] && !covered.has(p) && BLOOD.has(p))
        occ.push({a:p, b:null, host:false, side:p});
    });
    occ.forEach(oc => {
    const anchor = oc.a, other = (oc.b && pos[oc.b]) ? oc.b : null;
    if(!anchor || !pos[anchor]) return;

    const open = expanded.has(u.id);
    // בזוגיות בלי ילדים אין "צד מארח", ולכן שני הצדדים סוגרים
    const shown = open && (oc.host || !u.children.length);
    const sp = spouseIn(u, oc.side);
    const set = subtreeSet(u);
    const total = set.size + (sp && !set.has(sp) ? 1 : 0);
    if(!total && open) return;              // אין מה לפתוח ואין מה לסגור

    const btn = document.createElement('button');
    btn.className = 'toggle' + (shown ? ' open' : '') + (open && !shown ? ' moved' : '');
    btn.dataset.union = u.id;
    btn.dataset.side  = oc.side;
    btn.textContent = shown ? '▴' : (total ? String(total) : '+');
    btn.title = shown ? 'סגירת הענף'
              : open  ? 'העברת הילדים לצד הזה'
              : 'פתיחת ענף של ' + plural(total, 'בן משפחה אחד', 'בני משפחה');

    const baseX = other ? (cx(anchor) + cx(other))/2 : cx(anchor);
    btn.style.left = (baseX - 13) + 'px';
    btn.style.top  = (pos[anchor].y + CARD_H + 8) + 'px';
    nodesEl.appendChild(btn);
    });
  });
}

function render(){
  /* כל ציור מחדש הוא סימן שמשהו אולי השתנה. הבדיקה עצמה זולה
     כשאין הפרש, ולכן אפשר לקרוא לה כאן בלי לחשוש. */
  if(typeof scheduleSync === 'function') scheduleSync();
  if(typeof syncEmptyState === 'function') syncEmptyState();
  cancelPress();      // ביטול לחיצה ארוכה שרצה על כרטיס שעומד להימחק
  closeRing();
  svg.innerHTML = '';
  nodesEl.innerHTML = '';
  ringOwner = null;
  svg.setAttribute('width', boardW);
  svg.setAttribute('height', boardH);
  svg.setAttribute('viewBox', '0 0 ' + boardW + ' ' + boardH);
  canvas.style.width  = boardW + 'px';
  canvas.style.height = boardH + 'px';
  drawLinks();
  Object.keys(pos).forEach(buildNode);
  buildToggles();
  const allK = DB.unions;
  document.getElementById('btnAll').textContent =
    (allK.length && allK.every(u => expanded.has(u.id))) ? 'חזרה לתצוגה שלך' : 'פריסה מלאה';
  const fam = (DB.people[DB.root] || {}).surname || '';
  document.getElementById('brand').textContent =
    FAMILY.name || (fam ? 'משפחת ' + fam : 'אילן היוחסין');
  /* גודל המשפחה כולה, ולא מה שפרוס כרגע על המסך — אבל לפי מה
     שהתפקיד רשאי לראות: אורח אינו רואה את המרחפים, ולכן הם גם
     לא נספרים אצלו. ובעץ ריק אין דורות בכלל — קודם היה כתוב
     שם "1 דורות". */
  const nPeople = visiblePeople().length;
  document.getElementById('brandSub').textContent = !nPeople ? ''
    : plural(totalDepth(), 'דור אחד', 'דורות') + ' · ' +
      plural(nPeople, 'בן משפחה אחד', 'בני משפחה');
}

/* פותח בעץ רק את הענפים שדרושים כדי להגיע לאדם מסוים,
   בלי לפרוס שום דבר נוסף מסביבו */
function revealTo(id){
  if(pos[id]) return false;
  const seen = new Set();
  const walk = (pid, d) => {
    if(!pid || seen.has(pid) || d > 60) return;
    seen.add(pid);
    if(pid === DB.root) return;
    const par = DB.unions.find(x => x.children.includes(pid));
    if(par){
      expanded.add(par.id);
      par.partners.forEach(p => walk(p, d + 1));
      return;
    }
    const mar = unionsOf(pid)[0];          // נכנס/ה למשפחה דרך נישואים
    if(mar){ expanded.add(mar.id); walk(spouseIn(mar, pid), d + 1); }
  };
  walk(id, 0);
  layout(); render();
  return true;
}

/* ממסגר קבוצת אנשים במרכז המסך.
   הזום נשאר כמו שהוא, ומתרחק רק אם הקבוצה לא נכנסת. אף פעם לא מתקרב. */
function frameOn(ids){
  const list = ids.filter(i => pos[i]);
  if(!list.length) return;
  const xs = list.map(i => RX(pos[i].x)), ys = list.map(i => pos[i].y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs) + CARD_W;
  const y0 = Math.min(...ys), y1 = Math.max(...ys) + CARD_H;

  const top = 96, bottom = innerHeight - 80;
  const availW = Math.max(120, innerWidth - 40);
  const availH = Math.max(120, bottom - top);

  scale = Math.max(MIN_S, Math.min(scale, availW/(x1-x0), availH/(y1-y0)));
  tx = innerWidth/2   - ((x0+x1)/2) * scale;
  ty = (top+bottom)/2 - ((y0+y1)/2) * scale;

  canvas.style.transition = 'transform .4s cubic-bezier(.3,.7,0,1)';
  apply();
  setTimeout(() => canvas.style.transition = 'none', 420);
}

/* מיקום על המסך של אדם, לצורך שמירת נקודת עוגן */
const screenOf = id => ({x: RX(pos[id].x)*scale + tx, y: pos[id].y*scale + ty});

/* פורס או סוגר ענף, ומשאיר את נקודת העוגן במקומה על המסך */
function toggleUnion(uid, side){
  const u = DB.unions.find(x => x.id === uid);
  if(!u) return;
  side = (side && u.partners.includes(side)) ? side : hostFor(u);

  const anchor = u.partners.find(p => pos[p]) || side;
  const before = pos[anchor] ? screenOf(anchor) : null;

  let opening;
  if(!expanded.has(uid)){            // סגור — פותחים בצד שנלחץ
    expanded.add(uid); hostOf[uid] = side; opening = true;
  } else if(u.children.length && hostFor(u) !== side){   // פתוח בצד השני — מעבירים לכאן
    hostOf[uid] = side; opening = true;
  } else {                           // פתוח כאן — סוגרים, וזוכרים מה היה בפנים
    expanded.delete(uid); opening = false;
  }

  closeRing(); closeSheet();
  layout(); render();

  if(opening){
    // ממסגרים את מה שצויר כאן בפועל, לא את המיקום המקורי של בן הזוג
    const oc = (u._occ || []).find(o => o.side === hostFor(u)) || (u._occ || [])[0];
    frameOn(oc ? [oc.a, oc.b, ...u.children].filter(Boolean)
               : [...u.partners, ...u.children]);
  }
  else if(before && pos[anchor]){
    const after = screenOf(anchor);
    tx += before.x - after.x;
    ty += before.y - after.y;
    apply();
  }
}

/* טבעת כפתורי ההוספה. נוצרת כאן, לפני מודול 4, כי apply() מתייחסת אליה */
const ring = document.createElement('div');
ring.className = 'ring';
ring.innerHTML = `
  <button class="act act-top"    data-act="parent">+<span class="lbl">הורה</span></button>
  <button class="act act-end"    data-act="sibling">+<span class="lbl">אח/ות</span></button>
  <button class="act act-start"  data-act="spouse">+<span class="lbl">בן/בת זוג</span></button>
  <button class="act act-bottom" data-act="child">+<span class="lbl">ילד/ה</span></button>`;

/* ============================================================
   מודול 4 — הזזה, זום, ומרכוז
   ============================================================ */
const viewport = document.getElementById('viewport');
let scale = 1, tx = 0, ty = 0;
let panFromBg = true;   // גרירה מותרת רק אם האצבע ירדה על הרקע
const MIN_S = .05, MAX_S = 2.2;

function apply(){
  canvas.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
}

function center(animate){
  scale = Math.min(1, (innerWidth - 32) / boardW);
  if(scale < MIN_S) scale = MIN_S;
  tx = (innerWidth - boardW*scale)/2;
  ty = 90;
  canvas.style.transition = animate ? 'transform .4s cubic-bezier(.3,.7,0,1)' : 'none';
  apply();
  if(animate) setTimeout(()=>canvas.style.transition='none', 420);
}

const pointers = new Map();
let lastMid = null, lastDist = 0;

viewport.addEventListener('pointerdown', e => {
  if(e.target.closest('.act, .toggle')) return;          // כפתורי ההוספה מטפלים בעצמם
  if(pointers.size === 0) panFromBg = !e.target.closest('.node');
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  viewport.classList.add('grabbing');
  if(pointers.size === 2){ initPinch(); cancelPress(); }
});

addEventListener('pointermove', e => {
  if(!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if(pointers.size === 1){
    if(!panFromBg) return;        // אצבע שירדה על כרטיס לא מזיזה את המפה
    tx += (e.clientX - prev.x);
    ty += (e.clientY - prev.y);
    apply();
  } else if(pointers.size === 2){
    const {mid, dist} = pinchState();
    const next = Math.max(MIN_S, Math.min(MAX_S, scale * (dist / lastDist)));
    const k = next / scale;
    // הנקודה שבין שתי האצבעות נשארת מתחתן על המסך
    tx = mid.x*(1-k) + tx*k;
    ty = mid.y*(1-k) + ty*k;
    scale = next;
    lastDist = dist; lastMid = mid;
    apply();
  }
});

['pointerup','pointercancel'].forEach(ev =>
  addEventListener(ev, e => {
    pointers.delete(e.pointerId);
    if(pointers.size < 2) lastDist = 0;
    if(pointers.size === 2) initPinch();
    if(!pointers.size) viewport.classList.remove('grabbing');
  })
);

function pinchState(){
  const [a,b] = [...pointers.values()];
  return {
    mid : {x:(a.x+b.x)/2, y:(a.y+b.y)/2},
    dist: Math.hypot(a.x-b.x, a.y-b.y)
  };
}
function initPinch(){ const s = pinchState(); lastDist = s.dist || 1; lastMid = s.mid; }

// גלגלת עכבר (לבדיקה בדסקטופ)
viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const next = Math.max(MIN_S, Math.min(MAX_S, scale * (e.deltaY < 0 ? 1.12 : .89)));
  const k = next/scale;
  tx = e.clientX*(1-k) + tx*k;
  ty = e.clientY*(1-k) + ty*k;
  scale = next; apply();
}, {passive:false});

document.getElementById('btnCenter').onclick = () => { closeMore(); closeRing(); center(true); };

/* ============================================================
   מודול 5 — לחיצה קצרה / לחיצה ארוכה
   קצרה  → פרופיל
   ארוכה → טבעת כפתורי הוספה
   ============================================================ */
const LONG_MS = 1200, MOVE_TOL = 12;
let timer = null, startPt = null, pressed = null, longFired = false, moved = false;

nodesEl.addEventListener('pointerdown', e => {
  const card = e.target.closest('.node');
  if(!card) return;
  pressed = card; longFired = false; moved = false;
  startPt = {x:e.clientX, y:e.clientY};
  card.classList.add('pressing');
  card.style.setProperty('--hold', (LONG_MS - 250) + 'ms');
  timer = setTimeout(() => {
    longFired = true;
    card.classList.remove('pressing');
    if(navigator.vibrate) navigator.vibrate(18);
    openRing(card);
  }, LONG_MS);
});

addEventListener('pointermove', e => {
  if(!pressed || !startPt) return;
  // כל תזוזה משמעותית הופכת את המחווה לגרירה: לא ייפתח כלום בשחרור
  if(Math.hypot(e.clientX-startPt.x, e.clientY-startPt.y) > MOVE_TOL){ moved = true; stopHold(); }
});

addEventListener('pointerup', e => {
  if(!pressed) return;
  const card = pressed, fired = longFired;
  const sameCard = e.target.closest && e.target.closest('.node') === card;
  const dragged = moved;
  cancelPress();
  // נפתח רק בנגיעה נקייה: בלי תזוזה, ובשחרור על אותו כרטיס
  if(!fired && !dragged && sameCard){ closeRing(); openSheet(card.dataset.id); }
});
addEventListener('pointercancel', cancelPress);

/* אירוע click הוא האות האמין ביותר לנגיעה קצרה בכל דפדפן.
   הוא רץ במקביל ל-pointerup; פתיחה כפולה נחסמת בתוך openSheet. */
nodesEl.addEventListener('click', e => {
  const card = e.target.closest('.node');
  if(!card || longFired || moved) return;
  closeRing();
  openSheet(card.dataset.id);
});

function stopHold(){
  clearTimeout(timer);
  if(pressed) pressed.classList.remove('pressing');
}
function cancelPress(){
  stopHold();
  pressed = null; startPt = null;
}

/* --- פתיחה וסגירה של טבעת הפעולות (הכפתורים עצמם נוצרו למעלה) --- */
let ringOwner = null;

function openRing(card){
  closeRing();
  const id = card && card.dataset ? card.dataset.id : null;
  const key = (card && card.dataset && card.dataset.key) || id;
  if(!id || !pos[key]) return;       // הכרטיס כבר לא מוצג בעץ
  ringOwner = id;
  /* מי שנישא לתוך המשפחה אינו קרוב דם: הוריו, אחיו ובני זוג
     אחרים שלו שייכים למשפחה אחרת ואין להם מקום בעץ הזה.
     הדבר היחיד שאפשר לרשום לו כאן הוא ילד משותף. */
  const par = DB.unions.find(x => x.children.includes(id));
  const inLine = !!par || id === DB.root;
  const q = s => ring.querySelector(s);
  const top = q('.act-top'), sib = q('.act-end'), sp = q('.act-start');
  if(top) top.hidden = !inLine || (par && par.partners.length >= 2);

  ring.style.left = RX(pos[key].x) + 'px';
  ring.style.top = pos[key].y + 'px';
  nodesEl.appendChild(ring);

/* ============================================================
   מודול 6 — חלון הפרופיל התחתון
   ============================================================ */
const sheet = document.getElementById('sheet');
const sheetBody = document.getElementById('sheetBody');
const scrim = document.getElementById('scrim');
let openId = null;

const HE_MONTHS = ['בינואר','בפברואר','במרץ','באפריל','במאי','ביוני',
                   'ביולי','באוגוסט','בספטמבר','באוקטובר','בנובמבר','בדצמבר'];
/* מוגן בכוונה: תאריך פגום יכול להגיע מגיבוי ישן או מבקשה שאושרה
   לפני שהבדיקה הוחמרה. עד שההגנה נוספה, חודש 13 הפיל את כל
   הכרטיס — ולא רק את שורת התאריך. */
function fmtDate(iso){
  if(!iso) return '';
  const raw = String(iso);
  const p = raw.split('-').map(Number);
  if(p.some(n => !isFinite(n))) return raw;
  const month = p[1] >= 1 && p[1] <= 12 ? HE_MONTHS[p[1] - 1] : null;
  if(p.length === 1) return raw.slice(0, 4);                    // שנה בלבד
  if(!month) return raw;                                        // חודש בלתי אפשרי — מוצג כפי שהוא
  if(p.length === 2) return month.replace(/^ב/, '') + ' ' + p[0];
  return p[2] + ' ' + month + ' ' + p[0];
}
function ageNum(p){
  if(!p.birth) return '';
  if(!isFullDate(p.birth)){                       // ידועה רק שנה
    const end = p.death ? yearOfDate(p.death) : new Date().getFullYear();
    return 'בערך ' + (end - yearOfDate(p.birth));
  }
  /* 'YYYY-MM-DD' נקרא כחצות לפי שעון גריניץ', ו-new Date() הוא
     שעון מקומי. בהפרש שלילי מגריניץ' התאריך יצא קטן ביום, והגיל
     קפץ בשנה ביום ההולדת עצמו. שני הצדדים נבנים כאן מקומית. */
  const asLocal = iso => {
    const [yy, mm, dd] = String(iso).split('-').map(Number);
    return new Date(yy, (mm || 1) - 1, dd || 1);
  };
  const end = p.death ? asLocal(dateMin(p.death)) : new Date();
  const b = asLocal(p.birth);
  let a = end.getFullYear() - b.getFullYear();
  const md = (end.getMonth() - b.getMonth()) || (end.getDate() - b.getDate());
  if(md < 0) a--;
  return String(a);
}

/* תגית הגיל בכרטיס. ageNum מחזיר גם "בערך 71" כשידועה רק שנה,
   ולכן המילה נשלפת החוצה — "בן 71 בערך" ולא "בן בערך 71". */
function ageChip(p){
  const raw = ageNum(p);
  if(!raw) return '';
  const m = p.gender === 'male';
  const about = raw.indexOf('בערך ') === 0;
  const n = about ? raw.slice(5) : raw;
  const head = p.death ? (m ? 'נפטר בגיל ' : 'נפטרה בגיל ') : (m ? 'בן ' : 'בת ');
  return head + n + (about ? ' בערך' : '');
}

/* הפתקים כדף מחברת אחד. שתי המילים הראשונות מודגשות כדי שהעין
   תמצא איפה כל פתק מתחיל — שורה ריקה לבדה לא מספיקה כשהטקסט
   יושב על אותם קווים. */
function noteLines(n){
  const t = String(n.text || '').trim();
  const m = t.match(/^(\S+(?:\s+\S+)?)([\s\S]*)$/);
  const head = m ? m[1] : t, tail = m ? m[2] : '';
  return '<p class="nb-text"><b>' + esc(head) + '</b>' + esc(tail) + '</p>' +
         (n.by ? '<p class="nb-by">— ' + esc(n.by) + '</p>' : '');
}
const notebookHTML = list =>
  '<div class="notebook">' +
  list.map(noteLines).join('<div class="nb-gap"></div>') +
  '</div>';
/* ספירת קרבות. הכל נגזר מהקישורים הקיימים — אין נתון שמור.
   האוספים ייחודיים, כי בנישואים בתוך המשפחה אותו אדם
   נגיש משני מסלולים ואסור לספור אותו פעמיים. */
function kinStats(id){
  const parentU = p => DB.unions.find(u => u.children.includes(p));
  const kidsOf  = p => unionsOf(p).flatMap(u => u.children);
  const drop = (set, other) => { other.forEach(x => set.delete(x)); return set; };

  const children = new Set(kidsOf(id));
  const grand    = new Set([...children].flatMap(kidsOf));

  const pu      = parentU(id);
  const parents = pu ? pu.partners.filter(p => DB.people[p]) : [];
  const sibs    = new Set((pu ? pu.children : []).filter(x => x !== id));
  const nephews = new Set([...sibs].flatMap(kidsOf));

  // דודים = אחי ההורים. בני דודים = הילדים שלהם.
  const uncles = new Set(parents.flatMap(p => {
    const gu = parentU(p);
    return gu ? gu.children.filter(x => x !== p) : [];
  }));
  const cousins = drop(new Set([...uncles].flatMap(kidsOf)), sibs);
  cousins.delete(id);

  /* בני דודים שניים: חולקים סבא רבא אך לא סבא.
     סבים ← אחיהם ← ילדיהם (בני דודי ההורים) ← ילדיהם.
     מוציאים אחים ובני דודים רגילים, שמגיעים באותו מסלול. */
  const grandparents = new Set(parents.flatMap(p => {
    const gu = parentU(p);
    return gu ? gu.partners.filter(x => DB.people[x]) : [];
  }));
  const grandUncles = new Set([...grandparents].flatMap(g => {
    const ggu = parentU(g);
    return ggu ? ggu.children.filter(x => x !== g) : [];
  }));
  const parentCousins = new Set([...grandUncles].flatMap(kidsOf));
  const second = new Set([...parentCousins].flatMap(kidsOf));
  second.delete(id);
  drop(second, sibs); drop(second, cousins);

  return {children:children.size, grand:grand.size, sibs:sibs.size,
          nephews:nephews.size, cousins:cousins.size, second:second.size};
}

/* שורת הסטטיסטיקה. מספר אפס לא מוצג, וכשאין כלום — אין גם חץ. */
function statsRowHTML(id){
  const k = kinStats(id), parts = [];
  const add = (n, one, many) => { if(n) parts.push('<b>' + n + '</b> ' + (n === 1 ? one : many)); };
  add(k.children, 'ילד',           'ילדים');
  add(k.grand,    'נכד',           'נכדים');
  add(k.sibs,     'אח',            'אחים');
  add(k.nephews,  'אחיין',         'אחיינים');
  add(k.cousins,  'בן דוד',        'בני דודים');
  add(k.second,   'בן דוד שני',    'בני דודים שניים');
  if(!parts.length) return '';
  /* חץ לבדו לא אומר כלום. בלי המילה, אף אחד לא ידע שמסתתרים כאן
     קרובי המשפחה — וזה אחד הדברים המעניינים בכרטיס. */
  return '<button class="stats-tg" id="statsTg" aria-label="הצגת קרובי המשפחה">' +
      '<span>קרובי משפחה</span>' +
      '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" ' +
        'stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>' +
    '</button>' +
    '<p class="stats-line" id="statsLine" hidden>' +
      parts.join('<span class="stats-sep">·</span>') + '</p>';
}

/* מחזיר **טקסט רגיל**, לא HTML. הבריחה היא באחריות כל סינק,
   ורוב הקוראים כבר עושים esc. פעם אחת זה נכתב הפוך, והשם "ג'ו"
   הוצג בחמישה מקומות כ-&#39; במקום גרש. */
function relationText(id){
  const p = DB.people[id], m = p.gender === 'male';
  /* ממלא מקום נושא את השם 'לא ידוע' (ראו toPlaceholder), ולכן
     בדיקת מחרוזת ריקה לבדה לא תפסה אותו: התוצאה הייתה "נשואה
     ללא ידוע", שנקרא בעברית כ"נשואה ללא" — ההפך הגמור. כאן הוא
     נחשב חסר שם, והניסוח יורד למצב בלבד: "נשואה". */
  const nameOf = x => {
    const q = DB.people[x];
    return !q || q.placeholder ? '' : (q.name || '');
  };
  const asKid = DB.unions.find(u => u.children.includes(id));
  const bits = [];
  /* גם כאן: הורה ממלא מקום בלי שם הפיק "בן של חיים ו" */
  if(asKid){
    const ps = asKid.partners.map(nameOf).filter(Boolean);
    if(ps.length) bits.push((m ? 'בן של ' : 'בת של ') + ps.join(' ו'));
  }
  unionsOf(id).forEach(u => {
    const o = spouseIn(u, id);
    if(!o) return;
    const st = statusOf(u);
    const who = nameOf(o);
    /* בן זוג ממלא מקום הוא בלי שם, ואז מילת היחס נשארת תלויה
       באוויר — "נשואה ל" ותו לא. במקרה כזה נרשם המצב בלבד. */
    const word = !who
      ? (st === 'divorced' ? (m ? 'גרוש' : 'גרושה')
       : st === 'partners' ? (m ? 'בן זוג' : 'בת זוג')
       : (m ? 'נשוי' : 'נשואה'))
      : (st === 'divorced' ? (m ? 'גרוש מ' : 'גרושה מ')
       : st === 'partners' ? (m ? 'בן זוג של ' : 'בת זוג של ')
       : (m ? 'נשוי ל' : 'נשואה ל'));
    bits.push(word + who);
  });
  return bits.join(' · ') || 'שורש העץ';
}

/* ממרכז את האדם שנבחר, בתוך הרצועה שנשארת גלויה מעל הכרטיסייה */
function focusOn(id){
  if(!pos[id]) revealTo(id);
  if(!pos[id]) return;
  const topSafe = 88, sheetTop = innerHeight * 0.30;
  const s = Math.max(MIN_S, Math.min(1.05, (innerWidth - 96) / (CARD_W * 3)));
  scale = s;
  tx = innerWidth/2 - (RX(pos[id].x) + CARD_W/2) * s;
  ty = (topSafe + sheetTop)/2 - (pos[id].y + CARD_H/2) * s;
  canvas.style.transition = 'transform .4s cubic-bezier(.3,.7,0,1)';
  apply();
  setTimeout(() => canvas.style.transition = 'none', 420);
}

let sheetOrigin = null;   // מאיפה נפתחה הכרטיסייה, לצורך כפתור חזרה

/* התאמת רצועת התמונה ליחס של התמונה עצמה.
   כל מה שהועלה לפני המעבר ל-5:3 שמור כריבוע, ו-cover על ריבוע
   בתוך רצועה רחבה חותך 40% מהגובה — חצי מלמעלה, כלומר את הראש.
   תמונה צרה מהרצועה מוצגת לכן בגובה מלא וממורכזת, והשוליים
   מתמלאים בעותק המטושטש שכבר נמצא מאחוריה. */
function fitHero(root){
  const el = (root || document).querySelector('.hero-wide .shot');
  if(!el) return;
  const box = el.closest('.hero-wide');
  if(!box) return;
  const check = () => {
    const w = el.naturalWidth, h = el.naturalHeight;
    if(!w || !h) return;              // עוד לא נטענה, או שבורה
    /* סף קטן, כדי שתמונה שהיא כבר 5:3 לא תיפול לכאן בגלל עיגול */
    box.classList.toggle('fit', (w / h) < CROP_AR - 0.03);
  };
  if(el.complete) check();
  /* פעם אחת לכל תמונה. fitHero נקראת שוב כשהתמונה הגדולה מגיעה
     ומחליפה את src, ובלי הסימון היו נערמים מאזינים זהים. */
  if(el.dataset.fitWired !== '1'){
    el.dataset.fitWired = '1';
    el.addEventListener('load', check);
  }
}

function openSheet(id, origin){
  if(openId === id && sheet.classList.contains('show')) return;
  openSheetForce(id, origin);
}

function openSheetForce(id, origin){

  if(!p) return;                       // אדם שנמחק או שהוחלפה המשפחה

  /* imgTag מחזיר מחרוזת ריקה לכתובת שאינה עוברת את safeImg. התנאי
     הוא עליו ולא על p.photo, אחרת הייתה נוצרת רצועה ריקה לגמרי. */

  const topBar =
    (sheetOrigin === 'bday'

  /* תגית נוצרת רק כשיש מה לכתוב בה. אין מסגרות ריקות ואין
     הזמנות למלא — הכרטיס פשוט מתקצר. */
  const chips = [];
  const age = ageChip(p);
  if(age) chips.push(age);
  if(p.city) chips.push(p.city);
  if(p.death) chips.push((p.gender === 'male' ? 'נפטר ' : 'נפטרה ') + fmtDate(p.death));

  const notes = (p.notes && p.notes.length) ? p.notes : [];

  sheetBody.innerHTML = `
    ${shot ? `<div class="hero-wide">
      ${imgTag(p.photo || p.thumb, 'class="blur" alt="" aria-hidden="true"')}
      ${shot}
      <div class="shade"></div>
      <div class="sheet-top over">${topBar}</div>
      <div class="cap">
        <h2 id="sheetName">${title}</h2>
        <p class="sub">${esc(relationText(id))}</p>
      </div>
    </div>` : `<div class="sheet-top">${topBar}</div>
    <div class="hero-min">
      <div class="medal" id="heroAvatar" style="background:${tint};color:${tint}"
        ><span>${p.placeholder ? '?' : esc(p.name.charAt(0))}</span></div>
      <div class="txt">
        <h2 id="sheetName">${title}</h2>
        <p class="sub">${esc(relationText(id))}</p>
      </div>
    </div>`}
    ${chips.length ? `<div class="chips">${
      chips.map((c, i) => '<span' + (i === chips.length - 1 && p.death
        ? ' id="deathChip"' : '') + '>' + esc(c) + '</span>').join('')}</div>` : ''}
    ${FLOATING.has(id) ? `<p class="note" style="border-inline-start-color:var(--clay)">
      האדם הזה אינו מחובר לעץ. במצב עריכה אפשר לשייך אותו להורים,
      או לקשר אותו כבן/בת זוג של מישהו שנמצא בעץ.</p>` : ''}
    ${p.placeholder ? `<p class="note" style="border-inline-start-color:var(--wood)">

  if(SUPA.enabled && p.photoPath && !p.photo){

/* גרירת הידית כלפי מטה לסגירה */
const grab = document.getElementById('grab');
let dragY = null;
grab.addEventListener('pointerdown', e => {
  dragY = e.clientY; sheet.classList.add('dragging');
  grab.setPointerCapture(e.pointerId);
});
grab.addEventListener('pointermove', e => {
  if(dragY === null) return;
  const dy = Math.max(0, e.clientY - dragY);
  sheet.style.transform = `translateY(${dy}px)`;
});
grab.addEventListener('pointerup', e => {
  if(dragY === null) return;
  const dy = Math.max(0, e.clientY - dragY);
  dragY = null;
  sheet.classList.remove('dragging');
  sheet.style.transform = '';
  if(dy > 90) closeSheet();
});

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  /* כרטיס או לוח פתוח ⇒ ההודעה עולה למעלה. למטה היא ישבה על
     טקסט שהמשתמש קורא באותו רגע — פתק, שדה בטופס — ולמשך
     שתי שניות וחצי הוא פשוט לא היה שם. */
  const over = document.querySelector('#sheet.show, #panel.show');
  t.classList.toggle('top', !!over);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

   מודול 8 — לוח כללי, טופס הוספה, בקשות ממתינות, ימי הולדת

let role = null;                       // 'guest' או 'admin'

/* איפוס גלילה אמין: גם מיד וגם בפריים הבא, כי בזמן שהחלון
   עדיין מוסתר הדפדפן לפעמים משחזר את המיקום הקודם. */
function resetScroll(el){
  if(!el) return;
  el.scrollTop = 0;
  requestAnimationFrame(() => { el.scrollTop = 0; });
  setTimeout(() => { el.scrollTop = 0; }, 60);
}

function openPanel(title, html, onMount, onBack){
  panelTitle.textContent = title;
  panelBody.innerHTML = html;
  panelBody.onclick = null;
  panelBody.classList.remove('confirming');
  panelBack.hidden = !onBack;
  panelBack.onclick = onBack || null;

  panel.classList.add('show');
  scrim.classList.add('show');
  scrim.classList.add('blocking');     // לוח הוא חלון חוסם — נגיעה ברקע סוגרת אותו
  syncChrome();
  if(onMount) onMount();
}
/* סרגל הכלים נעלם כשחלון פתוח, כדי לא להעמיס את המסך */
function syncChrome(){
  const bar = document.getElementById('topbar');
  const busy = panel.classList.contains('show') || sheet.classList.contains('show');
  /* הודעה שכבר מוצגת אינה יודעת שנפתח מעליה חלון. בלי השורה
     הזאת, "נכנסת כמנהל" מהמסך הקודם נשארה למטה וישבה על השדה
     הראשון של הטופס שנפתח אחריה. */
  const t = document.getElementById('toast');
  if(t && t.classList.contains('show')) t.classList.toggle('top', busy);
  if(!bar) return;
  bar.classList.toggle('tucked', busy);
}

function closePanel(){
  panel.classList.remove('show');
  scrim.classList.remove('blocking');
  if(!sheet.classList.contains('show')) scrim.classList.remove('show');
  syncChrome();
}
