/* חיבור מרחף כבן/בת זוג של מישהו שנמצא בעץ */
function spouseBlocker(id, targetId){
  if(!targetId) return null;
  if(id === targetId) return 'אי אפשר לקשר אדם לעצמו';
  const t = DB.people[targetId];
  if(!t) return 'האדם לא נמצא';
  if(unionsOf(targetId).length >= 2) return t.name + ' כבר רשום/ה בשתי מערכות';
  if(unionsOf(id).length >= 2) return 'לאדם הזה כבר רשומות שתי מערכות';
  if(unionsOf(targetId).some(u => u.partners.includes(id))) return 'הקשר כבר קיים';
  const below = descendantsOf(id); below.add(id);
  if(below.has(targetId)) return 'אי אפשר לקשר אדם לצאצא שלו';
  const a = yearOfDate((DB.people[id] || {}).birth), b = yearOfDate(t.birth);
  if(a && b && Math.abs(a - b) > 40) return soft('הפרש הגילאים גדול מ-40 שנה');
  return null;
}

function applySpouseLink(id, targetId){
  if(!targetId) return;
  const u = {id: newUid(), partners: [targetId, id], children: [], status: 'married'};
  DB.unions.push(u);
  expanded.add(u.id);
  for(const k in SUB) delete SUB[k];
}

/* בורר אדם לחיבור כבן/בת זוג */
function pickSpouse(id, onPick, onBack){
  /* רק חסימות אמיתיות מוציאות מהרשימה. קודם גם הפרש גיל גדול
     הוציא אדם מהרשימה — והמנהל פשוט לא מצא אותו, בלי שום הסבר. */
  const all = Object.values(DB.people).filter(p => {
    const b = spouseBlocker(id, p.id);
    return !b || isSoft(b);
  });
  openPanel('חיבור כבן/בת זוג',
    '<div class="field"><input id="psq" placeholder="חיפוש לפי שם" autocomplete="off"></div>' +
    '<div id="pslist"></div>',
    () => {
      const q = panelBody.querySelector('#psq'), box = panelBody.querySelector('#pslist');
      const draw = () => {
        const t = (q.value || '').trim();
        const hit = (t ? all.filter(p => fullName(p).includes(t)) : all).sort(byFirstName);
        box.innerHTML = hit.length
          ? hit.map(p => personRow(p, personSubtitle(p), null, t)).join('')
          : '<p class="empty">לא נמצא מי שאפשר לקשר אליו</p>';
      };
      q.addEventListener('input', draw);
      box.addEventListener('click', e => {
        const r = e.target.closest('.prow');
        if(r) onPick(r.dataset.id);
      });
      draw();
    }, onBack);
}

/* ניתוק זוגיות. מי שנשאר הוא האדם שנערך.
   אם לא נשארו ילדים, השורה נמחקת לגמרי. */
function dissolveUnion(uid, keepId){
  const i = DB.unions.findIndex(u => u.id === uid);
  if(i < 0) return;
  const u = DB.unions[i];
  u.partners = u.partners.filter(p => p === keepId);
  if(!u.children.length){ expanded.delete(u.id); DB.unions.splice(i, 1); }
  delete hostOf[uid];
  for(const k in SUB) delete SUB[k];
}

function applyFields(p, d){
  p.gender = d.gender || p.gender;
  if(p.placeholder && (d.name || '').trim() && d.name !== 'לא ידוע') delete p.placeholder;
  if(p.gender !== 'female') d.maiden = '';     // שם נעורים לא רלוונטי לגבר
  ['name','surname','maiden','birth','death','city','phone','email'].forEach(k => {
    if(d[k]) p[k] = d[k]; else delete p[k];
  });
  /* הזעירה צמודה לגדולה: שתיהן נכנסות יחד ויוצאות יחד,
     כדי שלא יישאר לעולם כרטיס עם תמונה ישנה בעץ וחדשה בכרטיסייה. */
  if(d.photo) p.photo = d.photo; else delete p.photo;
  if(d.photo && d.thumb) p.thumb = d.thumb; else delete p.thumb;
  markPhotoForUpload(p, d);
  if(d.parentUnion !== undefined) applyReparent(p.id, d.parentUnion);
  if(d.spouseOf) { applySpouseLink(p.id, d.spouseOf); d.spouseOf = null; }
  /* תאריך לידה שהשתנה מבטל את התאריך העברי השמור לאותו אדם */
  if(d.birth !== undefined && d.birth !== p.birth) delete heCache[p.id];
  if(d.notes){
    const kept = d.notes.filter(n => (n.text || '').trim())
                        .map(n => ({id: n.id, text: n.text.trim(), by: n.by}));
    if(kept.length) p.notes = kept; else delete p.notes;
  }
  if(d.unions) Object.keys(d.unions).forEach(uid => {
    if(d.unions[uid] === 'none'){ dissolveUnion(uid, p.id); return; }
    const u = DB.unions.find(x => x.id === uid);
    if(u){ u.status = d.unions[uid]; delete u.married; }
  });
  for(const k in SUB) delete SUB[k];
}

          const bad = validatePerson(d) || relationalIssue(p.id, d);
          /* אזהרה רכה מוצגת למשתמש אבל אינה עוצרת את הבקשה.

            fm.querySelector('#erErr').innerHTML = '<p class="err">לא שינית שום דבר</p>'; return;
          }
          const acts = fm.querySelector('#erActions');
          const html = acts.innerHTML;
          panelBody.classList.add('confirming');
          acts.innerHTML =
            '<div style="width:100%"><p class="err" style="color:var(--ink)">' +
              'לשלוח ' + plural(changed.length, 'שינוי אחד', 'שינויים') +
              ' על ' + esc(fullName(p)) +
              ' לאישור?</p><div class="form-actions">' +
              '<button class="btn btn-primary" id="erYes">כן</button>' +
              '<button class="btn btn-ghost" id="erNope">לא</button></div></div>';
          fm.querySelector('#erYes').onclick = () => {
            panelBody.classList.remove('confirming');
            pending.push({id:newRid(), kind:'edit', target:chosen, by, data:d,
                          at:new Date().toISOString()});
            refreshReqChip();
            closePanel();
            toast('בקשת העריכה נשלחה לאישור');
          };
          fm.querySelector('#erNope').onclick = () => {
            panelBody.classList.remove('confirming');
            acts.innerHTML = html;
            wireSend();
          };
        };
        };
        wireSend();
      });
    });
}

/* אילו שדות באמת שונים מהרשום בעץ כרגע */
function diffFields(p, d){
  const cur = snapshot(p);
  const keys = ['gender','photo'].concat(FIELDS.map(f => f.k));
  return keys.filter(k => (d[k] || '') !== (cur[k] || ''));
}
const labelOf = k => k === 'gender' ? 'מגדר' : k === 'photo' ? 'תמונה'
  : k === 'notes' ? 'פתקים' : k === 'placeholder' ? 'ממלא מקום'
  : (FIELDS.find(f => f.k === k) || {}).label || k;
const showVal = (k, v) => !v ? '(ריק)' : k === 'gender' ? GENDER_HE(v)
  : k === 'photo' ? 'תמונה חדשה' : v;
const showCell = (k, v) => k === 'photo' && v
  ? (imgTag(v, 'style="width:54px;height:54px;border-radius:50%;object-fit:cover"')
     || '<span class="muted">תמונה שאינה תקינה</span>')
  : esc(showVal(k, v));

/* ---------- מסך אישור לבקשות עריכה ----------
   כמה בקשות על אותו אדם מאוחדות למסך אחד. שדה שנשלח יותר מפעם
   אחת בערכים שונים מחייב בחירה מפורשת לפני שאפשר לאשר אותו. */
const editReqsFor = t => pending.filter(r => r.kind === 'edit' && r.target === t);

function openEditReview(target){
  if(!isAdmin()) return;
  const grp = editReqsFor(target);
  if(!grp.length) return openRequests();
  const p = DB.people[target];
  if(!p){ toast('האדם שהבקשה מתייחסת אליו נמחק'); return openRequests(); }

  const cur = snapshot(p);
  const keys = ['gender','photo'].concat(FIELDS.map(f => f.k));

  /* לכל שדה, אילו ערכים שונים הוצעו ומאיזו בקשה */
  const cand = {};
  keys.forEach(k => {
    const list = [];
    grp.forEach((r, i) => {
      const v = r.data[k] || '';
      if(v === (cur[k] || '')) return;
      if(!list.some(c => c.v === v)) list.push({v, i});
    });
    if(list.length) cand[k] = list;
  });
  const changed = Object.keys(cand);

  const st = grp[0];
  if(!st._accept) st._accept = new Set();
  if(!st._choice) st._choice = {};
  if(!st._seen)   st._seen = new Set();
  const accept = st._accept, choice = st._choice;
  /* שדה שמופיע לראשונה ויש לו גרסה יחידה מסומן אוטומטית.
     שדה שכבר הוצג שומר על מה שהמנהל סימן, גם אם נוספה בקשה חדשה. */
  changed.forEach(k => {
    if(!st._seen.has(k)){ st._seen.add(k); if(cand[k].length === 1) accept.add(k); }
  });
  [...accept].forEach(k => { if(!changed.includes(k)) accept.delete(k); });

  const ordinal = (i, n) => 'בקשה ' + (i + 1) + (i === n - 1 && n > 1 ? ' (האחרונה)' : '');

  const rows = changed.map(k => {
    const list = cand[k];
    const multi = list.length > 1;
    const picked = multi ? choice[k] : 0;
    const on = accept.has(k);
    return '<div class="diff" data-k="' + k + '">' +
      '<div class="dk">' + labelOf(k) + (multi ? ' · נשלחו ' + list.length + ' גרסאות' : '') + '</div>' +
      '<div class="dv old' + (cur[k] ? '' : ' empty') + '">' + showCell(k, cur[k]) + '</div>' +
      (multi
        ? '<div class="opts">' + list.map((c, j) =>
            '<button class="opt' + (picked === j ? ' on' : '') + '" data-j="' + j + '">' +
            '<span class="tag">' + ordinal(c.i, grp.length) + '</span>' +
            showCell(k, c.v) + '</button>').join('') + '</div>'
        : '<div class="dv new' + (list[0].v ? '' : ' empty') + '">' + showCell(k, list[0].v) + '</div>') +
      '<button class="ok' + (on ? ' on' : '') + '"' + (multi && picked == null ? ' disabled' : '') + '>' +
        (on ? 'מאושר' : multi && picked == null ? 'בחרו גרסה' : 'לא מאושר') + '</button>' +
    '</div>';
  }).join('');

  const senders = [...new Set(grp.map(r => r.by).filter(Boolean))];
  openPanel('בקשת עריכה — ' + fullName(p),
    '<div class="form-head"><b>' + esc(fullName(p)) + '</b>' +
      '<span>' + esc(personSubtitle(p)) + '</span></div>' +
    '<p class="by-line">' + (senders.length ? 'נשלח על ידי ' + esc(senders.join(', '))
                                            : 'לא צוין מי שלח') + '</p>' +
    (grp.length > 1
      ? '<p class="note" style="margin:0 0 14px">אוחדו ' + grp.length +
        ' בקשות על אותו אדם. שדה שנשלח כמה פעמים מחייב בחירה.</p>' : '') +
    (changed.length ? rows : '<p class="empty">כבר אין הבדל בין הבקשות לרשום בעץ</p>') +
    '<div id="evActions" class="form-actions">' +
      '<button class="btn btn-primary" id="evOk">אישור השינויים המסומנים</button>' +
      '<button class="btn btn-ghost" id="evNo" style="color:var(--clay);border-color:#E0BDB6">דחייה</button>' +
    '</div>' +
    '<p class="note">הערך העליון הוא מה שרשום בעץ כרגע. אפשר לאשר חלק מהשינויים ולדחות את השאר.</p>',
  () => {
    const g = i => panelBody.querySelector('#' + i);

    panelBody.querySelectorAll('.diff .opt').forEach(b => b.onclick = () => {
      const row = b.closest('.diff'), k = row.dataset.k;
      choice[k] = Number(b.dataset.j);
      accept.add(k);                       // בחירה מסמנת אוטומטית לאישור
      openEditReview(target);
    });

    panelBody.querySelectorAll('.diff .ok').forEach(b => b.onclick = () => {
      const k = b.closest('.diff').dataset.k;
      if(cand[k].length > 1 && choice[k] == null){ toast('קודם בוחרים גרסה'); return; }
      if(accept.has(k)) accept.delete(k); else accept.add(k);
      openEditReview(target);
    });

    const confirmStep = (text, run) => {
      panelBody.classList.add('confirming');
      g('evActions').innerHTML =
        '<div style="width:100%"><p class="err" style="color:var(--ink)">' + text + '</p>' +
        '<div class="form-actions"><button class="btn btn-primary" id="evYes">כן</button>' +
        '<button class="btn btn-ghost" id="evNope">לא</button></div></div>';
      g('evYes').onclick  = () => { panelBody.classList.remove('confirming'); run(); };
      g('evNope').onclick = () => { panelBody.classList.remove('confirming'); openEditReview(target); };
    };

    const dropGroup = () => {
      grp.forEach(r => { const i = pending.indexOf(r); if(i >= 0) pending.splice(i, 1); });
    };

    g('evOk').onclick = () => {
      if(!accept.size){ toast('לא סומן אף שינוי'); return; }
      confirmStep('להחיל ' + plural(accept.size, 'שינוי אחד', 'שינויים') +
                  ' על ' + esc(fullName(p)) + '?', () => {
        const merged = snapshot(p);
        accept.forEach(k => { merged[k] = cand[k][cand[k].length > 1 ? choice[k] : 0].v; });
        const bad = validatePerson(merged) || relationalIssue(target, merged);
        /* המנהל כבר אישר במפורש — אזהרה רכה מוצגת ולא עוצרת */
        if(bad && !isSoft(bad)){ toast(bad); return openEditReview(target); }
        if(bad) toast(softText(bad));
        applyFields(p, merged);
        dropGroup();
        refreshReqChip(); layout(); render();
        toast('השינויים הוחלו');
        openRequests();
      });
    };
    g('evNo').onclick = () => confirmStep(
      'למחוק ' + (grp.length > 1 ? 'את ' + grp.length + ' הבקשות' : 'את הבקשה') + '?', () => {
        dropGroup();
        refreshReqChip(); toast('נדחה');
        openRequests();
      });
  },
  openRequests);
}

   מודול 11 — הוספת סיפור או הערה על בן משפחה

/* הטופס מקבל אדם מראש כשנפתח מתוך הכרטיס, ומתחיל בחיפוש כשנפתח
   מהסרגל. המבנה זהה בשני המקרים — רק שורת החיפוש כבר מלאה. */
function openNoteRequest(preId){
  closeMore();
  const pre = preId && DB.people[preId] ? DB.people[preId] : null;
  openPanel('הוספת פתק',
    '<div class="field"><label>על מי הפתק?</label>' +
      '<input id="nrq" placeholder="הקלידו שם" autocomplete="off"' +
      (pre ? ' value="' + esc(fullName(pre)) + '"' : '') + '></div>' +
      '<div id="nrSugg"></div><div id="nrForm"></div>',
    () => {
      const q = panelBody.querySelector('#nrq');
      const sg = panelBody.querySelector('#nrSugg');
      const fm = panelBody.querySelector('#nrForm');
      const all = visiblePeople();
      let chosen = null;

      q.addEventListener('input', () => {
        const t = (q.value || '').trim();
        chosen = null; fm.innerHTML = '';
        if(!t){ sg.innerHTML = ''; return; }
        const hit = all.filter(p => fullName(p).includes(t)).sort(byFirstName).slice(0, 8);
        sg.innerHTML = hit.length
          ? '<div class="sugg">' + hit.map(p => personRow(p, personSubtitle(p), null, t)).join('') + '</div>'
          : '<p class="empty">לא נמצא</p>';
      });

      /* הכותרת היא התמונה לרוחב, כמו בכרטיס — כדי שלא יהיה ספק
         על מי כותבים. בלי תמונה: מדליון האות, באותה שורה. */
      const pick = p => {
        chosen = p.id;
        q.value = fullName(p);
        sg.innerHTML = '';
        resetScroll(panelBody);
        const shot = imgTag(p.photo || p.thumb, 'class="shot" alt=""');
        const tint = tintOf(p);
        fm.innerHTML =
          (shot
            ? '<div class="hero-wide inform">' +
                imgTag(p.photo || p.thumb, 'class="blur" alt="" aria-hidden="true"') + shot +
                '<div class="shade"></div><div class="cap">' +
                  '<h2>' + esc(fullName(p)) + '</h2>' +
                  '<p class="sub">' + esc(personSubtitle(p)) + '</p>' +
                '</div></div>'
            : '<div class="hero-min"><div class="medal" style="background:' + tint +
                ';color:' + tint + '"><span>' +
                (p.placeholder ? '?' : esc(p.name.charAt(0))) + '</span></div>' +
              '<div class="txt"><h2>' + esc(fullName(p)) + '</h2>' +
                '<p class="sub">' + esc(personSubtitle(p)) + '</p></div></div>') +
          '<p class="hint" style="margin:18px 0 0">זיכרון, כינוי, או משהו קטן — ' +
            'גם משפט אחד מספיק.</p>' +
          '<div class="nb-form">' +
            '<textarea id="nrText" rows="4" placeholder="הקישו כאן וכתבו…&#10;' +
              'מה הוא היה אומר, איך קראו לו, מה תמיד עשה"></textarea>' +
            '<div class="nb-sign" id="nrSign"><span>נכתב על ידי</span>' +
              '<input id="nrBy" placeholder="השם שלכם"></div>' +
          '</div>' +
          '<div id="nrErr"></div>' +
          '<div class="form-actions" id="nrActions">' +
            '<button class="btn btn-primary" id="nrSend">שליחה לאישור</button>' +
            '<button class="btn btn-ghost" id="nrCancel">ביטול</button></div>' +
          '<p class="send-note">יעבור לאישור מנהל המשפחה, ויופיע בכרטיס רק אחרי שיאשר.</p>';

        fitHero(fm);                 // אותה רצועה, אותה התאמה ליחס

        /* המחברת מתארכת לפי הכתיבה, והחתימה יורדת איתה */
        const ta = fm.querySelector('#nrText');
        const grow = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
        ta.addEventListener('input', grow);
        grow();

        fm.querySelector('#nrCancel').onclick = closePanel;
        fm.querySelector('#nrSend').onclick = () => {
          const byEl = fm.querySelector('#nrBy'), sign = fm.querySelector('#nrSign');
          const by = (byEl.value || '').trim();
          const text = (ta.value || '').trim();
          const err = fm.querySelector('#nrErr');
          sign.classList.remove('bad');
          /* בלי קו תחתון קל לפספס את שורת החתימה, ולכן ההודעה
             לבדה לא מספיקה — גם החתימה עצמה נצבעת. */
          if(!by){
            err.innerHTML = '<p class="err">צריך לרשום מי כתב את הפתק</p>';
            sign.classList.add('bad'); byEl.focus(); return;
          }
          if(!text){ err.innerHTML = '<p class="err">הפתק ריק</p>'; ta.focus(); return; }
          if(chosen !== p.id || !DB.people[chosen]){
            err.innerHTML = '<p class="err">משהו השתבש בבחירת האדם. פתחו את הטופס מחדש</p>';
            return;
          }
          pending.push({id:newRid(), kind:'note', target:chosen, by, text,
                        at:new Date().toISOString()});
          refreshReqChip(); closePanel();
          toast('הפתק נשלח לאישור');
        };
      };

      sg.addEventListener('click', e => {
        const row = e.target.closest('.prow');
        if(!row) return;
        const p = DB.people[row.dataset.id];
        if(p) pick(p);
      });

      if(pre) pick(pre);
    });
}

function openNoteReview(rid){

  const r = pending.find(x => x.id === rid);
  if(!r) return openRequests();
  const p = DB.people[r.target];
  if(!p){ toast('האדם שהסיפור מתייחס אליו נמחק'); return openRequests(); }

  openPanel('סיפור חדש',
    '<div class="form-head"><b>' + esc(fullName(p)) + '</b>' +
      '<span>' + esc(personSubtitle(p)) + '</span></div>' +
    '<p class="by-line">נשלח על ידי ' + esc(r.by || 'לא ידוע') + '</p>' +
    '<div class="notes-list">' + noteCard({text:r.text, by:r.by}) + '</div>' +
    '<div id="nvActions" class="form-actions">' +
      '<button class="btn btn-primary" id="nvOk">אישור והוספה</button>' +
      '<button class="btn btn-ghost" id="nvNo" style="color:var(--clay);border-color:#E0BDB6">דחייה</button>' +
    '</div>',
  () => {
    const g = i => panelBody.querySelector('#' + i);
    const confirmStep = (text, run) => {
      panelBody.classList.add('confirming');
      g('nvActions').innerHTML =
        '<div style="width:100%"><p class="err" style="color:var(--ink)">' + text + '</p>' +
        '<div class="form-actions"><button class="btn btn-primary" id="nvYes">כן</button>' +
        '<button class="btn btn-ghost" id="nvNope">לא</button></div></div>';
      g('nvYes').onclick  = () => { panelBody.classList.remove('confirming'); run(); };
      g('nvNope').onclick = () => { panelBody.classList.remove('confirming'); openNoteReview(rid); };
    };
    const drop = () => { const i = pending.indexOf(r); if(i >= 0) pending.splice(i, 1); };

    g('nvOk').onclick = () => confirmStep('להוסיף את הסיפור לכרטיס של ' + esc(fullName(p)) + '?', () => {
      /* גזירה גם כאן: המסד דוחה סיפור ריק, וסיפור שהגיע מהתור
         לא עבר בהכרח דרך אותו טופס. */
      const txt = (r.text || '').trim();
      if(txt) (p.notes = p.notes || []).push({text: txt, by: r.by || 'לא ידוע'});
      drop(); refreshReqChip();
      toast(txt ? 'הסיפור נוסף' : 'הסיפור היה ריק והוסר מהתור');
      openRequests();
    });
    g('nvNo').onclick = () => confirmStep('למחוק את הסיפור?', () => {
      drop(); refreshReqChip(); toast('הסיפור נדחה');
      openRequests();
    });
  },
  openRequests);
}

/* ---------- חיפוש מהתפריט: מוצא אדם ומביא אליו בעץ ---------- */
function openSearch(){
  closeMore();
  openPanel('חיפוש',
    '<div class="field"><input id="sq" placeholder="הקלידו שם" autocomplete="off"></div>' +
    '<div id="sres"></div>',
    () => {
      const q = panelBody.querySelector('#sq'), box = panelBody.querySelector('#sres');
      const draw = () => {
        const t = (q.value || '').trim();
        if(!t){ box.innerHTML = '<p class="empty">הקלידו שם פרטי או שם משפחה</p>'; return; }
        /* בלי תקרה. היה כאן slice(0,40) ששתק: במשפחה גדולה, מי
           שחיפש שם משפחה קיבל 40 ולא ידע שיש עוד — והסיק שהאדם
           אינו בעץ. */
        const hit = visiblePeople()
          .filter(p => fullName(p).includes(t) || (p.maiden || '').includes(t))
          .sort(byFirstName);
        box.innerHTML = hit.length
          ? hit.map(p => {
              /* כשההתאמה היא בשם נעורים בלבד, בלי ציון השורה
                 נראית כמו טעות — האדם ברשימה והשם שלו לא מכיל
                 את מה שהוקלד. */
              const sub = personSubtitle(p) +
                (!fullName(p).includes(t) && (p.maiden || '').includes(t)
                  ? ' · לבית ' + p.maiden : '');
              return personRow(p, sub, null, t);
            }).join('')
          : '<p class="empty">לא נמצא אף אחד בשם "' + esc(t) + '".<br>' +
            '<span style="font-size:13.5px">אפשר לנסות חלק מהשם בלבד, או שם נעורים.</span></p>' +
            '<div class="search-add"><p>חסר מישהו?</p>' +
              '<button class="btn btn-ghost" id="sAdd">הוספת בן משפחה</button></div>';
        const add = box.querySelector('#sAdd');
        /* אין "הוספה" בלי נקודת חיבור: כל אדם נתלה במישהו שכבר
           בעץ. הכפתור סוגר את הדרך הסתומה ואומר מה הצעד הבא. */
        if(add) add.onclick = () => {
          closePanel();
          toast('פתחו בעץ את מי שהאדם החדש מתחבר אליו, ובחרו הוספה');
        };
      };
      q.addEventListener('input', draw);
      box.addEventListener('click', e => {
        const r = e.target.closest('.prow');
        if(!r) return;
        const id = r.dataset.id;
        closePanel();
        revealTo(id);                 // פותח בעץ רק את הדרך אליו
        openSheet(id);                // וממקד עליו
      });
      draw();
    });
}

/* ============================================================
   מודול 13 — עדכונים ממנהלים אחרים
   ------------------------------------------------------------
   שלושה כללים שקובעים את כל ההתנהגות כאן:

   1. העותק המקומי והעותק "מה שהשרת מחזיק" מתעדכנים תמיד יחד.
      אם רק אחד מהם יתעדכן, ההשוואה הבאה תראה הפרש מדומה
      ותנסה לשלוח בחזרה לשרת את מה שהרגע קיבלנו ממנו.

   2. המסך לא משתנה תחת הידיים. אם פתוח כרטיס, טופס או תור
      הבקשות — מופיעה הודעה, והטעינה מחכה שהמשתמש יסיים.

   3. שינוי מקומי שטרם נשמר לא נדרס בשום מצב.
   ============================================================ */

/* טביעת האצבע האחרונה שראינו מהשרת: מספר שורות והחותמת האחרונה
   בכל טבלה. מחרוזת זהה פירושה ששום דבר לא זז, ואין מה לטעון. */
let srvStamp = null;
let remoteWaiting = false;     // יש עדכון שממתין לרגע נוח
let stampBusy = false;

const readStamp = () =>
  api('/rest/v1/rpc/tree_stamp', {method: 'POST', body: {}})
    .catch(e => { if(e && e.auth) onAuthLost(); return null; });

/* האסימון פג, או בוטל מהשרת כדי לנתק את כולם.
   בלי הטיפול הזה המשתמש היה נתקע: נקודה אדומה שחוזרת ונכשלת,
   הודעה שאומרת "היכנסו מחדש" — ושום דרך להיכנס מחדש בלי לרענן
   את הדף, מה שמוחק גם את מה שטרם נשמר. */
let authLostShown = false;
function onAuthLost(){
  if(authLostShown || !role) return;
  authLostShown = true;
  const unsaved = hasLocalEdits();
  saveToken(null);
  role = null;
  syncHalted = true;
  remoteWaiting = false; hideRemoteNotice();
  closePanel(); closeSheet(); closeRing();
  applyRole();
  setSyncState('saved');
  loginBox.classList.remove('hide');
  document.getElementById('loginErr').innerHTML =
    '<p class="err">החיבור פג. יש להיכנס שוב' +
    (unsaved ? '. שימו לב: שינוי אחרון טרם נשמר ויש לבצע אותו שוב' : '') + '</p>';
}

/* יש שינוי מקומי שעדיין לא הגיע לשרת? */
const hasLocalEdits = () => !!(SAVED && planCount(planSync(DB, SAVED)));

/* "עסוק" = המשתמש באמצע משהו שטעינה הייתה קורעת באמצע.
   כל אלה קיימים תמיד ב-HTML ונפתחים במחלקה, ולכן נבדקת המחלקה
   ולא עצם קיומם — אחרת התנאי היה "עסוק" לנצח. */
const shown = id => {
  const el = document.getElementById(id);
  return !!el && el.classList.contains('show');
};
function uiBusy(){
  /* הייבוא והטפסים נפתחים בתוך panel או sheet, ולכן הם מכוסים כאן.
     לא נבדק כאן draft: סגירה ב-X או ב-Escape אינה מאפסת אותו, והוא
     היה נשאר מלא עד סוף הסשן — כלומר "עסוק" לנצח, וכל העדכונים
     ממנהלים אחרים היו מושבתים בלי שאיש ישים לב. */
  return shown('panel') || shown('sheet') || shown('lightbox') ||
         shown('cropper') || !!ringOwner || syncing;
}

/* השאלה הזולה: האם בכלל יש מה לטעון */
async function pollServer(){
  /* לא בודקים בזמן שאנחנו עצמנו כותבים: באמצע כתיבה הטביעה בשרת
     כבר זזה בגללנו, והבדיקה הייתה מדווחת על "מנהל אחר" שלא היה. */
  if(!SUPA.enabled || !role || !SAVED || stampBusy || syncing) return;
  let s = null;
  stampBusy = true;
  try { s = await readStamp(); } finally { stampBusy = false; }
  if(typeof s !== 'string') return;          // תקלת רשת — ננסה בסיבוב הבא

  /* אין קו פתיחה אמין — למשל אחרי בדיקה שנכשלה. במצב הזה אי אפשר
     לדעת אם ההפרש הוא שלנו או של מנהל אחר, ולכן טוענים בשקט
     ובלי הודעה, רק כדי להיות בטוחים שאנחנו מעודכנים. */
  if(srvStamp === null){
    srvStamp = s;
    if(!hasLocalEdits() && !syncHalted && !uiBusy()) await refreshFromServer();
    return;
  }

  if(s !== srvStamp){ srvStamp = s; remoteWaiting = true; }
  if(remoteWaiting) await applyRemote();
}

/* מביא את העדכון — אבל רק כשזה לא פוגע במשתמש */
async function applyRemote(){
  if(!remoteWaiting) return;

  /* שינוי מקומי שטרם נשמר קודם לכל. השמירה תרוץ בעצמה, ובסיבוב
     הבא כבר יהיה בטוח לטעון. אם השמירה נעצרה אחרי כשלונות —
     לא נוגעים בעץ בכלל, אחרת עבודה של המשתמש תימחק. */
  if(hasLocalEdits() || syncHalted){ showRemoteNotice(true); return; }
  if(uiBusy()){ showRemoteNotice(false); return; }

  remoteWaiting = false;
  hideRemoteNotice();
  const ok = await refreshFromServer();
  if(ok) toast('העץ עודכן על ידי מנהל אחר');
  else remoteWaiting = true;                 // נכשל — ננסה שוב
}

/* ההודעה בסרגל. היא לא מחליפה שום דבר על המסך — רק מודיעה. */
function showRemoteNotice(blocked){
  const el = document.getElementById('remoteNote');
  if(!el) return;
  /* קצר בכוונה: בסרגל של טלפון כל מילה נוספת דוחקת את שם המשפחה.
     ההסבר המלא יושב ב-title ובהודעה הקופצת. */
  el.textContent = blocked ? 'עדכון ממתין' : 'עדכון חדש · רענון';
  el.title = blocked
    ? 'מנהל אחר עדכן את העץ. העדכון ייכנס אחרי שהשינויים שלך יישמרו'
    : 'מנהל אחר עדכן את העץ. לחצו כדי לטעון';
  el.hidden = false;
  el.onclick = blocked ? null : () => { if(!uiBusy()) applyRemote(); };
}
function hideRemoteNotice(){
  const el = document.getElementById('remoteNote');
  if(el) el.hidden = true;
}

/* טוען מחדש מהשרת. מחזיר אם הצליח. */
async function refreshFromServer(){
  if(!SUPA.enabled || !role) return false;
  try {
    const fresh = await loadTree();
    await adoptServerTree(fresh);
    for(const k in SUB) delete SUB[k];
    layout(); render();
    return true;
  } catch(e){
    return false;   /* רענון שנכשל אינו מפיל כלום — נשארים עם מה שיש */
  }
}

/* אחרי שמירה שלנו: הטביעה בשרת זזה בגללנו, ואם לא נעדכן אותה
   הסיבוב הבא היה מדווח על "עדכון מבחוץ" שלא היה.
   אם הבדיקה עצמה נכשלת, מוטב לאפס את קו הפתיחה מלהשאיר אותו
   שגוי: אפס פירושו "לא יודעים", והבדיקה הבאה תטען בשקט. */
async function restamp(){
  if(!SUPA.enabled || !role) return;
  const s = await readStamp();
  srvStamp = (typeof s === 'string') ? s : null;
  /* כל הפרש שנצבר תוך כדי הכתיבה שלנו הוא שלנו. אם במקרה נדיר
     מנהל אחר כתב בדיוק באותן שניות, השינוי שלו ייבלע כאן —
     ולכן קיימת ההתיישרות התקופתית שלמטה. */
  remoteWaiting = false;
  hideRemoteNotice();
}

/* התיישרות תקופתית — רשת הביטחון האחרונה.
   אחת לחמש דקות, כשהמסך פנוי ואין שום דבר שלא נשמר, נטען מחדש
   בשקט. זה מה שתופס עדכון שנבלע בגלל כתיבה שקרתה באותו רגע,
   או בדיקה שנכשלה בלי שאיש שם לב. */
async function reconcile(){
  if(!SUPA.enabled || !role || !SAVED) return;
  if(syncing || syncHalted || hasLocalEdits() || uiBusy()) return;
  await refreshFromServer();
}

/* חזרה לאפליקציה: בודקים מיד ולא מחכים לתור */
document.addEventListener('visibilitychange', () => {
  if(document.hidden) return;
  pollServer();
});

/* הבדיקה חוזרת כל 10 שניות. היא בקשה אחת קטנה שמחזירה מחרוזת
   אחת, ולכן אפשר להריץ אותה תכופות בלי להעמיס. */
if(SUPA.enabled) setInterval(pollServer, 10000);

/* והתיישרות מלאה אחת לחמש דקות, בשקט */
if(SUPA.enabled) setInterval(reconcile, 300000);

/* אם יש אסימון מהפעם הקודמת — נכנסים בלי לשאול סיסמה */
if(SUPA.enabled) resumeSession();

addEventListener('resize', () => apply());

/* --- הפעלה ראשונה --- */
layout();
render();
center(false);

/* פתיחה וסגירה של ענפים */
nodesEl.addEventListener('click', e => {
  const t = e.target.closest('.toggle');
  if(t) toggleUnion(t.dataset.union, t.dataset.side);
});

/* פריסה מלאה, וחזרה בדיוק למה שהיה פתוח קודם */
document.getElementById('btnAll').onclick = () => {
  closeMore();
  const all = DB.unions;
  if(all.every(u => expanded.has(u.id))){
    const back = savedExpanded || [];
    expanded.clear();
    back.forEach(id => expanded.add(id));
  } else {
    savedExpanded = [...expanded];
    all.forEach(u => expanded.add(u.id));
  }
  closeRing(); closeSheet();
  layout(); render(); center(true);
};
</script>
</body>
</html>
